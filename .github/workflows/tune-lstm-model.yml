name: Tune LSTM Regime Model

on:
  workflow_dispatch:
    inputs:
      trials:
        description: 'Number of Optuna trials'
        required: true
        default: '30'
      cv_splits:
        description: 'Number of cross-validation splits'
        required: true
        default: '5'
      symbol:
        description: 'Trading symbol'
        required: true
        default: 'BTC/USDT'

env:
  PYTHON_VERSION: '3.11'

jobs:
  tune-lstm:
    name: LSTM Hyperparameter Tuning
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: 📦 Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install optuna scikit-learn scipy
      
      - name: 📁 Create Directories
        run: mkdir -p logs/tuning_results data/models data/cache
      
      - name: 📊 Prepare Real Training Data
        run: |
          echo "======================================================================"
          echo "📊 FETCHING REAL MARKET DATA"
          echo "======================================================================"
          
          # Run data preparation script
          python scripts/prepare_training_data.py --symbol '${{ github.event.inputs.symbol }}'
          
          # Verify cache was created
          SYMBOL_SAFE=$(echo '${{ github.event.inputs.symbol }}' | sed 's/\//-/g')
          CACHE_FILE="data/cache/${SYMBOL_SAFE}_training_data.npz"
          
          if [ -f "$CACHE_FILE" ]; then
            echo "✅ Training data cached successfully: $CACHE_FILE"
            
            # Show data info
            python -c "import numpy as np; import sys; data=np.load(sys.argv[1]); X=data['X']; y=data['y']; print(f'\n📊 Cached Data Info:'); print(f'   Samples: {len(X)}'); print(f'   Features: {X.shape[1]}'); print(f'   Label classes: {len(np.unique(y))}'); unique, counts = np.unique(y, return_counts=True); print('   Distribution:'); labels=['Bullish','Bearish','Neutral','Volatile']; [print(f'     {labels[l]}: {c} ({c/len(y)*100:.1f}%)') for l,c in zip(unique,counts)]" "$CACHE_FILE"
          else
            echo "❌ Failed to cache training data"
            exit 1
          fi
          
          echo "======================================================================"
      
      - name: 🎯 Run LSTM Tuning
        run: |
          echo "Starting tuning with REAL cached data..."
          
          # Convert symbol format (BTC/USDT -> BTC-USDT)
          SYMBOL_SAFE=$(echo '${{ github.event.inputs.symbol }}' | sed 's/\//-/g')
          
          python scripts/tune_regime_models_standalone.py \
            --model lstm \
            --trials ${{ github.event.inputs.trials }} \
            --cv-splits ${{ github.event.inputs.cv_splits }} \
            --symbol "$SYMBOL_SAFE"
      
      - name: 📊 Extract Results
        id: results
        run: |
          FILE=$(ls -t logs/tuning_results/lstm_*.json 2>/dev/null | head -1)
          if [ -n "$FILE" ]; then
            echo "cv_score=$(jq -r '.cv_score // "N/A"' $FILE)" >> $GITHUB_OUTPUT
            echo "holdout_score=$(jq -r '.holdout_score // "N/A"' $FILE)" >> $GITHUB_OUTPUT
            echo "hidden_size=$(jq -r '.best_params.hidden_size // "N/A"' $FILE)" >> $GITHUB_OUTPUT
            echo "num_layers=$(jq -r '.best_params.num_layers // "N/A"' $FILE)" >> $GITHUB_OUTPUT
            echo "dropout=$(jq -r '.best_params.dropout // "N/A"' $FILE)" >> $GITHUB_OUTPUT
            echo "learning_rate=$(jq -r '.best_params.learning_rate // "N/A"' $FILE)" >> $GITHUB_OUTPUT
          fi
      
      - name: 📦 Upload Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lstm-tuning-results
          path: |
            logs/
            data/cache/*.npz
          retention-days: 30
      
      - name: 📝 Summary Report
        if: always()
        run: |
          {
            echo "# 🎯 LSTM Hyperparameter Tuning Results"
            echo ""
            echo "## 📊 Performance"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| CV Score | ${{ steps.results.outputs.cv_score }} |"
            echo "| Hold-out | ${{ steps.results.outputs.holdout_score }} |"
            echo "| Baseline (Phase B) | 0.433 |"
            echo ""
            echo "## 🏆 Best Parameters"
            echo ""
            echo "| Parameter | Value |"
            echo "|-----------|-------|"
            echo "| hidden_size | ${{ steps.results.outputs.hidden_size }} |"
            echo "| num_layers | ${{ steps.results.outputs.num_layers }} |"
            echo "| dropout | ${{ steps.results.outputs.dropout }} |"
            echo "| learning_rate | ${{ steps.results.outputs.learning_rate }} |"
            echo ""
            echo "## 📥 Download Results"
            echo ""
            echo "See artifacts above for detailed logs and cached data."
          } >> $GITHUB_STEP_SUMMARY
