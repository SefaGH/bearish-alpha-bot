name: 🧠 Train & Validate RL Agent

on:
  workflow_dispatch:
    inputs:
      log_level:
        description: "Python log level"
        required: true
        default: "INFO"
        type: choice
        options:
          - DEBUG
          - INFO
          - WARNING
          - ERROR
      exchange:
        description: "Exchange id (ccxt)"
        required: true
        default: "bingx"
        type: string
      symbol:
        description: "Trading symbol (CCXT format)"
        required: true
        default: "BTC/USDT:USDT"
        type: string
      timeframe:
        description: "Candle timeframe"
        required: true
        default: "1h"
        type: string
      candles:
        description: "Number of candles to fetch for RL dataset"
        required: true
        default: "6000"
        type: string
      episodes:
        description: "RL training episodes (override config ml.reinforcement_learning.training.episodes)"
        required: false
        default: "250"
        type: string
      save_every:
        description: "Checkpoint frequency in episodes"
        required: false
        default: "25"
        type: string
      run_headscale_diagnostics:
        description: "Run head-scale inspectors & migration pytest (Section 4)"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  train-and-validate-rl:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v3

      - name: 2. Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 3. Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Create directories
        run: |
          mkdir -p data/market_data
          mkdir -p data/training
          mkdir -p data/checkpoints
          mkdir -p data/models
          mkdir -p logs

      - name: 5. Fetch Historical Data
        run: |
          echo "======================================================================"
          echo "📥 STEP 5: Fetching Historical Data for RL"
          echo "======================================================================"
          
          SYMBOL_SANITIZED=$(echo "${{ github.event.inputs.symbol }}" | sed 's/\//_/g' | sed 's/:/_/g')
          TIMEFRAME="${{ github.event.inputs.timeframe }}"
          
          echo "Fetching ${TIMEFRAME} data for ${SYMBOL_SANITIZED}..."
          
          # GÜNCELLEME: prepare_training_data.py yerine yeni scripti kullanıyoruz
          python scripts/fetch_historical_data.py \
            --exchange "${{ github.event.inputs.exchange }}" \
            --symbol "${{ github.event.inputs.symbol }}" \
            --timeframe "${TIMEFRAME}" \
            --days 365 \
            --output "data/market_data/${SYMBOL_SANITIZED}_${TIMEFRAME}.csv" \
            --log-level "${{ github.event.inputs.log_level }}"

      - name: 6. Prepare RL Training Data (Feature Engineering)
        run: |
          echo "======================================================================"
          echo "🛠️ STEP 6: Generating Features & Splitting Data"
          echo "======================================================================"

          SYMBOL_SANITIZED=$(echo "${{ github.event.inputs.symbol }}" | sed 's/\//_/g' | sed 's/:/_/g')
          TIMEFRAME="${{ github.event.inputs.timeframe }}"
          
          # DÜZELTME: train-ratio 0.8 -> 0.7 yapıldı.
          # Böylece %15 Val, %15 Test kalır (~1300 satır) ve 512 limitine takılmaz.
          python scripts/prepare_rl_training_data.py \
            --input-file "data/market_data/${SYMBOL_SANITIZED}_${TIMEFRAME}.csv" \
            --output-dir "data/training" \
            --symbol "${{ github.event.inputs.symbol }}" \
            --timeframe "${TIMEFRAME}" \
            --train-ratio 0.7 \
            --log-level "${{ github.event.inputs.log_level }}"
            
          # Export variables for next steps
          echo "SYMBOL_SANITIZED=${SYMBOL_SANITIZED}" >> $GITHUB_ENV
          echo "TIMEFRAME=${TIMEFRAME}" >> $GITHUB_ENV

      - name: 7. Verify Dataset Existence
        run: |
          ls -lh data/training/
          if [ ! -f "data/training/${SYMBOL_SANITIZED}_${TIMEFRAME}_train.npz" ]; then
            echo "❌ Training dataset not found!"
            exit 1
          fi

      - name: 8. Train RL Agent
        run: |
          echo "======================================================================"
          echo "🚀 STEP 8: Training RL Agent"
          echo "======================================================================"
          
          RL_MODEL_DIR="data/checkpoints"
          RL_OUTPUT_DIR="data/training"
          
          # Export for next steps
          echo "RL_MODEL_DIR=${RL_MODEL_DIR}" >> $GITHUB_ENV
          echo "RL_OUTPUT_DIR=${RL_OUTPUT_DIR}" >> $GITHUB_ENV

          python scripts/train_rl_agent.py \
            --dataset "data/training/${SYMBOL_SANITIZED}_${TIMEFRAME}_train.npz" \
            --config "config/config.example.yaml" \
            --model-dir "${RL_MODEL_DIR}" \
            --summary-file "${RL_OUTPUT_DIR}/rl_training_summary.json" \
            --episodes "${{ github.event.inputs.episodes }}" \
            --save-every "${{ github.event.inputs.save_every }}" \
            --log-level "${{ github.event.inputs.log_level }}"

      - name: 9. Optional Replay / TD inspection (if script present)
        run: |
          echo "======================================================================"
          echo "🧩 STEP 9: Optional Replay / TD inspection (if script present)"
          echo "======================================================================"

          if [ -f "scripts/inspect_replay_and_td.py" ]; then
             # GÜNCELLENDİ: --dataset EKLENDİ
             python scripts/inspect_replay_and_td.py \
               --model "${RL_MODEL_DIR}/rl_agent_final.pth" \
               --dataset "data/training/${SYMBOL_SANITIZED}_${TIMEFRAME}_train.npz" \
               --replay "${RL_MODEL_DIR}/replay_buffer.pkl" || echo "Warning: Replay inspection failed (possibly no buffer file), continuing..."
          else
             echo "Script not found, skipping."
          fi

      - name: 10. Head-scale diagnostics & migration test
        if: github.event.inputs.run_headscale_diagnostics == 'true'
        run: |
          echo "======================================================================"
          echo "🧪 STEP 10: Head-scale diagnostics & migration test"
          echo "======================================================================"

          # GÜNCELLENDİ: --dataset EKLENDİ (ZORUNLU)
          python scripts/inspect_head_gradient.py \
            --model "${RL_MODEL_DIR}/rl_agent_final.pth" \
            --dataset "data/training/${SYMBOL_SANITIZED}_${TIMEFRAME}_train.npz" \
            --batch-size 32

          echo "Running unit tests for migration logic..."
          pytest tests/unit/test_head_scale_migration.py

      - name: 11. Evaluate RL Agent (Out-of-sample Test)
        run: |
          echo "======================================================================"
          echo "📊 STEP 11: Evaluating RL Agent on TEST set (deterministic backtest)"
          echo "======================================================================"

          python scripts/evaluate_rl_agent.py \
            --model "${RL_MODEL_DIR}/rl_agent_final.pth" \
            --dataset "data/training/${SYMBOL_SANITIZED}_${TIMEFRAME}_test.npz" \
            --output-summary "${RL_OUTPUT_DIR}/rl_eval_summary.json" \
            --output-equity-curve "${RL_OUTPUT_DIR}/rl_eval_equity_curve.csv" \
            --log-level "${{ github.event.inputs.log_level }}"

      - name: 12. Validate RL Agent (Out-of-sample)
        run: |
          echo "======================================================================"
          echo "🔍 STEP 12: Validating RL Agent"
          echo "======================================================================"
          
          python scripts/validate_rl_model.py \
            --dataset "data/training/${SYMBOL_SANITIZED}_${TIMEFRAME}_val.npz" \
            --checkpoint "${RL_MODEL_DIR}/rl_agent_final.pth" \
            --config "config/config.example.yaml" \
            --report-file "${RL_OUTPUT_DIR}/rl_validation_report.json" \
            --log-level "${{ github.event.inputs.log_level }}"

      - name: 13. Summarize Validation
        run: |
          if [ -f "scripts/summarize_rl_validation.py" ]; then
            python scripts/summarize_rl_validation.py "${REPORT}"
          else
            echo "Validation report not found at ${REPORT}"
          fi
        env:
          REPORT: ${{ steps.validate_rl.outputs.validation_report }}
          
      - name: 14. Collect RL training artifacts
        run: |
          echo "======================================================================"
          echo "📦 STEP 14: Collecting RL artifacts for upload"
          echo "======================================================================"

          mkdir -p artifacts/rl

          # Dataset metadata & training summaries
          cp -v "${RL_OUTPUT_DIR}/"*_metadata.json artifacts/rl/ 2>/dev/null || true
          cp -v "${RL_OUTPUT_DIR}/rl_training_summary.json" artifacts/rl/ 2>/dev/null || true
          cp -v "${RL_OUTPUT_DIR}/rl_validation_report.json" artifacts/rl/ 2>/dev/null || true

          # NEW: RL evaluation artifacts (TEST backtest)
          cp -v "${RL_OUTPUT_DIR}/rl_eval_summary.json" artifacts/rl/ 2>/dev/null || true
          cp -v "${RL_OUTPUT_DIR}/rl_eval_equity_curve.csv" artifacts/rl/ 2>/dev/null || true

          # Model files
          cp -v "${RL_MODEL_DIR}/rl_agent_final.pth" artifacts/rl/ 2>/dev/null || true

          if [ -d "${RL_MODEL_DIR}" ]; then
            mkdir -p artifacts/rl/checkpoints
            cp -v "${RL_MODEL_DIR}/"*.pth artifacts/rl/checkpoints/ 2>/dev/null || true
          fi

          if [ -d "logs" ]; then
            mkdir -p artifacts/rl/logs
            cp -rv logs artifacts/rl/logs/ 2>/dev/null || true
          fi

      - name: 15. Upload RL artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rl-training-results
          path: artifacts/rl/
