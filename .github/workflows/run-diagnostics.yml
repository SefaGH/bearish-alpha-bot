name: Run Diagnostics

on:
  workflow_dispatch:
    inputs:
      model_path:
        description: 'Path to model file in repo (e.g. data/models/rl_agent_final.pth)'
        required: true
        default: 'data/models/rl_agent_final.pth'
      samples_path:
        description: 'Path to sample CSV (optional, leave empty if none)'
        required: false
        default: 'sample_data/test_samples.csv'
      limit:
        description: 'Optional row limit from CSV'
        required: false
        default: ''
      out:
        description: 'Output report JSON path'
        required: false
        default: 'diagnostics/report.json'
      out_dir:
        description: 'Diagnostics output directory (optional)'
        required: false
        default: 'diagnostics'

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MPLBACKEND: Agg
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src:${{ github.workspace }}/scripts
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip setuptools wheel
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            # Sizin script dosyanız (diagnose_model_confidence.py) bu kütüphaneleri 
            # (pandas, torch, joblib, yaml) isteğe bağlı olarak kullandığı için
            # buraya ekliyoruz.
            pip install --prefer-binary torch pandas scikit-learn joblib numpy PyYAML
          fi
          pip install --prefer-binary matplotlib pillow

      - name: Ensure diagnostics directories exist
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p diagnostics
          if [ -n "${{ github.event.inputs.out_dir }}" ]; then
            mkdir -p "${{ github.event.inputs.out_dir }}"
          fi

      # --- BURASI DÜZELTİLDİ ---
      # 'Write inspect_model.py' adımı (hatalı olan) SİLİNDİ.
      # Artık script'i doğrudan repo'dan çalıştırıyoruz.

      - name: Inspect model checkpoint (dump keys/types)
        shell: bash
        env:
          MODEL_PATH: ${{ github.event.inputs.model_path }}
        run: |
          set -euo pipefail
          # YAML içine gömülü kod yerine, projedeki dosyayı çalıştırıyoruz:
          python scripts/inspect_model.py

      - name: Run diagnostics script
        shell: bash
        env:
          MODEL_PATH: ${{ github.event.inputs.model_path }}
          SAMPLES_PATH: ${{ github.event.inputs.samples_path }}
          LIMIT: ${{ github.event.inputs.limit }}
          OUT: ${{ github.event.inputs.out }}
          OUT_DIR: ${{ github.event.inputs.out_dir }}
        run: |
          set -euo pipefail
          echo "PYTHONPATH=$PYTHONPATH"
          mkdir -p "$OUT_DIR"
          ARGS=(--model "$MODEL_PATH" --out "$OUT" --out-dir "$OUT_DIR")
          if [[ -n "${SAMPLES_PATH}" ]]; then
            ARGS+=(--csv "$SAMPLES_PATH")
          fi
          if [[ -n "${LIMIT}" ]]; then
            ARGS+=(--limit "$LIMIT")
          fi
          # Bu, sizin sağladığınız ana script:
          python scripts/diagnose_model_confidence.py "${ARGS[@]}" \
            2>&1 | tee diagnostics/diagnostics_stdout.log || true

      - name: Upload diagnostics as artifact
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics
          path: |
            diagnostics/
            ${{ github.event.inputs.out_dir }}/
          if-no-files-found: warn
          retention-days: 7
