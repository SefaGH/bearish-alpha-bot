name: Run Diagnostics

on:
  workflow_dispatch:
    inputs:
      model_path:
        description: 'Path to model file in repo (e.g. data/models/rl_agent_final.pth)'
        required: true
        default: 'data/models/rl_agent_final.pth'
      samples_path:
        description: 'Path to sample CSV (optional, leave empty if none)'
        required: false
        default: 'sample_data/test_samples.csv'
      scaler_path:
        description: 'Path to scaler file (optional, leave empty if none)'
        required: false
        default: 'data/models/scaler.pkl'
      state_import:
        description: 'Python import path for state vector builder (e.g. env.state_vector) (optional)'
        required: false
        default: 'env.state_vector'
      model_class_import:
        description: 'Optional: model class import path if model is state_dict (e.g. src.ml.reinforcement_learning.TradingRLAgent)'
        required: false
        default: ''
      label_col:
        description: 'Label column name in samples CSV (optional)'
        required: false
        default: 'label'

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install torch pandas scikit-learn joblib numpy
          fi
          # Ensure matplotlib + pillow are present (headless-friendly)
          pip install matplotlib pillow --no-cache-dir

      - name: Ensure diagnostics directory exists
        run: mkdir -p diagnostics

      - name: Run diagnostics script
        shell: bash
        env:
          MODEL_PATH: ${{ github.event.inputs.model_path }}
          SAMPLES_PATH: ${{ github.event.inputs.samples_path }}
          SCALER_PATH: ${{ github.event.inputs.scaler_path }}
          STATE_IMPORT: ${{ github.event.inputs.state_import }}
          MODEL_CLASS_IMPORT: ${{ github.event.inputs.model_class_import }}
          LABEL_COL: ${{ github.event.inputs.label_col }}
          MPLBACKEND: Agg
        run: |
          CMD="python scripts/diagnose_model_confidence.py --model \"${MODEL_PATH}\""
          if [ -n "${SAMPLES_PATH}" ]; then CMD="${CMD} --samples \"${SAMPLES_PATH}\""; fi
          if [ -n "${SCALER_PATH}" ]; then CMD="${CMD} --scaler \"${SCALER_PATH}\""; fi
          if [ -n "${STATE_IMPORT}" ]; then CMD="${CMD} --state-import \"${STATE_IMPORT}\""; fi
          if [ -n "${MODEL_CLASS_IMPORT}" ]; then CMD="${CMD} --model-class-import \"${MODEL_CLASS_IMPORT}\""; fi
          if [ -n "${LABEL_COL}" ]; then CMD="${CMD} --label-col \"${LABEL_COL}\""; fi
          echo "Running: $CMD"
          set -o pipefail
          $CMD 2>&1 | tee diagnostics/diagnostics_stdout.log || true

      - name: Upload diagnostics as artifact
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics
          path: diagnostics/
