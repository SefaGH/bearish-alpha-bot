name: Run Diagnostics

on:
  workflow_dispatch:
    inputs:
      model_path:
        description: 'Path to model file in repo (e.g. data/models/rl_agent_final.pth)'
        required: true
        default: 'data/models/rl_agent_final.pth'
      samples_path:
        description: 'Path to sample CSV (optional, leave empty if none)'
        required: false
        default: 'sample_data/test_samples.csv'
      limit:
        description: 'Optional row limit from CSV'
        required: false
        default: ''
      out:
        description: 'Output report JSON path'
        required: false
        default: 'diagnostics/report.json'
      out_dir:
        description: 'Diagnostics output directory (optional)'
        required: false
        default: 'diagnostics'

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install torch pandas scikit-learn joblib numpy
          fi
          # Ensure matplotlib + pillow are present (headless-friendly)
          pip install matplotlib pillow --no-cache-dir

      - name: Ensure diagnostics directory exists
        run: mkdir -p diagnostics

      - name: Run diagnostics script
        shell: bash
        env:
          MODEL_PATH: ${{ github.event.inputs.model_path }}
          SAMPLES_PATH: ${{ github.event.inputs.samples_path }}
          LIMIT: ${{ github.event.inputs.limit }}
          OUT: ${{ github.event.inputs.out }}
          OUT_DIR: ${{ github.event.inputs.out_dir }}
          MPLBACKEND: Agg
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src:${{ github.workspace }}/scripts
        run: |
          echo "PYTHONPATH=$PYTHONPATH"
          # Build command using the current script's flags (--csv, --out, --out-dir)
          CMD="python scripts/diagnose_model_confidence.py --model \"${MODEL_PATH}\""
          if [ -n "${SAMPLES_PATH}" ]; then CMD="${CMD} --csv \"${SAMPLES_PATH}\""; fi
          if [ -n "${LIMIT}" ]; then CMD="${CMD} --limit ${LIMIT}"; fi
          if [ -n "${OUT}" ]; then CMD="${CMD} --out \"${OUT}\""; fi
          if [ -n "${OUT_DIR}" ]; then CMD="${CMD} --out-dir \"${OUT_DIR}\""; fi
          echo "Running: $CMD"
          set -o pipefail
          $CMD 2>&1 | tee diagnostics/diagnostics_stdout.log || true

      - name: Upload diagnostics as artifact
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics
          path: diagnostics/
