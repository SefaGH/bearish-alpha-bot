name: Test Feature Engineering Improvements

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: 'Trading symbol'
        required: true
        default: 'BTC/USDT'
      variance_threshold:
        description: 'Variance threshold for feature selection'
        required: true
        default: '0.01'
      correlation_threshold:
        description: 'Correlation threshold for feature selection'
        required: true
        default: '0.05'

env:
  PYTHON_VERSION: '3.11'

jobs:
  test-features:
    name: Test All Feature Improvements
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      # ========================================================================
      # SETUP ENVIRONMENT
      # ========================================================================
      
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
      
      - name: 🐍 Verify and Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: ✅ Verify Python Version
        run: |
          echo "======================================================================"
          echo "🐍 PYTHON VERSION CHECK"
          echo "======================================================================"
          python --version
          python -c "import sys; assert sys.version_info[:2] == (3, 11), f'Wrong Python version: {sys.version}'"
          echo "✅ Python 3.11 confirmed"
          echo "======================================================================"
      
      - name: 📦 Install Dependencies
        run: |
          echo "======================================================================"
          echo "📦 INSTALLING DEPENDENCIES"
          echo "======================================================================"
          pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          # Install additional ML/analysis dependencies
          pip install optuna scipy matplotlib seaborn
          echo "✅ Dependencies installed"
          echo "======================================================================"
      
      - name: 📁 Create Directories
        run: |
          mkdir -p logs data/cache data/models logs/tuning_results
          echo "✅ Directories created"
      
      # ========================================================================
      # STEP 1: FEATURE ANALYSIS TEST
      # ========================================================================
      
      - name: 📊 Step 1 - Feature Analysis Test
        id: feature_analysis
        run: |
          echo "======================================================================"
          echo "📊 STEP 1: FEATURE ANALYSIS TEST"
          echo "======================================================================"
          echo ""
          
          # First need to prepare data for analysis
          echo "Preparing training data first..."
          python scripts/prepare_training_data.py --symbol '${{ github.event.inputs.symbol }}'
          
          echo ""
          echo "Running feature analysis..."
          python scripts/analyze_features.py --analyze --report \
            --variance-threshold ${{ github.event.inputs.variance_threshold }} \
            --correlation-threshold ${{ github.event.inputs.correlation_threshold }}
          
          echo ""
          echo "Verifying feature analysis report..."
          if [ -f "logs/feature_analysis_report.md" ]; then
            echo "✅ Feature analysis report created"
            echo "report_exists=true" >> $GITHUB_OUTPUT
            
            # Display report summary (first 100 lines)
            echo ""
            echo "=== REPORT SUMMARY (First 100 lines) ==="
            head -n 100 logs/feature_analysis_report.md
            echo "=== END SUMMARY ==="
            
            # Extract statistics
            if grep -q "Total features:" logs/feature_analysis_report.md; then
              TOTAL=$(grep "Total features:" logs/feature_analysis_report.md | grep -oE '[0-9]+' | head -1)
              echo "total_features=$TOTAL" >> $GITHUB_OUTPUT
              echo "Total features: $TOTAL"
            fi
            
            if grep -q "Low variance:" logs/feature_analysis_report.md; then
              LOW_VAR=$(grep "Low variance:" logs/feature_analysis_report.md | grep -oE '[0-9]+' | head -1)
              echo "low_variance=$LOW_VAR" >> $GITHUB_OUTPUT
              echo "Low variance features: $LOW_VAR"
            fi
            
          else
            echo "❌ Feature analysis report not found!"
            echo "report_exists=false" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          echo ""
          echo "======================================================================"
          echo "✅ STEP 1 COMPLETE"
          echo "======================================================================"
      
      # ========================================================================
      # STEP 2: FEATURE SELECTION TEST
      # ========================================================================
      
      - name: 🎯 Step 2 - Feature Selection Test
        id: feature_selection
        run: |
          echo "======================================================================"
          echo "🎯 STEP 2: FEATURE SELECTION TEST"
          echo "======================================================================"
          echo ""
          
          echo "Running feature selection..."
          python scripts/analyze_features.py --select \
            --variance-threshold ${{ github.event.inputs.variance_threshold }} \
            --correlation-threshold ${{ github.event.inputs.correlation_threshold }}
          
          echo ""
          echo "Verifying feature selection mask..."
          if [ -f "data/cache/feature_selection_mask.npy" ]; then
            echo "✅ Feature selection mask created"
            echo "mask_exists=true" >> $GITHUB_OUTPUT
            
            # Count selected features using Python
            SELECTED=$(python3 -c "import numpy as np; mask = np.load('data/cache/feature_selection_mask.npy'); print(np.sum(mask))")
            TOTAL=$(python3 -c "import numpy as np; mask = np.load('data/cache/feature_selection_mask.npy'); print(len(mask))")
            REMOVED=$((TOTAL - SELECTED))
            
            echo "selected_features=$SELECTED" >> $GITHUB_OUTPUT
            echo "total_features=$TOTAL" >> $GITHUB_OUTPUT
            echo "removed_features=$REMOVED" >> $GITHUB_OUTPUT
            
            echo ""
            echo "=== SELECTION SUMMARY ==="
            echo "Total features:    $TOTAL"
            echo "Selected features: $SELECTED"
            echo "Removed features:  $REMOVED"
            echo "Selection rate:    $((SELECTED * 100 / TOTAL))%"
            echo "=== END SUMMARY ==="
            
            # Validate expected range (45-50 features from 82)
            if [ $SELECTED -ge 40 ] && [ $SELECTED -le 55 ]; then
              echo "✅ Feature count in expected range (40-55)"
            else
              echo "⚠️  Warning: Feature count outside expected range (expected 40-55, got $SELECTED)"
            fi
            
          else
            echo "❌ Feature selection mask not found!"
            echo "mask_exists=false" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          echo ""
          echo "======================================================================"
          echo "✅ STEP 2 COMPLETE"
          echo "======================================================================"
      
      # ========================================================================
      # STEP 3: DATA PREPARATION TEST
      # ========================================================================
      
      - name: 🗄️  Step 3 - Data Preparation Test
        id: data_prep
        run: |
          echo "======================================================================"
          echo "🗄️  STEP 3: DATA PREPARATION TEST"
          echo "======================================================================"
          echo ""
          
          # Prepare symbol-safe version
          SYMBOL_SAFE=$(echo '${{ github.event.inputs.symbol }}' | sed 's/\//-/g')
          CACHE_FILE="data/cache/${SYMBOL_SAFE}_training_data.npz"
          
          echo "Re-running data preparation to apply feature selection..."
          python scripts/prepare_training_data.py --symbol '${{ github.event.inputs.symbol }}'
          
          echo ""
          echo "Verifying cached training data..."
          if [ -f "$CACHE_FILE" ]; then
            echo "✅ Training data cached: $CACHE_FILE"
            echo "cache_exists=true" >> $GITHUB_OUTPUT
            
            # Display file info
            ls -lh "$CACHE_FILE"
            
            # Extract data shape using Python
            echo ""
            echo "=== DATA SHAPE ==="
            cat > /tmp/check_data.py << 'PYEOF'
          import numpy as np
          import sys
          cache_file = sys.argv[1]
          data = np.load(cache_file)
          X = data['X']
          y = data['y']
          print(f'X shape: {X.shape}')
          print(f'y shape: {y.shape}')
          print(f'Samples: {len(X)}')
          print(f'Features: {X.shape[1]}')
          if X.shape[1] <= 50:
              print('✅ Feature selection appears to be applied')
          else:
              print('⚠️  Warning: Feature count seems high')
          PYEOF
            python3 /tmp/check_data.py "${CACHE_FILE}"
            echo "=== END SHAPE ==="
            
          else
            echo "❌ Training data cache not found: $CACHE_FILE"
            echo "cache_exists=false" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          echo ""
          echo "======================================================================"
          echo "✅ STEP 3 COMPLETE"
          echo "======================================================================"
      
      # ========================================================================
      # STEP 4: QUICK LSTM TEST
      # ========================================================================
      
      - name: 🧪 Step 4 - Quick LSTM Test
        id: lstm_test
        run: |
          echo "======================================================================"
          echo "🧪 STEP 4: QUICK LSTM TEST"
          echo "======================================================================"
          echo ""
          
          SYMBOL_SAFE=$(echo '${{ github.event.inputs.symbol }}' | sed 's/\//-/g')
          
          echo "Running quick LSTM test (1 trial, 3 CV splits)..."
          python scripts/tune_regime_models_standalone.py \
            --model lstm \
            --trials 1 \
            --cv-splits 3 \
            --symbol "$SYMBOL_SAFE"
          
          echo ""
          echo "Verifying test results..."
          
          # Find most recent results file
          RESULTS_FILE=$(ls -t logs/tuning_results/lstm_*.json 2>/dev/null | head -1)
          
          if [ -n "$RESULTS_FILE" ] && [ -f "$RESULTS_FILE" ]; then
            echo "✅ Results file created: $RESULTS_FILE"
            echo "results_exists=true" >> $GITHUB_OUTPUT
            
            # Extract key metrics
            echo ""
            echo "=== TEST RESULTS ==="
            cat "$RESULTS_FILE" | python3 -m json.tool | head -50
            echo "=== END RESULTS ==="
            
            # Verify no serialization errors by checking file is valid JSON
            if python3 -c "import json; json.load(open('$RESULTS_FILE'))" 2>/dev/null; then
              echo "✅ JSON serialization working correctly"
              echo "json_valid=true" >> $GITHUB_OUTPUT
            else
              echo "❌ JSON file appears to be invalid"
              echo "json_valid=false" >> $GITHUB_OUTPUT
              exit 1
            fi
            
            # Extract test accuracy
            CV_SCORE=$(python3 -c "import json; print(json.load(open('$RESULTS_FILE')).get('cv_score', 'N/A'))")
            HOLDOUT_SCORE=$(python3 -c "import json; print(json.load(open('$RESULTS_FILE')).get('holdout_score', 'N/A'))")
            
            echo ""
            echo "CV Score: $CV_SCORE"
            echo "Hold-out Score: $HOLDOUT_SCORE"
            
            echo "cv_score=$CV_SCORE" >> $GITHUB_OUTPUT
            echo "holdout_score=$HOLDOUT_SCORE" >> $GITHUB_OUTPUT
            
            # Validate non-zero accuracy
            if [ "$HOLDOUT_SCORE" != "N/A" ] && [ "$HOLDOUT_SCORE" != "0" ] && [ "$HOLDOUT_SCORE" != "0.0" ]; then
              echo "✅ Test accuracy is non-zero"
            else
              echo "⚠️  Warning: Test accuracy appears to be zero or unavailable"
            fi
            
          else
            echo "❌ Results file not found!"
            echo "results_exists=false" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          echo ""
          echo "======================================================================"
          echo "✅ STEP 4 COMPLETE - No crashes, clean execution"
          echo "======================================================================"
      
      # ========================================================================
      # STEP 5: RESULTS SUMMARY
      # ========================================================================
      
      - name: 📦 Step 5 - Upload Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feature-improvements-test-${{ github.run_number }}
          path: |
            logs/
            data/cache/*.npz
            data/cache/*.npy
          retention-days: 30
      
      - name: 📝 Step 5 - Generate Summary Report
        if: always()
        run: |
          {
            echo "# ✅ Feature Engineering Improvements - Test Results"
            echo ""
            echo "**Workflow Run:** #${{ github.run_number }}"
            echo "**Symbol:** ${{ github.event.inputs.symbol }}"
            echo "**Variance Threshold:** ${{ github.event.inputs.variance_threshold }}"
            echo "**Correlation Threshold:** ${{ github.event.inputs.correlation_threshold }}"
            echo ""
            
            echo "---"
            echo ""
            echo "## 📊 Step 1: Feature Analysis"
            echo ""
            if [ "${{ steps.feature_analysis.outputs.report_exists }}" = "true" ]; then
              echo "✅ **Status:** PASSED"
              echo ""
              echo "- Feature analysis report generated"
              echo "- Total features detected: ${{ steps.feature_analysis.outputs.total_features }}"
              echo "- Low variance features: ${{ steps.feature_analysis.outputs.low_variance }}"
            else
              echo "❌ **Status:** FAILED"
              echo ""
              echo "- Feature analysis report not created"
            fi
            echo ""
            
            echo "---"
            echo ""
            echo "## 🎯 Step 2: Feature Selection"
            echo ""
            if [ "${{ steps.feature_selection.outputs.mask_exists }}" = "true" ]; then
              echo "✅ **Status:** PASSED"
              echo ""
              echo "| Metric | Value |"
              echo "|--------|-------|"
              echo "| Total features | ${{ steps.feature_selection.outputs.total_features }} |"
              echo "| Selected features | ${{ steps.feature_selection.outputs.selected_features }} |"
              echo "| Removed features | ${{ steps.feature_selection.outputs.removed_features }} |"
              echo ""
              
              SELECTED="${{ steps.feature_selection.outputs.selected_features }}"
              if [ "$SELECTED" -ge 40 ] && [ "$SELECTED" -le 55 ]; then
                echo "✅ Feature count in expected range (40-55)"
              else
                echo "⚠️  Feature count: $SELECTED (expected 40-55)"
              fi
            else
              echo "❌ **Status:** FAILED"
              echo ""
              echo "- Feature selection mask not created"
            fi
            echo ""
            
            echo "---"
            echo ""
            echo "## 🗄️  Step 3: Data Preparation"
            echo ""
            if [ "${{ steps.data_prep.outputs.cache_exists }}" = "true" ]; then
              echo "✅ **Status:** PASSED"
              echo ""
              echo "- Training data successfully cached"
              echo "- Feature selection applied"
            else
              echo "❌ **Status:** FAILED"
              echo ""
              echo "- Training data cache not created"
            fi
            echo ""
            
            echo "---"
            echo ""
            echo "## 🧪 Step 4: Quick LSTM Test"
            echo ""
            if [ "${{ steps.lstm_test.outputs.results_exists }}" = "true" ]; then
              echo "✅ **Status:** PASSED"
              echo ""
              echo "| Metric | Value |"
              echo "|--------|-------|"
              echo "| CV Score | ${{ steps.lstm_test.outputs.cv_score }} |"
              echo "| Hold-out Score | ${{ steps.lstm_test.outputs.holdout_score }} |"
              echo "| JSON Valid | ${{ steps.lstm_test.outputs.json_valid }} |"
              echo ""
              
              if [ "${{ steps.lstm_test.outputs.json_valid }}" = "true" ]; then
                echo "✅ JSON serialization working correctly"
              else
                echo "❌ JSON serialization issue detected"
              fi
              
              echo "✅ No crashes detected - clean execution"
            else
              echo "❌ **Status:** FAILED"
              echo ""
              echo "- LSTM test did not complete successfully"
            fi
            echo ""
            
            echo "---"
            echo ""
            echo "## 🎉 Final Summary"
            echo ""
            
            # Check if all critical steps passed
            if [ "${{ steps.feature_analysis.outputs.report_exists }}" = "true" ] && \
               [ "${{ steps.feature_selection.outputs.mask_exists }}" = "true" ] && \
               [ "${{ steps.data_prep.outputs.cache_exists }}" = "true" ] && \
               [ "${{ steps.lstm_test.outputs.results_exists }}" = "true" ] && \
               [ "${{ steps.lstm_test.outputs.json_valid }}" = "true" ]; then
              echo "### ✅ ALL TESTS PASSED"
              echo ""
              echo "**Ready for full hyperparameter tuning workflow!**"
              echo ""
              echo "All 4 merged PRs validated:"
              echo "1. ✅ JSON serialization fix"
              echo "2. ✅ Feature analysis tool"
              echo "3. ✅ Enhanced feature engineering (82 features)"
              echo "4. ✅ Feature selection integration (→ ~45 features)"
              echo ""
              echo "**Next Steps:**"
              echo "- Run full 30-trial hyperparameter tuning"
              echo "- Compare results with baseline"
              echo "- Deploy improved models"
            else
              echo "### ⚠️  SOME TESTS FAILED"
              echo ""
              echo "Please review the test results above and fix any issues before proceeding."
            fi
            
          } >> $GITHUB_STEP_SUMMARY
