name: Test pandas-ta Installation

on:
  workflow_dispatch:

jobs:
  test-installation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12']
        pandas-ta-version:
          - "pandas-ta==0.4.67b0"
          - "pandas-ta==0.4.71b0"
          - "pandas-ta"

    steps:
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Upgrade pip
      run: python -m pip install --upgrade pip

    - name: Attempt to install ${{ matrix.pandas-ta-version }}
      id: install_test
      continue-on-error: true
      run: pip install --pre "${{ matrix.pandas-ta-version }}"

    - name: Report Status for ${{ matrix.pandas-ta-version }}
      run: |
        if [[ ${{ steps.install_test.outcome }} == 'success' ]]; then
          echo "✅ SUCCESS: '${{ matrix.pandas-ta-version }}' installed successfully on Python ${{ matrix.python-version }}"
          echo "--------------------------------------------------"
        else
          echo "❌ FAILURE: '${{ matrix.pandas-ta-version }}' FAILED to install on Python ${{ matrix.python-version }}"
          echo "--------------------------------------------------"
          exit 1
        fi
