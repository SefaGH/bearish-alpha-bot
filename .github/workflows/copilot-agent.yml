name: Copilot Agent

on:
  workflow_dispatch:

jobs:
  run-copilot-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout (full)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true
          persist-credentials: true

      - name: Remove stale git lock if exists
        run: |
          if [ -f .git/index.lock ]; then
            echo "Removing stale index.lock"
            rm -f .git/index.lock
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Safe diff against main
        run: |
          bash scripts/ci/git-safe-diff.sh || echo "Diff step non-critical"

      - name: Run Copilot Agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/agent/run.js

      - name: Post diagnostics
        if: always()
        run: |
          echo "Job status: ${{ job.status }}"
