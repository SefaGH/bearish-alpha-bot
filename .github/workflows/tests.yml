# .github/workflows/tests.yml
name: Tests

on: [push, pull_request]

jobs:
  # 'test-with-docker' işi gereksiz olduğu ve tüm testleri çalıştırdığı için kaldırıldı.
  # Sadece odaklı ve PR ile ilgili testleri yapan aşağıdaki işi kullanıyoruz.
  focused-pr-tests:
    name: Focused PR Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Configure PYTHONPATH
        run: echo "PYTHONPATH=${{ github.workspace }}/src:${{ github.workspace }}" >> $GITHUB_ENV

      - name: 1. Generate necessary model files for tests
        run: |
          mkdir -p data/checkpoints tests/data
          # Canonical head-scale checkpoint
          python -c "from pathlib import Path; from src.ml.reinforcement_learning import TradingRLAgent; agent = TradingRLAgent(state_size=87, action_size=3, config={'head_scale_learnable': True}); agent.save_model('data/checkpoints/rl_agent_head_scale_ci.pth')"
          # Legacy checkpoint fixture
          python tests/data/create_legacy_head_checkpoint.py --out tests/data/legacy_rl_agent_head_scale.pth --meta tests/data/legacy_rl_agent_head_scale_meta.json --legacy-log-value 0.0

      - name: 2. Run Inspector Scripts as tests
        run: |
          echo "### Inspecting head-scale parameter wiring... ###"
          python scripts/inspect_head_param.py --model data/checkpoints/rl_agent_head_scale_ci.pth --state-size 87 --head-scale-learnable --head-scale-min 0.1 --initial-head-scale 1.0
          echo "### Probing head-scale gradients... ###"
          python scripts/inspect_head_gradient.py --model data/checkpoints/rl_agent_head_scale_ci.pth --state-size 87 --head-scale-learnable --head-scale-min 0.1 --batch-size 16

      - name: 3. Run focused Pytest tests for the PR
        run: |
          pytest tests/unit/test_head_scale_migration.py \
                 tests/test_reinforcement_learning_agent.py \
                 tests/test_rl_bypass.py \
                 -v --tb=short
