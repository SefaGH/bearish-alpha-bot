name: Live Trading Launcher (Ultimate Continuous Mode)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Trading Mode'
        required: true
        default: 'paper'
        type: choice
        options:
          - paper
          - live

      confirm_live:
        description: 'Type YES to confirm live trading (required for live mode)'
        required: false
        type: string
        default: ''

      duration:
        description: 'Trading duration in seconds (leave empty for indefinite)'
        required: false
        type: string
        default: ''

      enable_ml:
        description: 'Enable ML (Installs torch, scikit-learn, etc.)'
        required: true
        default: true
        type: boolean  

      dry_run:
        description: 'Dry run mode (pre-flight checks only)'
        required: true
        default: false
        type: boolean

      skip_preflight:
        description: 'Skip pre-flight checks (not recommended for live trading)'
        required: true
        default: false
        type: boolean

      infinite:
        description: 'Enable Layer 1: TRUE CONTINUOUS MODE (never stops)'
        required: true
        default: false
        type: boolean

      auto_restart:
        description: 'Enable Layer 2: AUTO-RESTART FAILSAFE'
        required: true
        default: false
        type: boolean

    # max_restarts:
    #   description: 'Maximum restart attempts'
    #   required: false
    #   type: string
    #   default: '1000'

      restart_delay:
        description: 'Base restart delay in seconds'
        required: false
        type: string
        default: '30'

      debug_mode:
        description: 'Enable debug mode (detailed logging)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  validate-inputs:
    name: Validate Configuration
    runs-on: ubuntu-latest
    outputs:
      should_proceed: ${{ steps.validate.outputs.should_proceed }}
      skip_preflight: ${{ steps.validate.outputs.skip_preflight }}

    steps:
      # KRİTİK: Repository'yi checkout et
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ensure project packages importable
        run: |
          echo "Setting PYTHONPATH for module imports..."
          echo "PYTHONPATH=${{ github.workspace }}:${{ github.workspace }}/src" >> $GITHUB_ENV

      - name: Verify Python Version
        run: |
          python --version
          python -c "import sys; assert sys.version_info[:2] == (3, 11), f'Expected Python 3.11, got {sys.version}'"

      - name: Install PyYAML for validation
        run: pip install pyyaml

      - name: Validate Live Trading Confirmation
        id: validate
        run: |
          MODE="${{ github.event.inputs.mode }}"
          CONFIRM="${{ github.event.inputs.confirm_live }}"
          SKIP_PREFLIGHT="${{ github.event.inputs.skip_preflight }}"

          echo "Mode: $MODE"
          echo "Confirmation: $CONFIRM"
          echo "Skip Pre-flight: $SKIP_PREFLIGHT"

          # Live mode confirmation check
          if [ "$MODE" = "live" ] && [ "$CONFIRM" != "YES" ]; then
            echo "❌ ERROR: Live trading requires typing 'YES' in the confirm_live field"
            echo "should_proceed=false" >> $GITHUB_OUTPUT
            exit 1
          fi

          # Warning for skipping pre-flight in live mode
          if [ "$MODE" = "live" ] && [ "$SKIP_PREFLIGHT" = "true" ]; then
            echo "⚠️ WARNING: Skipping pre-flight checks in LIVE mode is not recommended!"
            echo "⚠️ This may result in unexpected behavior or trading errors."
          fi

          echo "✅ Validation passed"
          echo "should_proceed=true" >> $GITHUB_OUTPUT
          echo "skip_preflight=$SKIP_PREFLIGHT" >> $GITHUB_OUTPUT

      - name: Install repository for validation script
        run: |
          pip install --upgrade pip
          pip install -e .

      - name: Validate Adaptive Configuration
        if: github.event.inputs.skip_preflight != 'true'
        run: |
          echo "🔍 Checking config file..."
          if [ ! -f "config/config.example.yaml" ]; then
            echo "❌ Config file not found!"
            exit 1
          fi
          
          echo "📋 Config file contents (first 20 lines):"
          head -n 20 config/config.example.yaml
          
          python scripts/validate_adaptive_config.py

      - name: Skip Pre-flight Notice
        if: github.event.inputs.skip_preflight == 'true'
        run: |
          echo "⏭️ PRE-FLIGHT CHECKS SKIPPED"
          echo "=================================="
          echo "⚠️ WARNING: Pre-flight validation has been bypassed"
          echo "⚠️ Proceeding directly to trading execution"
          echo "=================================="

  pre-flight-checks:
    name: Pre-Flight System Checks
    runs-on: ubuntu-latest
    needs: validate-inputs
    if: |
      needs.validate-inputs.outputs.should_proceed == 'true' && 
      needs.validate-inputs.outputs.skip_preflight != 'true'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Ensure project packages importable
        run: |
          echo "Setting PYTHONPATH for module imports..."
          echo "PYTHONPATH=${{ github.workspace }}:${{ github.workspace }}/src" >> $GITHUB_ENV

      - name: Ensure logs and data directories + placeholders
        run: |
          mkdir -p logs data
          touch data/state.json data/day_stats.json
          : > logs/.placeholder || true

      - name: Install Dependencies
        shell: bash
        run: |
          python -V
          python -m pip install --upgrade pip wheel
          python -m pip install "setuptools<81"
          pip install --no-cache-dir 'aiohttp==3.8.6' 'yarl<2.0' 'multidict<7.0'
          pip install --no-cache-dir TA-Lib
          pip install --no-cache-dir 'websocket-client>=1.6.0' 'websockets>=10.0'
          
          if [ "${{ github.event.inputs.enable_ml }}" = "true" ]; then
            echo "ML is enabled. Installing all dependencies for pre-flight..."
            pip install --no-cache-dir -r requirements.txt
          else
            echo "ML is disabled. Installing core dependencies only for pre-flight..."
            sed '/# === MACHINE LEARNING (Optional) ===/,$d' requirements.txt | pip install --no-cache-dir -r /dev/stdin
          fi
          
          echo "✅ Dependencies installed successfully"
          python -m pip install -e .
          echo "✅ Repository package installed."

      - name: Export GEMMA environment
        if: github.event.inputs.enable_ml == 'true'
        run: |
          echo "GEMMA_ENABLED=true" >> $GITHUB_ENV
          echo "ML_ACTIVE_BUNDLE=artifacts/gemma/final" >> $GITHUB_ENV
          echo "✅ GEMMA environment variables exported"

      - name: Prepare GEMMA artifacts
        shell: bash
        run: |
          set -e
          bash scripts/setup_gemma_artifacts.sh
          bash scripts/setup_ml_model_links.sh

      - name: Validate GEMMA manifest and PPO agent
        shell: bash
        run: |
          set -e
      
          # 1) GEMMA manifest kontrolü
          if [ ! -f artifacts/gemma/final/manifest.json ]; then
            echo "❌ GEMMA manifest not found"
            exit 1
          fi
      
          python - <<'PY'
          import json
          from pathlib import Path
      
          manifest = Path('artifacts/gemma/final/manifest.json')
          data = json.loads(manifest.read_text(encoding='utf-8'))
          feature_count = data.get('feature_count')
          if feature_count != 82:
              raise SystemExit(f"Expected GEMMA feature_count=82, got {feature_count}")
          print("✅ GEMMA manifest feature count verified (82 features)")
          PY
      
          # 2) PPO model path kontrolü (config ile uyumlu)
          PPO_PATH="artifacts/ppo/ppo_trading_agent.zip"
          if [ ! -f "$PPO_PATH" ]; then
            echo "❌ PPO model not found at $PPO_PATH"
            exit 1
          fi
          echo "✅ PPO model found at $PPO_PATH"

      - name: Run Dry-Run Pre-Flight Checks
        env:
          ML_ENABLED: ${{ github.event.inputs.enable_ml }}
          GEMMA_ENABLED: "true"
          ML_ACTIVE_BUNDLE: "artifacts/gemma/final"
          DEBUG_STRATEGY_LOGGING: ${{ github.event.inputs.debug_mode }}
          
          # --- DÜZELTME: Threshold varsayılan değeri doğru ondalık orana (0.0005) getirildi. ---
          DUPLICATE_PREVENTION_THRESHOLD: ${{ vars.DUPLICATE_PREVENTION_THRESHOLD || '0.0005' }}
          DUPLICATE_PREVENTION_COOLDOWN: ${{ vars.DUPLICATE_PREVENTION_COOLDOWN || '60' }} # Ayrıca cooldown 60s olarak güncellendi.
          PRICE_DELTA_BYPASS_THRESHOLD: ${{ vars.PRICE_DELTA_BYPASS_THRESHOLD || '0.0015' }}
          PRICE_DELTA_BYPASS_ENABLED: ${{ vars.PRICE_DELTA_BYPASS_ENABLED || 'true' }}
          TRADING_SYMBOLS: ${{ vars.TRADING_SYMBOLS || 'BTC/USDT:USDT,ETH/USDT:USDT,SOL/USDT:USDT' }}
          RSI_THRESHOLD_BTC: ${{ vars.RSI_THRESHOLD_BTC || '55' }}
          RSI_THRESHOLD_ETH: ${{ vars.RSI_THRESHOLD_ETH || '50' }}
          RSI_THRESHOLD_SOL: ${{ vars.RSI_THRESHOLD_SOL || '50' }}
          CAPITAL_USDT: ${{ vars.CAPITAL_USDT || '100' }}
          DAILY_MAX_TRADES: ${{ vars.DAILY_MAX_TRADES || '5' }}
          PER_TRADE_RISK_PCT: ${{ vars.PER_TRADE_RISK_PCT || '0.01' }}
          WS_MAX_STREAMS_BINGX: ${{ vars.WS_MAX_STREAMS_BINGX || '10' }}
        run: |
          echo "🔍 Running pre-flight checks (without secrets)..."
          echo "=================================="
          python scripts/live_trading_launcher.py --dry-run --paper
          echo "=================================="
          echo "✅ Pre-flight checks completed"

      - name: Upload Pre-Flight Logs
        uses: actions/upload-artifact@v4
        if: always() && env.CI == 'true'
        continue-on-error: true
        with:
          name: pre-flight-logs
          path: |
            logs/**/*.log
            logs/*.log
          if-no-files-found: ignore

  live-trading:
    name: Execute Live Trading
    runs-on: ubuntu-latest
    needs: [validate-inputs, pre-flight-checks]
    if: |
      always() && 
      needs.validate-inputs.outputs.should_proceed == 'true' &&
      (needs.pre-flight-checks.result == 'success' || needs.validate-inputs.outputs.skip_preflight == 'true')
    timeout-minutes: 720

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Ensure project packages importable
        run: |
          echo "Setting PYTHONPATH for module imports..."
          echo "PYTHONPATH=${{ github.workspace }}:${{ github.workspace }}/src" >> $GITHUB_ENV

      - name: Setup TA-Lib and Dependencies
        run: |
          set -e  # Exit on error
          
          # Verify Python version
          python --version
          python -c "import sys; assert sys.version_info[:2] == (3, 11), f'Expected Python 3.11, got {sys.version}'"
          
          # Install system dependencies (jq needed for dynamic variable extraction)
          sudo apt-get update && sudo apt-get install -y wget build-essential jq
          
          # Install TA-Lib
          wget http://prdownloads.sourceforge.net/ta-lib/ta-lib-0.4.0-src.tar.gz
          tar -xzvf ta-lib-0.4.0-src.tar.gz
          cd ta-lib
          ./configure --prefix=/usr
          make
          sudo make install
          cd ..
          
          # Install Python dependencies
          python -m pip install --upgrade pip
          pip install --no-cache-dir 'aiohttp==3.8.6' 'yarl<2.0' 'multidict<7.0' TA-Lib 'websocket-client>=1.6.0' 'websockets>=10.0'
          
          if [ "${{ github.event.inputs.enable_ml }}" = "true" ]; then
            pip install --no-cache-dir -r requirements.txt
          else
            sed '/# === MACHINE LEARNING (Optional) ===/,$d' requirements.txt | pip install --no-cache-dir -r /dev/stdin
          fi
          
          python -m pip install -e .
        shell: bash

      - name: Export GEMMA environment
        if: github.event.inputs.enable_ml == 'true'
        run: |
          echo "GEMMA_ENABLED=true" >> $GITHUB_ENV
          echo "ML_ACTIVE_BUNDLE=artifacts/gemma/final" >> $GITHUB_ENV
          echo "✅ GEMMA environment variables exported"

      - name: Prepare GEMMA artifacts
        shell: bash
        run: |
          set -e
          bash scripts/setup_gemma_artifacts.sh
          bash scripts/setup_ml_model_links.sh

      - name: Validate GEMMA manifest and PPO agent
        shell: bash
        run: |
          set -e
      
          # 1) GEMMA manifest kontrolü
          if [ ! -f artifacts/gemma/final/manifest.json ]; then
            echo "❌ GEMMA manifest not found"
            exit 1
          fi
      
          python - <<'PY'
          import json
          from pathlib import Path
      
          manifest = Path('artifacts/gemma/final/manifest.json')
          data = json.loads(manifest.read_text(encoding='utf-8'))
          feature_count = data.get('feature_count')
          if feature_count != 82:
              raise SystemExit(f"Expected GEMMA feature_count=82, got {feature_count}")
          print("✅ GEMMA manifest feature count verified (82 features)")
          PY
      
          # 2) PPO model path kontrolü (config ile uyumlu)
          PPO_PATH="artifacts/ppo/ppo_trading_agent.zip"
          if [ ! -f "$PPO_PATH" ]; then
            echo "❌ PPO model not found at $PPO_PATH"
            exit 1
          fi
          echo "✅ PPO model found at $PPO_PATH"

      - name: Set Dynamic Environment Variables
        id: set-env
        run: |
          echo "Dynamically setting environment variables using jq..."
          
          # GitHub vars context'ini JSON dosyasına yaz
          echo '${{ toJSON(vars) }}' > github_vars.json
          
          # ML Feature windows için özel işlem
          echo "ML_FEAT_VOL_WINDOWS=5,10,20,50" >> $GITHUB_ENV
          echo "ML_FEAT_MOM_WINDOWS=5,10,20,50" >> $GITHUB_ENV
          
          # RSI thresholds - hem spot hem futures formatı için
          RSI_BTC="${{ vars.RSI_THRESHOLD_BTC || '50' }}"
          RSI_ETH="${{ vars.RSI_THRESHOLD_ETH || '50' }}"
          RSI_SOL="${{ vars.RSI_THRESHOLD_SOL || '50' }}"
          
          echo "RSI_THRESHOLD_BTC=$RSI_BTC" >> $GITHUB_ENV
          echo "RSI_THRESHOLD_ETH=$RSI_ETH" >> $GITHUB_ENV
          echo "RSI_THRESHOLD_SOL=$RSI_SOL" >> $GITHUB_ENV
          
          # Diğer değişkenleri otomatik al
          grep -oP '#\s*Override with:\s*\K\w+' config/config.example.yaml | while read -r var_name; do
            # ML_FEAT ve RSI_THRESHOLD olanları skip et (yukarıda manuel handle edildi)
            if [[ "$var_name" == "ML_FEAT_VOL_WINDOWS" ]] || \
               [[ "$var_name" == "ML_FEAT_MOM_WINDOWS" ]] || \
               [[ "$var_name" == RSI_THRESHOLD_* ]]; then
              continue
            fi
            
            # jq kullanarak JSON dosyasından değişkenin değerini al
            value=$(jq -r --arg key "$var_name" '.[$key] // ""' github_vars.json)
            
            if [ -n "$value" ]; then
              echo "$var_name=$value" >> $GITHUB_ENV
            fi
          done
          
          echo "✅ Dynamic variables are ready for the next step."
        shell: bash

      - name: Launch Trading Bot
        id: trading
        env:
          # Sadece statik, gizli veya input'tan gelenler burada listelenir.
          # Dinamik olanlar bir önceki adımda ortama otomatik olarak eklendi.
          ML_ENABLED: ${{ github.event.inputs.enable_ml }}
          GEMMA_ENABLED: "true"
          ML_ACTIVE_BUNDLE: "artifacts/gemma/final"
          BINGX_KEY: ${{ secrets.BINGX_KEY }}
          BINGX_SECRET: ${{ secrets.BINGX_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -e  # Exit on error
          
          # Validate critical environment variables for live mode
          if [ "${{ github.event.inputs.mode }}" = "live" ]; then
            if [ -z "$BINGX_KEY" ] || [ -z "$BINGX_SECRET" ]; then
              echo "❌ ERROR: Live mode requires BINGX_KEY and BINGX_SECRET secrets"
              exit 1
            fi
          fi
          
          # Build command arguments
          args=()
          [ "${{ github.event.inputs.mode }}" = "paper" ] && args+=("--paper")
          [ "${{ github.event.inputs.dry_run }}" = "true" ] && args+=("--dry-run")
          [ "${{ github.event.inputs.infinite }}" = "true" ] && args+=("--infinite")
          [ "${{ github.event.inputs.auto_restart }}" = "true" ] && args+=("--auto-restart")
          [ "${{ github.event.inputs.debug_mode }}" = "true" ] && args+=("--debug")
          
          # Fixed duration handling - single line Python
          if [ -n "${{ github.event.inputs.duration }}" ]; then
            DURATION_INPUT="${{ github.event.inputs.duration }}"
            duration_in_seconds=$(python3 -c "import re,sys; s='${DURATION_INPUT}'.strip(); m=re.match(r'^([0-9\.]+)\s*([hms])?\s*\$', s.lower()); sys.exit(0) if m and print(int(float(m.group(1))*{'h':3600,'m':60,'s':1}.get(m.group(2) or 's',1))) is None else sys.exit(1)")
            
            if [ $? -eq 0 ]; then
              args+=("--duration" "$duration_in_seconds")
              echo "Duration set to ${duration_in_seconds} seconds"
            else
              echo "Error: Invalid duration format '${DURATION_INPUT}'. Expected: 60s, 5m, 2h, or plain seconds"
              exit 1
            fi
          fi
          
          # Execute with proper error handling
          CMD=("python3" "scripts/live_trading_launcher.py" "${args[@]}")
          
          echo "🚀 Executing command:"
          printf "%q " "${CMD[@]}"
          echo
          
          # Run with timeout and capture exit code
          # 43200 seconds = 720 minutes (12 hours), matches job timeout-minutes: 720
          # Exit code 124 = timeout, other codes = command exit status
          timeout 43200 "${CMD[@]}" || EXIT_CODE=$?
          
          if [ "${EXIT_CODE:-0}" -eq 124 ]; then
            echo "⏱️ Trading session reached 12-hour timeout limit (this is normal)"
            exit 0
          elif [ "${EXIT_CODE:-0}" -ne 0 ]; then
            echo "❌ Trading bot exited with code: ${EXIT_CODE}"
            exit ${EXIT_CODE}
          fi

      - name: Generate Post-Session Summary
        if: always()
        run: |
          echo "📊 POST-SESSION ANALYSIS"
          echo "=============================================="
          echo "Session completed at: $(date)"
          echo ""

          # Check if log files exist in logs/
          if compgen -G "logs/*.log" > /dev/null; then
            echo "📄 Log files generated in logs/:"
            ls -lh logs/*.log || true
            echo ""
            echo "📈 Log file statistics:"
            for log in logs/*.log; do
              [ -e "$log" ] || continue
              echo "  $log:"
              echo "    - Size: $(wc -c < "$log") bytes"
              echo "    - Lines: $(wc -l < "$log")"
              echo "    - Errors: $(grep -c "ERROR" "$log" || echo "0")"
              echo "    - Warnings: $(grep -c "WARNING" "$log" || echo "0")"
              echo ""
            done
          else
            echo "ℹ️ No log files found in logs/"
          fi

          # Check for state files
          if [ -f "data/state.json" ]; then
            echo "💾 State file preserved: data/state.json"
          elif [ -f "state.json" ]; then
            echo "💾 State file preserved at repo root: state.json"
          fi

          echo "=============================================="
          echo "✅ Post-session analysis complete"

      - name: Upload Trading Logs
        uses: actions/upload-artifact@v4
        if: always() && env.CI == 'true'
        with:
          name: trading-logs-${{ github.run_number }}
          path: |
            logs/**/*.log
            logs/*.log
          retention-days: 30
          if-no-files-found: warn

      - name: Upload trading state
        if: always() && env.CI == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: live-trading-state
          path: |
            data/state.json
            data/day_stats.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Trading Data
        uses: actions/upload-artifact@v4
        if: always() && env.CI == 'true'
        with:
          name: trading-data-${{ github.run_number }}
          path: |
            data/**
            state.json
            day_stats.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Health Reports
        uses: actions/upload-artifact@v4
        if: always() && env.CI == 'true'
        with:
          name: health-reports-${{ github.run_number }}
          path: |
            logs/health_*.json
            restart_*.log
            circuit_breaker_*.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Send Telegram Notification (Success)
        if: success() && env.CI == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # DÜZELTME: Doğru ondalık oran varsayılanı kullanılıyor.
          DUPLICATE_PREVENTION_THRESHOLD: ${{ vars.DUPLICATE_PREVENTION_THRESHOLD || '0.0005' }}
          TRADING_SYMBOLS: ${{ vars.TRADING_SYMBOLS || 'BTC/USDT:USDT,ETH/USDT:USDT,SOL/USDT:USDT' }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            # Use Python for percentage calculation instead of bc (passing as argument for safety)
            # Note: Duplicated in summary job for independence (each job should be self-contained)
            DP_THRESHOLD_AS_PERCENT=$(python3 -c "import sys; val=sys.argv[1] if len(sys.argv)>1 else ''; print(f'{float(val)*100:.4f}%') if val and val.replace('.','').replace('-','').isdigit() else print('N/A')" "${DUPLICATE_PREVENTION_THRESHOLD}")
            PREFLIGHT_STATUS="${{ github.event.inputs.skip_preflight == 'true' && '⚠️ SKIPPED' || '✅ PASSED' }}"
            
            MESSAGE="✅ <b>Live Trading Session Completed</b>%0A%0A"
            MESSAGE="${MESSAGE}<b>Configuration:</b>%0A"
            MESSAGE="${MESSAGE}Mode: ${{ github.event.inputs.mode }}%0A"
            MESSAGE="${MESSAGE}Pre-flight: ${PREFLIGHT_STATUS}%0A"
            MESSAGE="${MESSAGE}Duration: ${{ github.event.inputs.duration || 'indefinite' }}%0A"
            MESSAGE="${MESSAGE}Infinite: ${{ github.event.inputs.infinite }}%0A"
            MESSAGE="${MESSAGE}Auto-Restart: ${{ github.event.inputs.auto_restart }}%0A"
            MESSAGE="${MESSAGE}%0A<b>Trading Config:</b>%0A"
            MESSAGE="${MESSAGE}Symbols: ${TRADING_SYMBOLS}%0A"
            # DÜZELTME: Doğru hesaplanmış yüzde değeri gösteriliyor.
            MESSAGE="${MESSAGE}Dup Prevention: ${DP_THRESHOLD_AS_PERCENT}%0A"
            MESSAGE="${MESSAGE}%0A<b>Workflow:</b> ${{ github.workflow }}%0A"
            MESSAGE="${MESSAGE}<b>Run:</b> #${{ github.run_number }}"

            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              -d "text=${MESSAGE}" \
              -d "parse_mode=HTML" > /dev/null || true
          fi

      - name: Send Telegram Notification (Failure)
        if: failure() && env.CI == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            PREFLIGHT_STATUS="${{ github.event.inputs.skip_preflight == 'true' && '⚠️ SKIPPED' || '✅ PASSED' }}"
            
            MESSAGE="❌ <b>Live Trading Session Failed</b>%0A%0A"
            MESSAGE="${MESSAGE}Mode: ${{ github.event.inputs.mode }}%0A"
            MESSAGE="${MESSAGE}Pre-flight: ${PREFLIGHT_STATUS}%0A"
            MESSAGE="${MESSAGE}Duration: ${{ github.event.inputs.duration || 'indefinite' }}%0A"
            MESSAGE="${MESSAGE}Infinite: ${{ github.event.inputs.infinite }}%0A"
            MESSAGE="${MESSAGE}Auto-Restart: ${{ github.event.inputs.auto_restart }}%0A"
            MESSAGE="${MESSAGE}%0AWorkflow: ${{ github.workflow }}%0A"
            MESSAGE="${MESSAGE}Run: #${{ github.run_number }}%0A"
            MESSAGE="${MESSAGE}%0ACheck logs for details."

            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              -d "text=${MESSAGE}" \
              -d "parse_mode=HTML" > /dev/null || true
          fi

  summary:
    name: Session Summary
    runs-on: ubuntu-latest
    needs: [validate-inputs, pre-flight-checks, live-trading]
    if: always()

    steps:
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Generate Workflow Summary
        env:
          # DÜZELTME: Tüm değerler standart ve doğru varsayılanlara sahip.
          DUPLICATE_PREVENTION_THRESHOLD: ${{ vars.DUPLICATE_PREVENTION_THRESHOLD || '0.0005' }}
          DUPLICATE_PREVENTION_COOLDOWN: ${{ vars.DUPLICATE_PREVENTION_COOLDOWN || '60' }}
          TRADING_SYMBOLS: ${{ vars.TRADING_SYMBOLS || 'BTC/USDT:USDT,ETH/USDT:USDT,SOL/USDT:USDT' }}
          CAPITAL_USDT: ${{ vars.CAPITAL_USDT || '100' }}
        run: |
          # Use Python for percentage calculation instead of bc (passing as argument for safety)
          # Note: Duplicated from Telegram notification for job independence
          DP_THRESHOLD_AS_PERCENT=$(python3 -c "import sys; val=sys.argv[1] if len(sys.argv)>1 else ''; print(f'{float(val)*100:.4f}%') if val and val.replace('.','').replace('-','').isdigit() else print('N/A')" "${DUPLICATE_PREVENTION_THRESHOLD}")

          echo "# 🤖 Bearish Alpha Bot - Trading Session Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Workflow Configuration" >> $GITHUB_STEP_SUMMARY
          echo "- **Mode**: ${{ github.event.inputs.mode }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Dry Run**: ${{ github.event.inputs.dry_run }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Pre-flight Checks**: ${{ github.event.inputs.skip_preflight == 'true' && '⚠️ SKIPPED' || '✅ COMPLETED' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Layer 1 (Infinite)**: ${{ github.event.inputs.infinite }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Layer 2 (Auto-Restart)**: ${{ github.event.inputs.auto_restart }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Restart Delay**: ${{ github.event.inputs.restart_delay }}s" >> $GITHUB_STEP_SUMMARY
          echo "- **Duration**: ${{ github.event.inputs.duration || 'indefinite' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Debug Mode**: ${{ github.event.inputs.debug_mode }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Trading Configuration (from GitHub Variables)" >> $GITHUB_STEP_SUMMARY
          echo "- **Capital**: ${CAPITAL_USDT} USDT" >> $GITHUB_STEP_SUMMARY
          echo "- **Exchange**: BingX" >> $GITHUB_STEP_SUMMARY
          echo "- **Trading Pairs**: ${TRADING_SYMBOLS}" >> $GITHUB_STEP_SUMMARY
          # DÜZELTME: Doğru hesaplanmış ve açıklayıcı özet.
          echo "- **Duplicate Prevention**: ${DP_THRESHOLD_AS_PERCENT} threshold, ${DUPLICATE_PREVENTION_COOLDOWN}s cooldown" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Job Status" >> $GITHUB_STEP_SUMMARY
          echo "- **Validation**: ${{ needs.validate-inputs.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Pre-Flight Checks**: ${{ needs.pre-flight-checks.result || (github.event.inputs.skip_preflight == 'true' && 'skipped' || 'N/A') }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Live Trading**: ${{ needs.live-trading.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "Check the workflow run artifacts for:" >> $GITHUB_STEP_SUMMARY
          echo "- 📄 Trading logs" >> $GITHUB_STEP_SUMMARY
          echo "- 📊 Trading data and state" >> $GITHUB_STEP_SUMMARY
          echo "- 🏥 Health reports" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "*Workflow run: #${{ github.run_number }}*" >> $GITHUB_STEP_SUMMARY
          echo "*Config source: GitHub Variables + config.example.yaml*" >> $GITHUB_STEP_SUMMARY
