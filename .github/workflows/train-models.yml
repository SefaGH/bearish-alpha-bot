name: Manually and Scheduled Train ML Models

on:
  # Bu iş akışını her Pazar sabahı saat 05:00 UTC'de otomatik olarak çalıştırır.
  schedule:
    - cron: '0 5 * * 0'

  # Manuel olarak tetikleme bloğu
  workflow_dispatch:
    inputs:
      log_level:
        description: 'Log Level'
        required: true
        default: 'INFO'
        type: choice
        options:
        - INFO
        - DEBUG

jobs:
  train-and-save-models:
    runs-on: ubuntu-latest  # İşlemler, GitHub'ın sağladığı bir Linux sanal makinesinde çalışacak
    
    steps:
    # 1. Adım: Proje kodunu sanal makineye indirir
    - name: Check out repository code
      uses: actions/checkout@v4

    # 2. Adım: Python ortamını kurar (GÜNCELLENDİ)
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        # HATA DÜZELTMESİ: Python sürümünü 3.11'e yükseltiyoruz.
        python-version: '3.11' 
        # İYİLEŞTİRME: Bağımlılıkları cache'leyerek sonraki çalıştırmaları hızlandırır.
        cache: 'pip'

    # 3. Adım: pip'i yükseltir (YENİ VE ÖNERİLEN ADIM)
    # Bu adım, kurulum hatalarını önlemek için en güncel pip sürümünü garantiler.
    - name: Upgrade pip
      run: python -m pip install --upgrade pip setuptools wheel

    # 4. Adım: Gerekli kütüphaneleri yükler
    - name: Install dependencies
      run: pip install -r requirements.txt

    # 5. Adım: Model eğitim betiğini çalıştırır
    - name: Run model training script
      env:
        ML_ENABLED: "true" # Ortam değişkenini ayarla
      run: python scripts/train_all_models.py

    # 6. Adım (ÖNEMLİ): Eğitilmiş modelleri bir "artifact" olarak kaydeder
    - name: Archive trained models
      uses: actions/upload-artifact@v4
      with:
        name: trained-models
        path: data/models/
