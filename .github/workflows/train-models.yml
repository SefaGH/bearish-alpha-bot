name: Manually and Scheduled Train ML Models

on:
  schedule:
    - cron: '0 5 * * 0'
  workflow_dispatch:
    inputs:
      log_level:
        description: 'Log Level'
        required: true
        default: 'INFO'
        type: choice
        options:
        - INFO
        - DEBUG

jobs:
  train-and-save-models:
    runs-on: ubuntu-latest
    
    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    # Python 3.11 ortamını kur
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Upgrade pip
      run: python -m pip install --upgrade pip setuptools wheel

    # Bağımlılıkları kur (artık 'pandas-ta-classic' ile sorunsuz çalışacak)
    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Run model training script
      env:
        ML_ENABLED: "true"
      run: python scripts/train_all_models.py

    - name: Archive trained models
      uses: actions/upload-artifact@v4
      with:
        name: trained-models
        path: data/models/
