name: 🏆 Train Final Production Models

on:
  workflow_dispatch:
    inputs:
      log_level:
        description: 'Log Level'
        required: true
        default: 'INFO'
        type: choice
        options:
          - INFO
          - DEBUG
      symbol:
        description: 'Trading Symbol'
        required: true
        default: 'BTC/USDT'
        type: string

jobs:
  train-production-model:
    runs-on: ubuntu-latest
    
    steps:
      - name: 1. Ortamı Hazırla (Checkout & Python)
        uses: actions/checkout@v4
      
      - name: Python 3.11 Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install shap matplotlib # Hata analizi için gerekli

      - name: 2. Ar-Ge Artifact'lerini İndir (Tuning Sonuçları)
        run: |
          echo "======================================================================"
          echo "📦 ADIM 2: AR-GE ARTIFACT'LERİNİ İNDİRİYOR"
          echo "======================================================================"
          echo "Bu adım, full-gemma-tuning.yml tarafından üretilen 'mavi kopya'"
          echo "artifact'lerini indirecek:"
          echo "  1. gemma-feature-plan-artifacts (özellik planı ve mask)"
          echo "  2. gemma-tuning-results-* (hiperparametreler)"
          echo "  3. production-scaler (ölçekleyici)"
          echo ""
          mkdir -p data/cache/gemma features/gemma logs/tuning_results
          echo "✅ Hedef dizinler oluşturuldu."
      
      - name: 2.1. Özellik Planı Artifact'ini İndir
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          workflow: full-gemma-tuning.yml
          name: gemma-feature-plan-artifacts
          path: ./
          search_artifacts: true
          if_no_artifact_found: warn
      
      - name: 2.2. Tuning Sonuçları Artifact'ini İndir
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          workflow: full-gemma-tuning.yml
          name_is_regexp: true
          name: gemma-tuning-results-.*
          path: ./
          search_artifacts: true
          if_no_artifact_found: warn
      
      - name: 2.3. Production Scaler Artifact'ini İndir
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          workflow: full-gemma-tuning.yml
          name: production-scaler
          path: data/cache/
          search_artifacts: true
          if_no_artifact_found: warn
      
      - name: 2.4. İndirilen Artifact'leri Doğrula
        run: |
          echo "======================================================================"
          echo "🔍 İNDİRİLEN ARTIFACT'LER KONTROL EDİLİYOR"
          echo "======================================================================"
          
          # Check for feature selection mask
          if [ -f "data/cache/gemma/feature_selection_mask.npy" ]; then
            echo "✅ Özellik seçim maskesi bulundu: data/cache/gemma/feature_selection_mask.npy"
          else
            echo "⚠️  UYARI: Özellik seçim maskesi bulunamadı!"
            echo "   Eğitim varsayılan özellik setini kullanacak."
          fi
          
          # Check for tuning results
          TUNING_FILE=$(find logs/tuning_results -name "gemma_tuning_*.json" -type f | head -1)
          if [ -n "$TUNING_FILE" ]; then
            echo "✅ Tuning sonuçları bulundu: $TUNING_FILE"
            echo "   En iyi hiperparametreler bu dosyadan yüklenecek."
          else
            echo "⚠️  UYARI: Tuning sonuçları bulunamadı!"
            echo "   Eğitim config.yaml'daki varsayılan değerleri kullanacak."
          fi
          
          # Check for production scaler
          if [ -f "data/cache/scaler_production.joblib" ]; then
            echo "✅ Production scaler bulundu: data/cache/scaler_production.joblib"
          else
            echo "⚠️  UYARI: Production scaler bulunamadı!"
            echo "   Eğitim sırasında yeni bir scaler oluşturulacak."
          fi
          
          echo ""
          echo "======================================================================"
          echo "📋 ARTIFACT DURUMU ÖZETİ"
          echo "======================================================================"
          echo "Artifact'ler continue-on-error ile indirildi. Eksik artifact'ler"
          echo "varsa, eğitim varsayılan/yeni değerlerle devam edecektir."
          echo "======================================================================"

      - name: 3. Çalışma Ortamını Temizle (Hijyen Adımı)
        run: |
          echo "======================================================================"
          echo "🧹 ADIM 3: ÇALIŞMA ORTAMINI TEMİZLE"
          echo "======================================================================"
          echo "Önceki çalıştırmalardan kalan eski loglar temizleniyor..."
          echo "(Not: Artifact'lerden gelen dosyalar korunuyor)"
          rm -rf logs/final_training/*
          rm -rf analysis_artifacts/*
          mkdir -p logs/final_training analysis_artifacts
          echo "✅ Çalışma ortamı temizlendi."

      - name: 4. Veri Setini Hazırla
        id: prepare_data
        run: |
          echo "======================================================================"
          echo "📊 ADIM 4: Ham Veri Seti Hazırlanıyor (Tüm Özellikler)"
          echo "======================================================================"
          python scripts/prepare_training_data.py --symbol "${{ inputs.symbol }}" --no-feature-selection

      - name: 5. Nihai Modelleri Eğit (Ana Script)
        run: |
          echo "======================================================================"
          echo "🚀 ADIM 5: Optimize Edilmiş Modellerin Eğitimi"
          echo "======================================================================"
          echo "   - Ana script çalıştırılıyor: train_all_models.py"
          echo "   - Script, tuning artifact'lerinden gelen dinamik hiperparametreleri kullanacak."
          echo "   - Artifact yoksa, config.yaml'daki varsayılan değerler kullanılacak."
          
          python scripts/train_all_models.py
        env:
          ML_ENABLED: "true"

      - name: 6. Model Performansını Doğrula (Kalite Kontrol)
        id: deploy_check
        continue-on-error: true
        run: |
          echo "======================================================================"
          echo "🔬 ADIM 6: Üretim Hazırlık Kontrolü (Kalite Güvence)"
          echo "   (ASIL METRİK KULLANILIYOR: Balanced Accuracy)"
          echo "======================================================================"
          
          python3 << 'EOF'
          import json
          import yaml
          from pathlib import Path
          
          def get_latest_metrics_file(model_name: str) -> Path:
              log_dir = Path(f'logs/final_training/{model_name}')
              if not log_dir.exists(): return None
              files = sorted(log_dir.glob('final_metrics_*.json'), key=lambda p: p.stat().st_mtime, reverse=True)
              return files[0] if files else None

          def check_model(model_name: str, min_balanced_accuracy: float = 0.70):
              print(f"\n--- {model_name.upper()} MODELİ DEĞERLENDİRİLİYOR ---")
              metrics_file = get_latest_metrics_file(model_name)
              if not metrics_file:
                  print(f"❌ HATA: {model_name} için metrik dosyası bulunamadı!")
                  return False

              with open(metrics_file) as f:
                  metrics = json.load(f)

              test_metrics = metrics.get('test_metrics', {})
              
              # --- KRİTİK DEĞİŞİKLİK BURADA ---
              # Eski 'accuracy' yerine 'balanced_accuracy' metriğini ara
              balanced_acc = test_metrics.get('balanced_accuracy', 0.0)
              total_acc = test_metrics.get('accuracy', 0.0) # Referans için
              
              print(f"   - Asıl Metrik (Balanced Accuracy): {balanced_acc:.2%} (Eşik: >{min_balanced_accuracy:.0%})")
              print(f"   - Yanıltıcı Metrik (Total Accuracy): {total_acc:.2%}")
              
              if balanced_acc < min_balanced_accuracy:
                  print(f"   - ❌ SONUÇ: {model_name} modeli ASIL metrik eşiğini GEÇEMEDİ.")
                  return False
              
              print(f"   - ✅ SONUÇ: {model_name} modeli üretim eşiklerini BAŞARIYLA GEÇTİ.")
              return True

          # Check both GEMMA price and regime models
          all_models_passed = True
          
          # Tuning skorunu (%76.96) temel alarak, %70'in altını kabul etme
          MIN_PERFORMANCE_THRESHOLD = 0.70 
          
          # Check GEMMA price model
          if not check_model('gemma_price', min_balanced_accuracy=MIN_PERFORMANCE_THRESHOLD):
              all_models_passed = False
          
          # Check GEMMA regime model  
          if not check_model('gemma_regime', min_balanced_accuracy=MIN_PERFORMANCE_THRESHOLD):
              all_models_passed = False

          if not all_models_passed:
              print("\n🚨 UYARI: En az bir model kalite kontrolünü (Balanced Accuracy) geçemedi. Hata analizi adımı tetiklenecek.")
              exit(1) # Bu, GitHub Actions'ta bu adımın başarısız olmasını sağlar
          
          print("\n🎉 Tüm aktif modeller kalite kontrolünü başarıyla geçti!")
          EOF
          
      - name: 7. Başarı Durumuna Göre Raporlama ve Artifact Oluşturma
        if: steps.deploy_check.outcome == 'success'
        run: |
          echo "======================================================================"
          echo "✅ ADIM 7: Başarılı Model Artifact'leri Arşivleniyor"
          echo "======================================================================"
          
      - name: Başarılı Modelleri Arşivle
        if: steps.deploy_check.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: final-production-models-${{ github.run_number }}
          path: |
            data/models/final/
            logs/final_training/
          retention-days: 90

      - name: 8. Hata Durumunda Açıklanabilirlik Analizi Çalıştırma
        if: steps.deploy_check.outcome == 'failure'
        run: |
          echo "======================================================================"
          echo "🚨 ADIM 8: Model Başarısız! Hata Analizi Başlatılıyor..."
          echo "======================================================================"
          echo "   - SHAP analizi çalıştırılarak, gemma_price modelinin neden yanlış karar verdiği anlaşılmaya çalışılacak."
          
          # DÜZELTME: Gerekli argümanlar eklendi
          python scripts/analyze_model_explainability.py \
            --model-path data/models/final/gemma_price.pt \
            --data-path data/cache/BTC-USDT_training_data.npz \
            --metadata-path features/gemma/metadata/feature_metadata.json \
            --output-dir ./analysis_artifacts
