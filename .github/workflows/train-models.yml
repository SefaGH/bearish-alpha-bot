name: 🏆 Train Final Production Models

on:
  workflow_dispatch:
    inputs:
      log_level:
        description: 'Log Level'
        required: true
        default: 'INFO'
        type: choice
        options:
          - INFO
          - DEBUG
      symbol:
        description: 'Trading Symbol'
        required: true
        default: 'BTC/USDT'
        type: string

jobs:
  train-production-model:
    runs-on: ubuntu-latest
    
    steps:
      - name: 1. Ortamı Hazırla (Checkout & Python)
        uses: actions/checkout@v4
      
      - name: Python 3.11 Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install shap matplotlib # Hata analizi için gerekli

      - name: 2. Çalışma Ortamını Temizle (Hijyen Adımı)
        run: |
          echo "🧹 Önceki çalıştırmalardan kalan eski önbellek ve loglar temizleniyor..."
          rm -rf data/cache/*
          rm -rf logs/final_training/*
          rm -rf analysis_artifacts/*
          mkdir -p data/cache logs/final_training analysis_artifacts
          echo "✅ Çalışma ortamı temizlendi."

      - name: 3. Veri Setini Hazırla
        id: prepare_data
        run: |
          echo "======================================================================"
          echo "📊 ADIM 3: Ham Veri Seti Hazırlanıyor (Tüm Özellikler)"
          echo "======================================================================"
          python scripts/prepare_training_data.py --symbol "${{ inputs.symbol }}" --no-feature-selection

      - name: 4. Nihai Modelleri Eğit (Ana Script)
        run: |
          echo "======================================================================"
          echo "🚀 ADIM 4: Optimize Edilmiş Modellerin Eğitimi"
          echo "======================================================================"
          echo "   - Ana script çalıştırılıyor: train_all_models.py"
          echo "   - Bu script, config.yaml'daki en iyi hiperparametreleri kullanacak."
          
          python scripts/train_all_models.py
        env:
          ML_ENABLED: "true"

      - name: 5. Model Performansını Doğrula (Kalite Kontrol)
        id: deploy_check
        continue-on-error: true # DÜZELTİLDİ: Bu adım başarısız olsa bile workflow devam etsin.
        run: |
          echo "======================================================================"
          echo "🔬 ADIM 5: Üretim Hazırlık Kontrolü (Kalite Güvence)"
          echo "======================================================================"
          
          # Bu Python bloğu, modellerin performansını değerlendirir ve
          # başarılı olup olmadığına karar verir. Başarısız olursa,
          # workflow'un sonraki adımları bunu bilecek.
          python3 << 'EOF'
          import json
          import yaml
          from pathlib import Path
          
          def get_latest_metrics_file(model_name: str) -> Path:
              log_dir = Path(f'logs/final_training/{model_name}')
              if not log_dir.exists(): return None
              files = sorted(log_dir.glob('final_metrics_*.json'), key=lambda p: p.stat().st_mtime, reverse=True)
              return files[0] if files else None

          def check_model(model_name: str, min_accuracy: float = 0.35):
              print(f"\n--- {model_name.upper()} MODELİ DEĞERLENDİRİLİYOR ---")
              metrics_file = get_latest_metrics_file(model_name)
              if not metrics_file:
                  print(f"❌ HATA: {model_name} için metrik dosyası bulunamadı!")
                  return False

              with open(metrics_file) as f:
                  metrics = json.load(f)

              # Check if this is a test_metrics or per_class_accuracy format
              if 'test_metrics' in metrics:
                  test_metrics = metrics.get('test_metrics', {})
                  accuracy = test_metrics.get('accuracy', 0.0)
                  print(f"   - Model Doğruluğu: {accuracy:.2%} (Eşik: >{min_accuracy:.0%})")
                  
                  if accuracy < min_accuracy:
                      print(f"   - ❌ SONUÇ: {model_name} modeli üretim eşiklerini GEÇEMEDİ.")
                      return False
              else:
                  # Fallback to old format
                  per_class_acc = metrics.get('per_class_accuracy', {})
                  bullish_acc = per_class_acc.get('Bullish', 0.0)
                  neutral_acc = per_class_acc.get('Neutral', 0.0)
                  bearish_acc = per_class_acc.get('Bearish', 0.0)
                  
                  MIN_MINORITY_ACC = 0.35  # Azınlık sınıf (Bull/Bear) için en az %35 doğruluk
                  MIN_MAJORITY_ACC = 0.70  # Çoğunluk sınıf (Neutral) için en az %70 doğruluk
                  
                  print(f"   - Bullish Doğruluk: {bullish_acc:.2%} (Eşik: >{MIN_MINORITY_ACC:.0%})")
                  print(f"   - Neutral Doğruluk: {neutral_acc:.2%} (Eşik: >{MIN_MAJORITY_ACC:.0%})")
                  print(f"   - Bearish Doğruluk: {bearish_acc:.2%} (Eşik: >{MIN_MINORITY_ACC:.0%})")

                  if bearish_acc < MIN_MINORITY_ACC or bullish_acc < MIN_MINORITY_ACC or neutral_acc < MIN_MAJORITY_ACC:
                      print(f"   - ❌ SONUÇ: {model_name} modeli üretim eşiklerini GEÇEMEDİ.")
                      return False
              
              print(f"   - ✅ SONUÇ: {model_name} modeli üretim eşiklerini BAŞARIYLA GEÇTİ.")
              return True

          # Check both GEMMA price and regime models
          all_models_passed = True
          
          # Check GEMMA price model
          if not check_model('gemma_price', min_accuracy=0.40):
              all_models_passed = False
          
          # Check GEMMA regime model  
          if not check_model('gemma_regime', min_accuracy=0.40):
              all_models_passed = False

          if not all_models_passed:
              print("\n🚨 UYARI: En az bir model kalite kontrolünü geçemedi. Hata analizi adımı tetiklenecek.")
              exit(1) # Bu, GitHub Actions'ta bu adımın başarısız olmasını sağlar
          
          print("\n🎉 Tüm aktif modeller kalite kontrolünü başarıyla geçti!")
          EOF
          
      - name: 6. Başarı Durumuna Göre Raporlama ve Artifact Oluşturma
        if: steps.deploy_check.outcome == 'success'
        run: |
          echo "======================================================================"
          echo "✅ ADIM 6: Başarılı Model Artifact'leri Arşivleniyor"
          echo "======================================================================"
          
      - name: Başarılı Modelleri Arşivle
        if: steps.deploy_check.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: final-production-models-${{ github.run_number }}
          path: |
            data/models/final/
            logs/final_training/
          retention-days: 90

      - name: 7. Hata Durumunda Açıklanabilirlik Analizi Çalıştırma
        if: steps.deploy_check.outcome == 'failure'
        run: |
          echo "======================================================================"
          echo "🚨 ADIM 7: Model Başarısız! Hata Analizi Başlatılıyor..."
          echo "======================================================================"
          echo "   - SHAP analizi çalıştırılarak, modelin neden yanlış karar verdiği anlaşılmaya çalışılacak."
          
          # Başarısız olan modeli analiz etmek için script'i çalıştır
          python scripts/analyze_model_explainability.py \
            --output-dir ./analysis_artifacts
            
      - name: Hata Analizi Raporlarını Arşivle
        if: steps.deploy_check.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: hata-analiz-raporlari-${{ github.run_number }}
          path: ./analysis_artifacts/
          retention-days: 30
