name: Golden Windows Regression (Crash Guard)

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  golden-windows:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure PYTHONPATH
        run: echo "PYTHONPATH=${{ github.workspace }}/src:${{ github.workspace }}" >> $GITHUB_ENV

      - name: Run golden windows regression
        run: |
          mkdir -p artifacts/golden_windows
          python scripts/golden_windows_regression.py --validate \
            --windows-yaml scripts/windows.yaml \
            --expectations-yaml scripts/windows_expectations.yaml \
            --output-json artifacts/golden_windows/results.json \
            --output-csv artifacts/golden_windows/results.csv

      - name: Upload regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-windows-results
          path: |
            artifacts/golden_windows/results.json
            artifacts/golden_windows/results.csv

