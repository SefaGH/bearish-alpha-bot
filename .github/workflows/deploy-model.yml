name: Deploy Model to Production

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      artifact_run_id:
        description: 'Training Run ID (optional - uses latest if empty)'
        required: false
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install fastapi uvicorn python-multipart pydantic
      
      # =================================================================
      # DOWNLOAD TRAINED MODEL
      # =================================================================
      - name: 📥 Download trained model artifact
        run: |
          echo "======================================================================"
          echo "📥 DOWNLOADING TRAINED MODEL"
          echo "======================================================================"
          
          # Determine which run to use
          if [ -n "${{ inputs.artifact_run_id }}" ]; then
            RUN_ID="${{ inputs.artifact_run_id }}"
            echo "Using specified run ID: $RUN_ID"
          else
            echo "Finding latest successful training run..."
            
            # Get latest successful run
            gh run list \
              --workflow=train-models.yml \
              --limit 1 \
              --status success \
              --json databaseId,conclusion,createdAt \
              --jq '.[0] | .databaseId' > latest_run_id.txt
            
            RUN_ID=$(cat latest_run_id.txt)
            
            if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
              echo ""
              echo "❌ ERROR: No successful training run found!"
              echo ""
              echo "Please run 'Train Final Production Model' workflow first:"
              echo "  1. Go to Actions → Train Final Production Model"
              echo "  2. Click 'Run workflow'"
              echo "  3. Wait for completion"
              echo "  4. Then re-run this deployment"
              echo ""
              exit 1
            fi
            
            echo "✅ Found latest successful run: $RUN_ID"
            
            # Get run details
            gh run view $RUN_ID --json displayTitle,createdAt,conclusion \
              --jq '. | "Title: \(.displayTitle)\nDate: \(.createdAt)\nStatus: \(.conclusion)"'
          fi
          
          echo ""
          echo "📥 Downloading artifacts from run $RUN_ID..."
          
          # Create temp directory
          mkdir -p .artifacts_temp
          
          # Download artifacts
          gh run download $RUN_ID \
            --pattern "final-model-torchscript-*" \
            --dir .artifacts_temp || {
            echo "❌ Failed to download artifacts!"
            exit 1
          }
          
          echo "✅ Artifacts downloaded"
          
          # Find the artifact directory (name includes SHA)
          ARTIFACT_DIR=$(find .artifacts_temp -type d -name "final-model-torchscript-*" | head -1)
          
          if [ -z "$ARTIFACT_DIR" ]; then
            echo "❌ Artifact directory not found!"
            ls -la .artifacts_temp
            exit 1
          fi
          
          echo "Artifact directory: $ARTIFACT_DIR"
          
          # Create target directories
          mkdir -p data/models/final
          mkdir -p logs/final_training
          
          # Move files to expected locations
          echo "Moving model files..."
          if [ -d "$ARTIFACT_DIR/data/models/final" ]; then
            cp -r "$ARTIFACT_DIR/data/models/final"/* data/models/final/
            echo "✅ Model files moved"
          else
            echo "❌ Model directory not found in artifact!"
            exit 1
          fi
          
          echo "Moving metadata files..."
          if [ -d "$ARTIFACT_DIR/logs/final_training" ]; then
            cp -r "$ARTIFACT_DIR/logs/final_training"/* logs/final_training/
            echo "✅ Metadata files moved"
          else
            echo "❌ Metadata directory not found in artifact!"
            exit 1
          fi
          
          # Verify critical files exist
          echo ""
          echo "Verifying downloaded files..."
          
          if [ ! -f "data/models/final/lstm_final_latest.ptc" ]; then
            echo "❌ Model file missing: lstm_final_latest.ptc"
            exit 1
          fi
          
          if [ ! -f "logs/final_training/metadata_latest.json" ]; then
            echo "❌ Metadata file missing: metadata_latest.json"
            exit 1
          fi
          
          # Display file info
          echo ""
          echo "✅ Downloaded files:"
          echo "Model:"
          ls -lh data/models/final/
          echo ""
          echo "Metadata:"
          ls -lh logs/final_training/
          
          # Cleanup temp directory
          rm -rf .artifacts_temp
          
          echo ""
          echo "✅ Model download complete!"
        env:
          GH_TOKEN: ${{ github.token }}
      
      # =================================================================
      # VERIFY MODEL
      # =================================================================
      - name: ✅ Verify model integrity
        run: |
          echo "======================================================================"
          echo "✅ VERIFYING MODEL"
          echo "======================================================================"
          
          python3 << 'EOF'
          import torch
          from pathlib import Path
          import json
          import hashlib
          
          def compute_file_hash(filepath):
              """Compute SHA256 hash of file"""
              sha256 = hashlib.sha256()
              with open(filepath, 'rb') as f:
                  for chunk in iter(lambda: f.read(4096), b''):
                      sha256.update(chunk)
              return sha256.hexdigest()
          
          try:
              # Load metadata first
              metadata_path = Path('logs/final_training/metadata_latest.json')
              if not metadata_path.exists():
                  print(f"❌ Metadata not found: {metadata_path}")
                  exit(1)
              
              print(f"✅ Metadata file exists: {metadata_path}")
              
              with open(metadata_path) as f:
                  data = json.load(f)
              
              metadata = data['metadata']
              num_features = metadata['num_features']
              expected_accuracy = metadata['final_test_accuracy']
              
              print(f"✅ Metadata loaded:")
              print(f"   Features: {num_features}")
              print(f"   Accuracy: {expected_accuracy:.4f}")
              print(f"   Format: {metadata.get('export_format', 'unknown')}")
              print(f"   Timestamp: {metadata.get('timestamp', 'unknown')}")
              
              # Check TorchScript model
              model_path = Path('data/models/final/lstm_final_latest.ptc')
              if not model_path.exists():
                  print(f"❌ Model not found: {model_path}")
                  exit(1)
              
              file_size = model_path.stat().st_size
              print(f"\n✅ Model file exists: {model_path}")
              print(f"   Size: {file_size / 1024:.2f} KB")
              
              # Compute checksum
              print("\n🔒 Computing model checksum...")
              model_hash = compute_file_hash(model_path)
              print(f"   SHA256: {model_hash[:16]}...")
              
              # Sanity check: Model size
              if file_size < 1024:  # Less than 1KB
                  print("⚠️  WARNING: Model file is very small (<1KB)")
                  print("   This may indicate an incomplete download")
              elif file_size > 10 * 1024 * 1024:  # More than 10MB
                  print("⚠️  WARNING: Model file is very large (>10MB)")
                  print("   This is unusual for a simple LSTM")
              else:
                  print("✅ Model size looks reasonable")
              
              # Load model
              print(f"\n🔄 Loading TorchScript model...")
              model = torch.jit.load(str(model_path))
              model.eval()
              print("✅ Model loaded successfully!")
              
              # Test inference with DYNAMIC feature count
              print(f"\n🧪 Testing inference with {num_features} features...")
              dummy_input = torch.randn(1, num_features)  # ✅ Dynamic!
              
              with torch.no_grad():
                  output = model(dummy_input)
              
              output_classes = output.shape[1]
              print(f"✅ Inference test passed!")
              print(f"   Input shape: {dummy_input.shape}")
              print(f"   Output shape: {output.shape}")
              print(f"   Output classes: {output_classes}")
              
              # Validate output shape
              expected_classes = 3  # Bullish, Neutral, Bearish
              if output_classes != expected_classes:
                  print(f"⚠️  WARNING: Expected {expected_classes} output classes, got {output_classes}")
              
              # Check if accuracy meets threshold
              min_accuracy = 0.53
              if expected_accuracy < min_accuracy:
                  print(f"\n⚠️  WARNING: Model accuracy ({expected_accuracy:.4f}) below threshold ({min_accuracy:.4f})")
                  print("   Consider re-training with more data or different parameters")
              else:
                  print(f"\n✅ Model accuracy ({expected_accuracy:.4f}) meets threshold ({min_accuracy:.4f})")
              
              # Save verification results
              verification = {
                  'model_path': str(model_path),
                  'model_size_kb': file_size / 1024,
                  'model_hash': model_hash,
                  'num_features': num_features,
                  'output_classes': output_classes,
                  'expected_accuracy': expected_accuracy,
                  'verification_passed': True,
                  'timestamp': metadata.get('timestamp', '')
              }
              
              with open('logs/final_training/verification.json', 'w') as f:
                  json.dump(verification, f, indent=2)
              
              print("\n✅ Model verification complete!")
              print("   Verification saved to: logs/final_training/verification.json")
              
          except Exception as e:
              print(f"\n❌ Model verification failed: {e}")
              import traceback
              traceback.print_exc()
              exit(1)
          EOF
      
      # =================================================================
      # CREATE PREDICTION API
      # =================================================================
      - name: 🚀 Create prediction service
        run: |
          echo "======================================================================"
          echo "🚀 CREATING PREDICTION SERVICE"
          echo "======================================================================"
          
          # Ensure directories exist
          mkdir -p src/api
          
          # prediction_service.py already exists in repo
          # Just verify it's there
          if [ -f "src/api/prediction_service.py" ]; then
            echo "✅ Prediction service found: src/api/prediction_service.py"
            wc -l src/api/prediction_service.py
          else
            echo "❌ Prediction service not found!"
            exit 1
          fi
      
      # =================================================================
      # TEST API LOCALLY
      # =================================================================
      - name: 🧪 Test prediction API locally
        run: |
          echo "======================================================================"
          echo "🧪 TESTING PREDICTION API"
          echo "======================================================================"
          
          # Get feature count dynamically
          NUM_FEATURES=$(python3 -c "
          import json
          with open('logs/final_training/metadata_latest.json') as f:
              print(json.load(f)['metadata']['num_features'])
          ")
          
          echo "Model expects $NUM_FEATURES features"
          
          # Generate features array dynamically
          FEATURES=$(python3 -c "
          import json
          features = [0.0] * $NUM_FEATURES
          print(json.dumps(features))
          ")
          
          echo "Generated test features: ${FEATURES:0:50}..."
          
          # Start service in background
          cd src/api
          python prediction_service.py &
          API_PID=$!
          cd ../..
          
          # Wait for service to start
          echo ""
          echo "⏳ Waiting for API to start..."
          sleep 10
          
          # Test health endpoint
          echo ""
          echo "Testing GET /health..."
          HEALTH_RESPONSE=$(curl -s http://localhost:8000/health)
          echo "Response: $HEALTH_RESPONSE"
          
          # Verify health response
          if echo "$HEALTH_RESPONSE" | grep -q '"status":"healthy"'; then
            echo "✅ Health check passed!"
          else
            echo "❌ Health check failed!"
            kill $API_PID 2>/dev/null || true
            exit 1
          fi
          
          # Test metrics endpoint
          echo ""
          echo "Testing GET /metrics..."
          METRICS_RESPONSE=$(curl -s http://localhost:8000/metrics)
          echo "Response: $METRICS_RESPONSE"
          
          if echo "$METRICS_RESPONSE" | grep -q '"test_accuracy"'; then
            echo "✅ Metrics endpoint passed!"
          else
            echo "❌ Metrics endpoint failed!"
            kill $API_PID 2>/dev/null || true
            exit 1
          fi
          
          # Test prediction endpoint with DYNAMIC features
          echo ""
          echo "Testing POST /predict with $NUM_FEATURES features..."
          PREDICT_RESPONSE=$(curl -s -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d "{\"features\": $FEATURES}")
          
          echo "Response: $PREDICT_RESPONSE"
          
          # Verify prediction response
          if echo "$PREDICT_RESPONSE" | grep -q '"prediction"'; then
            echo "✅ Prediction endpoint passed!"
            
            # Extract prediction details
            PREDICTION=$(echo "$PREDICT_RESPONSE" | python3 -c "
            import json, sys
            data = json.load(sys.stdin)
            print(f\"Prediction: {data['class_name']}\")
            print(f\"Confidence: {data['confidence']:.4f}\")
            for cls, prob in data['probabilities'].items():
                print(f\"  {cls}: {prob:.4f}\")
            ")
            
            echo ""
            echo "Prediction Details:"
            echo "$PREDICTION"
          else
            echo "❌ Prediction endpoint failed!"
            echo "Response: $PREDICT_RESPONSE"
            kill $API_PID 2>/dev/null || true
            exit 1
          fi
          
          # Stop service
          kill $API_PID 2>/dev/null || true
          
          echo ""
          echo "✅ All API tests passed!"
      
      # =================================================================
      # DEPLOY TO ENVIRONMENT
      # =================================================================
      - name: 🚀 Deploy to ${{ inputs.environment }}
        run: |
          echo "======================================================================"
          echo "🚀 DEPLOYING TO ${{ inputs.environment }}"
          echo "======================================================================"
          echo ""
          echo "Deployment target: ${{ inputs.environment }}"
          echo "Model path: data/models/final/lstm_final_latest.ptc"
          echo "API path: src/api/prediction_service.py"
          echo ""
          
          # TODO: Add actual deployment steps
          # Examples:
          
          # Option 1: Heroku
          # heroku container:push web --app bearish-alpha-bot-${{ inputs.environment }}
          # heroku container:release web --app bearish-alpha-bot-${{ inputs.environment }}
          
          # Option 2: AWS Lambda
          # aws s3 cp data/models/final/lstm_final_latest.ptc s3://bearish-alpha-models/
          # aws lambda update-function-code --function-name BearishAlphaPredict --s3-bucket bearish-alpha-models --s3-key lstm_final_latest.ptc
          
          # Option 3: Docker + Cloud Run
          # docker build -t gcr.io/project-id/bearish-alpha:latest .
          # docker push gcr.io/project-id/bearish-alpha:latest
          # gcloud run deploy bearish-alpha --image gcr.io/project-id/bearish-alpha:latest
          
          # Option 4: Simple VPS
          # scp -r data/models/final/* user@server:/app/models/
          # scp src/api/prediction_service.py user@server:/app/api/
          # ssh user@server "sudo systemctl restart bearish-alpha-api"
          
          echo "⚠️  Deployment step not yet configured"
          echo "   Add your deployment commands above"
          echo ""
          echo "For now, artifacts are available for manual deployment:"
          echo "  - Model: data/models/final/lstm_final_latest.ptc"
          echo "  - API: src/api/prediction_service.py"
          echo "  - Metadata: logs/final_training/metadata_latest.json"
      
      # =================================================================
      # POST-DEPLOYMENT VERIFICATION
      # =================================================================
      - name: ✅ Post-deployment verification
        run: |
          echo "======================================================================"
          echo "✅ POST-DEPLOYMENT VERIFICATION"
          echo "======================================================================"
          echo ""
          
          # TODO: Add verification steps for deployed service
          # Example:
          # curl -f https://bearish-alpha-bot-${{ inputs.environment }}.herokuapp.com/health
          
          echo "⚠️  Post-deployment verification not yet configured"
          echo ""
          echo "Manual verification steps:"
          echo "  1. Check deployment logs"
          echo "  2. Test /health endpoint"
          echo "  3. Test /predict endpoint with real data"
          echo "  4. Monitor for errors"
        if: always()
      
      # =================================================================
      # ARCHIVE DEPLOYMENT ARTIFACTS
      # =================================================================
      - name: 📦 Archive deployment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deployment-${{ inputs.environment }}-${{ github.sha }}
          path: |
            data/models/final/
            logs/final_training/
            src/api/
          retention-days: 90
