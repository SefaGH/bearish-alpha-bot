name: Manually and Scheduled Train ML Models

on:
  # YENİ EKLENEN BLOK:
  # Bu iş akışını her Pazar sabahı saat 05:00 UTC'de otomatik olarak çalıştırır.
  schedule:
    - cron: '0 5 * * 0'

# Mevcut manuel tetikleme bloğu:
  workflow_dispatch:
    inputs:
      log_level:
        description: 'Log Level'
        required: true
        default: 'INFO'
        type: choice
        options:
        - INFO
        - DEBUG

jobs:
  train-and-save-models:
    runs-on: ubuntu-latest  # İşlemler, GitHub'ın sağladığı bir Linux sanal makinesinde çalışacak
    
    steps:
    # 1. Adım: Proje kodunu sanal makineye indirir
    - name: Check out repository code
      uses: actions/checkout@v4

    # 2. Adım: Python ortamını kurar
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' # Projenizle uyumlu bir Python sürümü

    # 3. Adım: Gerekli kütüphaneleri yükler
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Adım: Model eğitim betiğini çalıştırır
    - name: Run model training script
      env:
        ML_ENABLED: "true" # Ortam değişkenini ayarla
      run: python scripts/train_all_models.py

    # 5. Adım (ÖNEMLİ): Eğitilmiş modelleri bir "artifact" olarak kaydeder
    # Bu sayede, eğitilmiş model dosyalarını daha sonra indirebilirsiniz.
    - name: Archive trained models
      uses: actions/upload-artifact@v4
      with:
        name: trained-models
        path: |
          data/models/
