# ==============================================================================
# BEARISH ALPHA BOT - Configuration File (v3.5 - Centralized ML Config)
# ==============================================================================
# This file serves as a template and documents the default values.
#
# PRIORITY ORDER (Highest to Lowest):
# 1. GitHub Variables (Repository → Settings → Secrets and variables → Actions)
# 2. Environment Variables (local .env file)
# 3. This file (config.example.yaml)
# 4. Hardcoded defaults in the Python code
#
# To change a setting for production, create a "Repository Variable" in GitHub.
# The comment next to each setting shows the corresponding GitHub Variable name.
# ==============================================================================

# ==============================================================================
# EXECUTION SETTINGS
# ==============================================================================
execution:
  enable_live: true              # Override with: ENABLE_LIVE_TRADING
  order_type: market             # Override with: ORDER_TYPE
  time_in_force: IOC             # Override with: TIME_IN_FORCE
  fee_pct: 0.0006                # Override with: FEE_PCT
  max_slippage_pct: 0.001        # Override with: MAX_SLIPPAGE_PCT
  leverage:
    default: 5                   # Override with: LEVERAGE_DEFAULT
    overrides:
      "BTC/USDT:USDT": 10

# ==============================================================================
# RISK MANAGEMENT
# ==============================================================================
risk:
  equity_usd: 100                     # Override with: CAPITAL_USDT
  per_trade_risk_pct: 0.01            # Override with: PER_TRADE_RISK_PCT
  daily_loss_limit_pct: 0.02          # Override with: DAILY_LOSS_LIMIT_PCT
  risk_usd_cap: 5                     # Override with: RISK_USD_CAP
  max_notional_per_trade: 20          # Override with: MAX_NOTIONAL_PER_TRADE
  min_stop_pct: 0.003                 # Override with: MIN_STOP_PCT
  min_amount_behavior: skip
  min_notional_behavior: skip
  daily_max_trades: 5                 # Override with: DAILY_MAX_TRADES

# Asset class-specific risk limits (optional, not commonly overridden)
class_limits:
  meme:
    max_notional_per_trade: 10
    risk_usd_cap: 0.5
  microcap:
    max_notional_per_trade: 15
    risk_usd_cap: 0.75
  bluechip:
    max_notional_per_trade: 25
    risk_usd_cap: 1.0

# ==============================================================================
# NOTIFICATIONS
# ==============================================================================
notify:
  send_all: true
  push_no_signal: true
  push_debug: true
  min_cooldown_sec: 300
  push_trail_updates: false

# ==============================================================================
# MARKET REGIME
# ==============================================================================
regime:
  min_slow_candles: 90

# ==============================================================================
# WEBSOCKET & DATA
# ==============================================================================
websocket:
  enabled: true                       # Override with: WEBSOCKET_ENABLED
  priority_enabled: true              # Override with: WEBSOCKET_PRIORITY_ENABLED
  max_data_age: 60                    # Override with: WEBSOCKET_MAX_DATA_AGE
  fallback_threshold: 3               # Override with: WEBSOCKET_FALLBACK_THRESHOLD
  buffer_size: 300
  max_streams_per_exchange:
    bingx: 10                         # Override with: WS_MAX_STREAMS_BINGX
    binance: 20                       # Override with: WS_MAX_STREAMS_BINANCE
    kucoinfutures: 15                 # Override with: WS_MAX_STREAMS_KUCOIN
    default: 10                       # Override with: WS_MAX_STREAMS_DEFAULT
  stream_timeframes: "1m,5m,15m,30m,1h,4h" # Override with: WS_STREAM_TIMEFRAMES
  reconnect_delay: 5                  # Override with: WS_RECONNECT_DELAY
  max_reconnect_attempts: 3           # Override with: WS_MAX_RECONNECT_ATTEMPTS

# ==============================================================================
# TRADING UNIVERSE
# ==============================================================================
universe:
  prefetch:
    enabled: true
    startup_candle_count: 500
  fixed_symbols: "BTC/USDT:USDT,ETH/USDT:USDT,SOL/USDT:USDT" # Override with: TRADING_SYMBOLS
  auto_select: false                  # Override with: UNIVERSE_AUTO_SELECT
  priority_order: "BTC/USDT:USDT,ETH/USDT:USDT,SOL/USDT:USDT" # Override with: TRADING_SYMBOLS_PRIORITY

# ==============================================================================
# TECHNICAL INDICATORS
# ==============================================================================
indicators:
  rsi_period: 14                      # Override with: INDICATOR_RSI_PERIOD
  atr_period: 14                      # Override with: INDICATOR_ATR_PERIOD
  ema_fast: 21                        # Override with: INDICATOR_EMA_FAST
  ema_mid: 50                         # Override with: INDICATOR_EMA_MID
  ema_slow: 200                       # Override with: INDICATOR_EMA_SLOW

# ==============================================================================
# ADAPTIVE STRATEGIES CONTROL
# ==============================================================================
adaptive_strategies:
  enable: true
  monitoring:
    enabled: true
    report_interval: 300
    track_performance: true
  performance:
    min_volatility_for_adjustment: 0.02
    max_position_multiplier: 2.0
    min_position_multiplier: 0.5

# ==============================================================================
# SIGNAL GENERATION & STRATEGIES
# ==============================================================================
signals:
  duplicate_prevention:
    min_price_change_pct: 0.0005      # Override with: DUPLICATE_PREVENTION_THRESHOLD
    cooldown_seconds: 60              # Override with: DUPLICATE_PREVENTION_COOLDOWN
    price_delta_bypass_threshold: 0.0015 # Override with: PRICE_DELTA_BYPASS_THRESHOLD
    price_delta_bypass_enabled: false # Override with: PRICE_DELTA_BYPASS_ENABLED
    ml_duplicate_detection_enabled: true
  oversold_bounce:
    enable: true                      # Override with: STRATEGY_OB_ENABLED
    ignore_regime: true               # Override with: STRATEGY_OB_IGNORE_REGIME
    rsi_max: 45
    adaptive_rsi_base: 45             # Override with: RSI_BASE_OB
    adaptive_rsi_range: 10            # Override with: RSI_RANGE_OB
    adaptive_mode: "dynamic"
    volatility_sensitivity: "medium"
    tp_atr_mult: 2.5
    sl_atr_mult: 1.2
    min_tp_pct: 0.008
    max_sl_pct: 0.015
  short_the_rip:
    enable: true                      # Override with: STRATEGY_STR_ENABLED
    ignore_regime: true               # Override with: STRATEGY_STR_IGNORE_REGIME
    rsi_min: 55
    adaptive_rsi_base: 55             # Override with: RSI_BASE_STR
    adaptive_rsi_range: 10            # Override with: RSI_RANGE_STR
    adaptive_mode: "dynamic"
    volatility_sensitivity: "medium"
    tp_atr_mult: 3.0
    sl_atr_mult: 1.5
    min_tp_pct: 0.010
    max_sl_pct: 0.020
    symbols:
      "BTC/USDT:USDT":
        rsi_threshold: 55             # Override with: RSI_THRESHOLD_BTC
      "ETH/USDT:USDT":
        rsi_threshold: 50             # Override with: RSI_THRESHOLD_ETH
      "SOL/USDT:USDT":
        rsi_threshold: 50             # Override with: RSI_THRESHOLD_SOL

# ==============================================================================
# POSITION EXIT MANAGEMENT
# ==============================================================================
position_management:
  exit_monitoring:
    enabled: true
    check_frequency: 5
  time_based_exit:
    max_position_duration: 3600

# ==============================================================================
# QUARANTINE SYSTEM
# ==============================================================================
quarantine:
  enable: true
  days: 7
  file: data/quarantine.json

# ==============================================================================
# ML (MACHINE LEARNING) CONFIGURATION (Centralized and Modernized)
# ==============================================================================
ml:
  enabled: true                       # Master switch for all ML features. Override with: ML_ENABLED

  # ----------------------------------------------------------------------------
  # Feature Engineering
  # These settings define the parameters for calculating technical indicators
  # that are used as inputs for all ML models.
  # ----------------------------------------------------------------------------
  features:
    rsi_period: 14                    # Override with: ML_FEAT_RSI_PERIOD
    atr_period: 14                    # Override with: ML_FEAT_ATR_PERIOD
    macd_fast: 12                     # Override with: ML_FEAT_MACD_FAST
    macd_slow: 26                     # Override with: ML_FEAT_MACD_SLOW
    macd_signal: 9                    # Override with: ML_FEAT_MACD_SIGNAL
    bb_period: 20                     # Override with: ML_FEAT_BB_PERIOD
    bb_std: 2                         # Override with: ML_FEAT_BB_STD
    volatility_windows: "5,10,20,50"  # Comma-separated. Override with: ML_FEAT_VOL_WINDOWS
    momentum_windows: "5,10,20,50"  # Comma-separated. Override with: ML_FEAT_MOM_WINDOWS

  # ----------------------------------------------------------------------------
  # Price & Regime Prediction Engine
  # Settings for the models that predict market regime and price movements.
  # ----------------------------------------------------------------------------
  prediction:
    update_interval_seconds: 60       # How often to run predictions. Override with: ML_PRED_UPDATE_INTERVAL
    cache_ttl_seconds: 300            # How long to cache a prediction. Override with: ML_PRED_CACHE_TTL
    min_confidence_threshold: 0.6     # Min confidence to consider a prediction valid. Override with: ML_PRED_MIN_CONFIDENCE
    regime_change_threshold: 0.7      # Min confidence for a regime change signal. Override with: ML_PRED_REGIME_THRESHOLD

  # ----------------------------------------------------------------------------
  # Reinforcement Learning (RL) Agent
  # The final decision-maker that can veto or approve signals.
  # ----------------------------------------------------------------------------
  reinforcement_learning:
    enabled: true                     # RL master switch. Override with: ML_RL_ENABLED
    training_mode: false              # Set to true only for training. Override with: ML_RL_TRAINING_MODE

    # Behavior Tuning
    # If the agent's confidence in 'HOLD' is below this, it considers its second choice.
    # Lower value = more aggressive (more trades). Higher value = more defensive.
    hold_confidence_threshold: 0.60   # Override with: ML_RL_HOLD_CONFIDENCE_THRESHOLD

    # Epsilon for inference (live trading). A small value for minimal random actions.
    epsilon_inference: 0.01           # Override with: ML_RL_EPSILON_INFERENCE

    # Core Algorithm Parameters (Advanced - change with caution)
    learning_rate: 0.0001             # Override with: ML_RL_LEARNING_RATE
    gamma: 0.99                       # Discount factor. Override with: ML_RL_GAMMA
    target_update_freq: 10            # Freq. to update target network. Override with: ML_RL_TARGET_UPDATE_FREQ
    batch_size: 64                    # Training batch size. Override with: ML_RL_BATCH_SIZE
    buffer_size: 100000               # Experience replay buffer size. Override with: ML_RL_BUFFER_SIZE

  # ----------------------------------------------------------------------------
  # Model Architecture Parameters (Advanced - for reference)
  # ----------------------------------------------------------------------------
  # These values define the neural network structures.
  # Changing them requires retraining the models. They are not typically overridden.
  models:
    lstm:
      hidden_size: 128
      num_layers: 3
      dropout: 0.2
    transformer:
      d_model: 256
      nhead: 8
      num_layers: 6
    random_forest:
      n_estimators: 100
      max_depth: 10
    ensemble_weights:
      lstm: 0.4
      transformer: 0.4
      random_forest: 0.2
```
