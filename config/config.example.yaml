# ==============================================================================
# BEARISH ALPHA BOT - Configuration File (v3.6 - Training Pipeline Integration)
# ==============================================================================
# This file serves as a template and documents the default values.
#
# CONFIGURATION PRIORITY ORDER (Highest to Lowest):
# 1. GitHub Variables (Repository → Settings → Secrets and variables → Actions)
# 2. Environment Variables (local .env file)
# 3. This file (config.example.yaml)
# 4. Hardcoded defaults in the Python code
#
# To change a setting for production, create a "Repository Variable" in GitHub.
# The comment next to each setting shows the corresponding GitHub Variable name.
#
# ==============================================================================
# TRAINING vs LIVE TRADING CONFIGURATION
# ==============================================================================
# This config file is used by BOTH training and live trading:
#
# TRAINING (scripts/train_all_models.py):
#   - Uses centralized config loader (LiveTradingConfiguration)
#   - Supports environment variable overrides via GitHub Variables
#   - ml.reinforcement_learning.training_mode MUST be true
#   - ml.regime_prediction.model_params defines architecture
#
# LIVE TRADING (src/core/main.py):
#   - Uses same centralized config loader
#   - ml.reinforcement_learning.training_mode should be false
#   - Uses pre-trained models from data/models/
#
# CRITICAL: Model architecture parameters (LSTM hidden_size, etc.) must match
# between config and trained models. Changing these requires retraining!
# ==============================================================================

# ==============================================================================
# EXECUTION SETTINGS
# ==============================================================================
execution:
  enable_live: true              # Override with: ENABLE_LIVE_TRADING
  order_type: market             # Override with: ORDER_TYPE
  time_in_force: IOC             # Override with: TIME_IN_FORCE
  fee_pct: 0.0006                # Override with: FEE_PCT
  max_slippage_pct: 0.001        # Override with: MAX_SLIPPAGE_PCT
  leverage:
    default: 5                   # Override with: LEVERAGE_DEFAULT
    overrides:
      "BTC/USDT:USDT": 10

# ==============================================================================
# RISK MANAGEMENT - ENHANCED POSITION SIZING
# ==============================================================================
risk:
  # Existing parameters (keep these)
  equity_usd: 100                     # Override with: CAPITAL_USDT
  per_trade_risk_pct: 0.01            # Override with: PER_TRADE_RISK_PCT
  daily_loss_limit_pct: 0.02          # Override with: DAILY_LOSS_LIMIT_PCT
  risk_usd_cap: 5                     # Override with: RISK_USD_CAP
  
  # NEW: Dynamic position sizing parameters
  max_position_size_pct: 0.20         # Override with: MAX_POSITION_SIZE_PCT
  max_notional_pct_per_trade: 0.20    # Override with: MAX_NOTIONAL_PCT_PER_TRADE
  max_margin_pct_per_trade: 0.20      # Override with: MAX_MARGIN_PCT_PER_TRADE
  
  # Safety limits
  min_position_size_usd: 10           # Override with: MIN_POSITION_SIZE_USD
  min_stop_pct: 0.003                 # Override with: MIN_STOP_PCT
  
  # Deprecated - DO NOT USE (causes the bug)
  # max_notional_per_trade: 20        # REMOVED - use max_notional_pct_per_trade instead
  
  min_amount_behavior: skip
  min_notional_behavior: skip
  daily_max_trades: 5                 # Override with: DAILY_MAX_TRADES
  
  # NEW: Dynamic Risk/Reward System
  rr_dynamic:
    enabled: true                     # Override with: RR_DYNAMIC_ENABLED
    
    # Base Configuration
    base_target_rr: 1.5              # Override with: RR_BASE_TARGET
    lower_bound_rr: 0.8              # Override with: RR_LOWER_BOUND
    upper_bound_rr: 2.0              # Override with: RR_UPPER_BOUND
    
    # Intelligence Weights (sum should be ~1.0)
    weights:
      ml_confidence: 0.3             # Override with: RR_WEIGHT_ML
      rl_agreement: 0.3              # Override with: RR_WEIGHT_RL
      regime_clarity: 0.2            # Override with: RR_WEIGHT_REGIME
      volume_strength: 0.1           # Override with: RR_WEIGHT_VOLUME
      momentum_strength: 0.1         # Override with: RR_WEIGHT_MOMENTUM
    
    # Fallback values when ML/RL data missing
    fallback:
      missing_ml_default: 0.5        # Override with: RR_FALLBACK_ML
      missing_rl_default: 0.5        # Override with: RR_FALLBACK_RL
      missing_regime_default: 0.3    # Override with: RR_FALLBACK_REGIME
    
    # Regime-specific multipliers
    regime_multipliers:
      bullish: 0.9                   # Override with: RR_MULT_BULLISH
      bearish: 0.9                   # Override with: RR_MULT_BEARISH
      neutral: 1.0                   # Override with: RR_MULT_NEUTRAL
      volatile: 1.2                  # Override with: RR_MULT_VOLATILE

# Asset class-specific risk limits (optional, not commonly overridden)
class_limits:
  meme:
    max_notional_per_trade: 10
    risk_usd_cap: 0.5
  microcap:
    max_notional_per_trade: 15
    risk_usd_cap: 0.75
  bluechip:
    max_notional_per_trade: 25
    risk_usd_cap: 1.0

# ==============================================================================
# NOTIFICATIONS
# ==============================================================================
notify:
  send_all: true
  push_no_signal: true
  push_debug: true
  min_cooldown_sec: 300
  push_trail_updates: false

# ==============================================================================
# MARKET REGIME
# ==============================================================================
regime:
  min_slow_candles: 90

# ==============================================================================
# WEBSOCKET & DATA
# ==============================================================================
websocket:
  enabled: true                       # Override with: WEBSOCKET_ENABLED
  priority_enabled: true              # Override with: WEBSOCKET_PRIORITY_ENABLED
  max_data_age: 60                    # Override with: WEBSOCKET_MAX_DATA_AGE
  fallback_threshold: 3               # Override with: WEBSOCKET_FALLBACK_THRESHOLD
  buffer_size: 300
  max_streams_per_exchange:
    bingx: 10                         # Override with: WS_MAX_STREAMS_BINGX
    binance: 20                       # Override with: WS_MAX_STREAMS_BINANCE
    kucoinfutures: 15                 # Override with: WS_MAX_STREAMS_KUCOIN
    default: 10                       # Override with: WS_MAX_STREAMS_DEFAULT
  stream_timeframes: "1m,5m,15m,30m,1h,4h" # Override with: WS_STREAM_TIMEFRAMES
  reconnect_delay: 5                  # Override with: WS_RECONNECT_DELAY
  max_reconnect_attempts: 3           # Override with: WS_MAX_RECONNECT_ATTEMPTS

# ==============================================================================
# TRADING UNIVERSE
# ==============================================================================
universe:
  prefetch:
    enabled: true
    startup_candle_count: 500
  fixed_symbols: "BTC/USDT:USDT,ETH/USDT:USDT,SOL/USDT:USDT" # Override with: TRADING_SYMBOLS
  auto_select: false                  # Override with: UNIVERSE_AUTO_SELECT
  priority_order: "BTC/USDT:USDT,ETH/USDT:USDT,SOL/USDT:USDT" # Override with: TRADING_SYMBOLS_PRIORITY

# ==============================================================================
# TECHNICAL INDICATORS
# ==============================================================================
indicators:
  rsi_period: 14                      # Override with: INDICATOR_RSI_PERIOD
  atr_period: 14                      # Override with: INDICATOR_ATR_PERIOD
  ema_fast: 21                        # Override with: INDICATOR_EMA_FAST
  ema_mid: 50                         # Override with: INDICATOR_EMA_MID
  ema_slow: 200                       # Override with: INDICATOR_EMA_SLOW

# ==============================================================================
# ADAPTIVE STRATEGIES CONTROL
# ==============================================================================
adaptive_strategies:
  enable: true
  monitoring:
    enabled: true
    report_interval: 300
    track_performance: true
  performance:
    min_volatility_for_adjustment: 0.02
    max_position_multiplier: 2.0
    min_position_multiplier: 0.5

# ==============================================================================
# SIGNAL GENERATION & STRATEGIES
# ==============================================================================
signals:
  # Extreme Condition Bypass - Prevents RL Agent from blocking obvious signals
  # when RSI reaches extreme oversold/overbought levels
  bypass:
    enabled: true                     # Override with: SIGNAL_BYPASS_ENABLED
    rsi_oversold_threshold: 20        # Override with: SIGNAL_BYPASS_RSI_OVERSOLD (BUY signals when RSI < this)
    rsi_overbought_threshold: 80      # Override with: SIGNAL_BYPASS_RSI_OVERBOUGHT (SELL signals when RSI > this)
  
  duplicate_prevention:
    min_price_change_pct: 0.0005      # Override with: DUPLICATE_PREVENTION_THRESHOLD
    cooldown_seconds: 20              # Override with: DUPLICATE_PREVENTION_COOLDOWN
    price_delta_bypass_threshold: 0.0015 # Override with: PRICE_DELTA_BYPASS_THRESHOLD
    price_delta_bypass_enabled: false # Override with: PRICE_DELTA_BYPASS_ENABLED
    ml_duplicate_detection_enabled: true
  oversold_bounce:
    enable: true                      # Override with: STRATEGY_OB_ENABLED
    ignore_regime: true               # Override with: STRATEGY_OB_IGNORE_REGIME
    min_rr_ratio: 0.5                 # 🔥 YENİ DEĞER: R/R filtresini gevşetmek için.
    rsi_max: 45
    adaptive_rsi_base: 50             # Override with: RSI_BASE_OB
    adaptive_rsi_range: 10            # Override with: RSI_RANGE_OB
    adaptive_mode: "dynamic"
    volatility_sensitivity: "medium"
    tp_atr_mult: 2.5
    sl_atr_mult: 1.2
    min_tp_pct: 0.008
    max_sl_pct: 0.015
  short_the_rip:
    enable: true                      # Override with: STRATEGY_STR_ENABLED
    ignore_regime: true               # Override with: STRATEGY_STR_IGNORE_REGIME
    min_rr_ratio: 0.5                 # 🔥 YENİ DEĞER: R/R filtresini gevşetmek için.
    rsi_min: 55
    adaptive_rsi_base: 50             # Override with: RSI_BASE_STR
    adaptive_rsi_range: 10            # Override with: RSI_RANGE_STR
    adaptive_mode: "dynamic"
    volatility_sensitivity: "medium"
    tp_atr_mult: 3.0
    sl_atr_mult: 1.5
    min_tp_pct: 0.010
    max_sl_pct: 0.020
    symbols:
      "BTC/USDT:USDT":
        rsi_threshold: 50             # Override with: RSI_THRESHOLD_BTC
      "ETH/USDT:USDT":
        rsi_threshold: 50
      "SOL/USDT:USDT":
        rsi_threshold: 50

# ==============================================================================
# POSITION EXIT MANAGEMENT
# ==============================================================================
position_management:
  exit_monitoring:
    enabled: true
    check_frequency: 5
  time_based_exit:
    max_position_duration: 3600

# ==============================================================================
# QUARANTINE SYSTEM
# ==============================================================================
quarantine:
  enable: true
  days: 7
  file: data/quarantine.json

# ==============================================================================
# ML (MACHINE LEARNING) CONFIGURATION (v3.6 - Refactored for Clarity)
# ==============================================================================
# Bu blok, tüm makine öğrenmesi bileşenlerinin ayarlarını içerir.
# Her ana bileşenin (Price Predictor, Regime Predictor, RL Agent) kendi
# parametre bloğu vardır. Bu, yapılandırmayı temiz, yönetilebilir ve hatasız tutar.
# ==============================================================================
ml:
  enabled: true                       # Tüm ML özelliklerini etkinleştiren ana anahtar. Override: ML_ENABLED

  # ----------------------------------------------------------------------------
  # A) GENEL ÖZELLİK MÜHENDİSLİĞİ (Tüm Modeller İçin Ortak)
  # Bu ayarlar, tüm ML modellerine girdi olarak verilen teknik indikatörlerin
  # nasıl hesaplanacağını tanımlar.
  # ----------------------------------------------------------------------------
  features:
    rsi_period: 14                    # Override: ML_FEAT_RSI_PERIOD
    atr_period: 14                    # Override: ML_FEAT_ATR_PERIOD
    macd_fast: 12                     # Override: ML_FEAT_MACD_FAST
    macd_slow: 26                     # Override: ML_FEAT_MACD_SLOW
    macd_signal: 9                    # Override: ML_FEAT_MACD_SIGNAL
    bb_period: 20                     # Override: ML_FEAT_BB_PERIOD
    bb_std: 2                         # Override: ML_FEAT_BB_STD
    volatility_windows: [5, 10, 20, 50] # Override: ML_FEAT_VOL_WINDOWS
    momentum_windows: [5, 10, 20, 50]   # Override: ML_FEAT_MOM_WINDOWS

  # ----------------------------------------------------------------------------
  # B) FİYAT TAHMİN MOTORU (AdvancedPricePredictionEngine)
  # Fiyat hareketlerini ve yönünü tahmin eden LSTM ve Transformer modellerinin ayarları.
  # ----------------------------------------------------------------------------
  price_prediction:
    # 1. Genel Ayarlar
    enabled: true                     # Fiyat tahmin motorunu etkinleştirir.
    timeframes: ['5m', '15m', '30m', '1h', '4h'] # Override: ML_PRED_TIMEFRAMES
    update_interval_seconds: 60       # Override: ML_PRED_UPDATE_INTERVAL
    cache_ttl_seconds: 300            # Override: ML_PRED_CACHE_TTL
    
    # 2. Model Mimarisi (Bu motorun kullanacağı modeller)
    models: ['lstm', 'transformer']   # Override: ML_MODELS
    feature_size: 42                  # Override: ML_FEATURE_SIZE
    forecast_horizon: 12              # Override: ML_FORECAST_HORIZON

    # 3. Model Parametreleri (SADECE Fiyat Tahmincisi için)
    model_params:
      lstm:
        hidden_size: 128
        num_layers: 3
        dropout: 0.2
      transformer:
        d_model: 256
        nhead: 8
        num_layers: 6
    
    # 4. Ensemble (Model Birleştirme) Ağırlıkları
    ensemble_weights:
      lstm: 0.5
      transformer: 0.5

  # ----------------------------------------------------------------------------
  # C) PİYASA REJİMİ TAHMİNCİSİ (MLRegimePredictor)
  # Piyasanın "Bullish", "Bearish", "Neutral" veya "Volatile" rejimlerinden
  # hangisinde olduğunu tahmin eden modellerin (Random Forest vb.) ayarları.
  # ----------------------------------------------------------------------------
  regime_prediction:
    enabled: true                     # Rejim tahmin motorunu etkinleştirir.
    min_confidence_threshold: 0.6     # Override: ML_REGIME_MIN_CONFIDENCE
    
    # NEW: Soft-Weighting Configuration
    # Instead of hard cutoff, use graduated weighting based on confidence
    soft_weighting_enabled: true      # Override: REGIME_SOFT_WEIGHT_ENABLED
    min_confidence_hard_reject: 0.30  # Override: REGIME_MIN_CONF_REJECT (Below this, completely ignore)
    min_confidence_full_weight: 0.60  # Override: REGIME_MIN_CONF_FULL (Above this, use full weight)
    
    # 1. Model Parametreleri (SADECE Rejim Tahmincisi için)
    # ⚠️ KRİTİK: Bu parametreler TÜM kod tabanında kullanılır:
    #   - src/ml/neural_networks.py (LSTMRegimePredictor default değerleri)
    #   - src/ml/model_trainer.py (model eğitimi sırasında)
    #   - src/ml/regime_predictor.py (model yükleme sırasında)
    #   - scripts/train_all_models.py (eğitim betiğinde)
    # Bu değerleri değiştirirseniz, eski modelleri SİLİP yeniden eğitmelisiniz!
    # 
    # FAZ 3.1 OPTIMIZATION: Neural network parameters optimized for better performance
    model_params:
      random_forest:
        n_estimators: 150
        max_depth: 15
      xgboost:
        n_estimators: 200
        learning_rate: 0.05
      lstm_regime:
        # FAZ 3.3 VALUES (Anti-Overfit V2) - SYNCHRONIZED WITH model_trainer.py
        hidden_size: 64               # ✅ SYNCED: Override: ML_LSTM_HIDDEN (matches model_trainer.py LSTM_HIDDEN_SIZE)
        num_layers: 2                 # ✅ SYNCED: Override: ML_LSTM_LAYERS (matches model_trainer.py LSTM_NUM_LAYERS)
        dropout: 0.6                  # ✅ SYNCED: Override: ML_LSTM_DROPOUT (matches model_trainer.py LSTM_DROPOUT)
    
    # 2. Ensemble Ağırlıkları
    ensemble_weights:
      random_forest: 0.6
      xgboost: 0.4
      # lstm_regime: 0.2 # (Gelecekte eklenebilir)

  # ----------------------------------------------------------------------------
  # D) PEKİŞTİRMELİ ÖĞRENME AJANI (TradingRLAgent)
  # Diğer sinyalleri onaylayan veya veto eden nihai karar verici.
  # ----------------------------------------------------------------------------
  reinforcement_learning:
    enabled: true                     # Override: ML_RL_ENABLED
    
    # Training Mode Control
    # ============================================================================
    # CRITICAL: This parameter controls the agent's learning behavior
    # ============================================================================
    # When TRUE (training mode):
    #   - Agent starts with high exploration (epsilon_start = 1.0)
    #   - Epsilon decays over episodes (epsilon_decay = 0.995)
    #   - Agent learns from experiences and updates weights
    #   - Use for: Training scripts (train_all_models.py)
    #
    # When FALSE (inference mode):
    #   - Agent uses minimal exploration (epsilon_inference = 0.01)
    #   - No epsilon decay
    #   - Agent uses pre-trained weights without learning
    #   - Use for: Live trading
    # ============================================================================
    training_mode: true               # ✅ CHANGED: Override: ML_RL_TRAINING_MODE (false → true for training)

    # Davranış Ayarları
    hold_confidence_threshold: 0.60   # Override: ML_RL_HOLD_CONFIDENCE_THRESHOLD
    
    # Exploration Parameters (Epsilon-Greedy Strategy)
    epsilon_inference: 0.01           # Override: ML_RL_EPSILON_INFERENCE (for live trading, minimal exploration)
    epsilon_start: 1.0                # ✅ ADDED: Override: ML_RL_EPSILON_START (training: start with full exploration)
    epsilon_decay: 0.9897             # ✅ ADDED: Override: ML_RL_EPSILON_DECAY (training: decay rate per episode)
                                      # Previous: 0.995 (too slow, resulted in 29% final epsilon)
                                      # Formula: (target_final/initial)^(1/episodes) = (0.08/1.0)^(1/250)
    epsilon_min: 0.01                 # ✅ ADDED: Override: ML_RL_EPSILON_MIN (training: minimum exploration floor)
    
    regime_bias_strength: 5.0         # Override: ML_RL_REGIME_BIAS
    risk_penalty_strength: 100.0      # Override: ML_RL_RISK_PENALTY

    # Temel Algoritma Parametreleri (Uzman kullanıcılar için)
    learning_rate: 0.00001            # Override: ML_RL_LEARNING_RATE
    gamma: 0.99                       # Override: ML_RL_GAMMA
    target_update_freq: 50            # Override: ML_RL_TARGET_UPDATE_FREQ
    batch_size: 32                    # Override: ML_RL_BATCH_SIZE
    buffer_size: 100000               # Override: ML_RL_BUFFER_SIZE

  # ----------------------------------------------------------------------------
  # E) SIGNAL SCORING SYSTEM
  # Composite scoring system for signal quality assessment
  # ----------------------------------------------------------------------------
  signal_scoring:
    enabled: true                     # Override: SIGNAL_SCORING_ENABLED
    min_score_to_trade: 60            # Override: SIGNAL_MIN_SCORE (Minimum score to execute trade)
    
    # Component weights (should sum to 1.0)
    weights:
      strategy: 0.3                   # Override: SCORE_WEIGHT_STRATEGY (Base strategy signal strength)
      ml_price: 0.3                   # Override: SCORE_WEIGHT_ML (ML price prediction confidence)
      regime: 0.2                     # Override: SCORE_WEIGHT_REGIME (Regime prediction weight)
      risk_reward: 0.2                # Override: SCORE_WEIGHT_RR (Risk/reward ratio quality)

  # =======================================================
  # GEMMA ML Pipeline Configuration
  # =======================================================
  gemma:
    # GEMMA'yı etkinleştirmek için 'true' yapın veya GEMMA_ENABLED ortam değişkenini kullanın.
    # Üretimde devreye alınana kadar 'false' kalması önerilir.
    enabled: true  # Override with: GEMMA_ENABLED
    
    # Model Yolları (.pt uzantılı TorchScript modelleri olmalıdır)
    # Updated to new production location (Plan 2)
    model_path: "data/models/final/gemma_price.pt"
    
    # Özellik (Feature) Konfigürasyon Dosyaları
    features_path: "features/gemma/selected/gemma_price_selected_82.json"
    
    # Yardımcı Dosyalar
    # Updated to new production location (Plan 2) - co-located with models
    scaler_path: "data/models/final/gemma_price_scaler.joblib"
    feature_mask_path: "data/cache/gemma/feature_selection_mask.npy"
    
    # Gölge Modu (Mevcut sistemle paralel çalışarak doğrulama yapar)
    shadow_mode: true
    shadow_duration_hours: 48
    
    # Performans Ayarları
    cache_ttl: 30  # Saniye cinsinden aynı tahminler için önbellek süresi
    max_inference_time: 0.5 # Saniye cinsinden maksimum tahmin süresi (izleme için)
    
    # Circuit Breaker (Hata toleransı)
    # Model tahmininde art arda hata alınması durumunda devreye girer.
    circuit_breaker:
      enabled: true
      failure_threshold: 5      # Bu sayıda hata sonrası devre açılır
      recovery_timeout: 60      # Saniye cinsinden tekrar deneme süresi
    
    # Training Configuration
    thresholds:
      min_samples: 1000  # Minimum number of samples required for training
    
    training:
      batch_size: 64          # <-- Optuna'dan gelen en iyi değer
      epochs: 50
      learning_rate: 0.003322 # <-- Optuna'dan gelen en iyi değer (yuvarlanmış)
      early_stopping_patience: 10
    
    architecture:
      input_size: 81          # <-- DOĞRU: Özellik seçimi sonrası gerçek özellik sayısı
      hidden_size: 64         # <-- Optuna'dan gelen en iyi değer
      num_layers: 3           # <-- Optuna'dan gelen en iyi değer (değişmedi)
      dropout: 0.3217         # <-- Optuna'dan gelen en iyi değer (yuvarlanmış)
      num_classes: 3          # <-- DOĞRU: Bullish (0), Neutral (1), Bearish (2)
      
    feature_set: "gemma_v1"
    
  # =======================================================
  # AI-Gate Güven Eşikleri
  # =======================================================
  price:
    # Fiyat tahmini için minimum güven skoru
    min_confidence: 0.66
    
  regime:
    # Rejim tahmini için minimum güven skoru
    min_confidence: 0.60

