# ==============================================================================
# BEARISH ALPHA BOT - Configuration File (v3.6 - Training Pipeline Integration)
# ==============================================================================
# This file serves as a template and documents the default values.
#
# CONFIGURATION PRIORITY ORDER (Highest to Lowest):
# 1. GitHub Variables (Repository → Settings → Secrets and variables → Actions)
# 2. Environment Variables (local .env file)
# 3. This file (config.example.yaml)
# 4. Hardcoded defaults in the Python code
#
# To change a setting for production, create a "Repository Variable" in GitHub.
# The comment next to each setting shows the corresponding GitHub Variable name.
#
# ==============================================================================
# TRAINING vs LIVE TRADING CONFIGURATION
# ==============================================================================
# This config file is used by BOTH training and live trading:
#
# TRAINING (scripts/train_all_models.py):
#   - Uses centralized config loader (LiveTradingConfiguration)
#   - Supports environment variable overrides via GitHub Variables
#   - ml.reinforcement_learning.training_mode MUST be true
#   - ml.regime_prediction.model_params defines architecture
#
# LIVE TRADING (src/core/main.py):
#   - Uses same centralized config loader
#   - ml.reinforcement_learning.training_mode should be false
#   - Uses pre-trained models from data/models/
#
# CRITICAL: Model architecture parameters (LSTM hidden_size, etc.) must match
# between config and trained models. Changing these requires retraining!
# ==============================================================================

# ==============================================================================
# EXECUTION SETTINGS
# ==============================================================================
execution:
  enable_live: true              # Override with: ENABLE_LIVE_TRADING
  order_type: market             # Override with: ORDER_TYPE
  time_in_force: IOC             # Override with: TIME_IN_FORCE
  fee_pct: 0.0006                # Override with: FEE_PCT
  max_slippage_pct: 0.001        # Override with: MAX_SLIPPAGE_PCT
  leverage:
    default: 5                   # Override with: LEVERAGE_DEFAULT
    overrides:
      "BTC/USDT:USDT": 10       # Override with: LEVERAGE_BTC_USDT

# ==============================================================================
# RISK MANAGEMENT - ENHANCED POSITION SIZING
# ==============================================================================
risk:
  # Size Planner rollout flag (Option B)
  # RISK_SIZE_PLANNER_ENABLED=false → legacy Sprint 1 sizing (planner runs in shadow only)
  # RISK_SIZE_PLANNER_ENABLED=true  → Size Planner active as primary sizing governor
  size_planner_enabled: true          # Override with: RISK_SIZE_PLANNER_ENABLED (balanced preset = active)

  # Balanced preset (fractions, not percents)
  equity_usd: 500                     # Override with: CAPITAL_USDT
  per_trade_risk_pct: 0.003           # Override with: PER_TRADE_RISK_PCT (0.3% of equity)
  daily_loss_limit_pct: 0.02          # Override with: DAILY_LOSS_LIMIT_PCT
  risk_usd_cap: 1                     # Override with: RISK_USD_CAP
  
  # NEW: Dynamic position sizing parameters
  max_position_size_pct: 0.25         # Override with: MAX_POSITION_SIZE_PCT
  max_notional_pct_per_trade: 0.25    # Override with: MAX_NOTIONAL_PCT_PER_TRADE
  max_margin_pct_per_trade: 0.30      # Override with: MAX_MARGIN_PCT_PER_TRADE
  position_size_policy: clip          # Override with: POSITION_SIZE_POLICY (clip|reject)
  
  # Safety limits
  min_position_size_usd: 10           # Override with: MIN_POSITION_SIZE_USD
  min_stop_pct: 0.005                 # Override with: MIN_STOP_PCT
  
  # Deprecated - DO NOT USE (causes the bug)
  # max_notional_per_trade: 20        # REMOVED - use max_notional_pct_per_trade instead
  
  min_amount_behavior: skip           # Override with: MIN_AMOUNT_BEHAVIOR
  min_notional_behavior: skip         # Override with: MIN_NOTIONAL_BEHAVIOR
  daily_max_trades: 8                 # Override with: DAILY_MAX_TRADES
  
  # NEW: Dynamic Risk/Reward System
  rr_dynamic:
    enabled: true                     # Override with: RR_DYNAMIC_ENABLED
    
    # Base Configuration
    base_target_rr: 2.0              # Override with: RR_BASE_TARGET
    lower_bound_rr: 1.2              # Override with: RR_LOWER_BOUND
    upper_bound_rr: 3.0              # Override with: RR_UPPER_BOUND
    
    # Intelligence Weights (sum should be ~1.0)
    weights:
      ml_confidence: 0.35            # Override with: RR_WEIGHT_ML
      rl_agreement: 0.35             # Override with: RR_WEIGHT_RL
      regime_clarity: 0.2            # Override with: RR_WEIGHT_REGIME
      volume_strength: 0.05          # Override with: RR_WEIGHT_VOLUME
      momentum_strength: 0.05        # Override with: RR_WEIGHT_MOMENTUM
    
    # Fallback values when ML/RL data missing
    fallback:
      missing_ml_default: 0.5        # Override with: RR_FALLBACK_ML
      missing_rl_default: 0.5        # Override with: RR_FALLBACK_RL
      missing_regime_default: 0.3    # Override with: RR_FALLBACK_REGIME
    
    # Regime-specific multipliers
    regime_multipliers:
      bullish: 0.9                   # Override with: RR_MULT_BULLISH
      bearish: 0.9                   # Override with: RR_MULT_BEARISH
      neutral: 1.0                   # Override with: RR_MULT_NEUTRAL
      volatile: 1.2                  # Override with: RR_MULT_VOLATILE

    # Strategy-specific overrides (optional)
    strategy_overrides:
      scalper:
        base_target_rr: 1.5              # Override with: RR_SCALPER_BASE_TARGET
        lower_bound_rr: 1.0              # Override with: RR_SCALPER_LOWER_BOUND
        weights:
          ml_confidence: 0.25            # Override with: RR_SCALPER_WEIGHT_ML
          regime_clarity: 0.10           # Override with: RR_SCALPER_WEIGHT_REGIME
      mean_reversion:
        upper_bound_rr: 2.2              # Override with: RR_MEANREV_UPPER_BOUND
        regime_multipliers:
          neutral: 0.9                   # Override with: RR_MEANREV_MULT_NEUTRAL
          volatile: 1.3                  # Override with: RR_MEANREV_MULT_VOLATILE
      breakout_hunter:
        base_target_rr: 2.2              # Override with: RR_BREAKOUT_BASE_TARGET
        lower_bound_rr: 1.4              # Override with: RR_BREAKOUT_LOWER_BOUND
        weights:
          ml_confidence: 0.45            # Override with: RR_BREAKOUT_WEIGHT_ML
          volume_strength: 0.15          # Override with: RR_BREAKOUT_WEIGHT_VOLUME

  # Volume-aware risk scaling
  volume_bucket_risk_matrix:        # Override with: RISK_VOLUME_BUCKET_MATRIX
    LOW:
      position_size_multiplier: 0.5
      stop_loss_multiplier: 1.3
      take_profit_multiplier: 0.9
    NORMAL:
      position_size_multiplier: 1.0
      stop_loss_multiplier: 1.0
      take_profit_multiplier: 1.0
    HIGH:
      position_size_multiplier: 1.2
      stop_loss_multiplier: 0.9
      take_profit_multiplier: 1.1
    EXTREME:
      position_size_multiplier: 1.5
      stop_loss_multiplier: 0.8
      take_profit_multiplier: 1.3

  # NEW: Signal execution queue controls
  queue:
    ttl_seconds: 60                 # Override with: SIGNAL_QUEUE_TTL_SECONDS (drop stale signals)
    max_queue_depth: 50             # Override with: SIGNAL_QUEUE_MAX_DEPTH
    batch_dequeue: 3                # Override with: SIGNAL_QUEUE_BATCH_DEQUEUE (signals pulled per cycle)
    max_pending_per_symbol: 1       # Override with: SIGNAL_QUEUE_MAX_PENDING_PER_SYMBOL
    max_pending_scale_in_per_symbol: 2 # Override with: SIGNAL_QUEUE_MAX_PENDING_SCALE_IN_PER_SYMBOL (only for scale_in when pyramiding enabled)
    priority_weights:
      explicit_priority: 0.4        # Override with: SIGNAL_QUEUE_WEIGHT_PRIORITY
      risk_reward: 0.3              # Override with: SIGNAL_QUEUE_WEIGHT_RR
      ml_confidence: 0.2            # Override with: SIGNAL_QUEUE_WEIGHT_ML
      urgency: 0.1                  # Override with: SIGNAL_QUEUE_WEIGHT_URGENCY
      regime_alignment: 0.05        # Override with: SIGNAL_QUEUE_WEIGHT_REGIME_ALIGNMENT
      strategy_urgency: 0.05        # Override with: SIGNAL_QUEUE_WEIGHT_STRATEGY_URGENCY

  # NEW: Concurrent risk guardrails
  concurrent_limits:
    max_open_positions: 3           # Override with: MAX_OPEN_POSITIONS
    max_positions_per_symbol: 1     # Override with: MAX_POSITIONS_PER_SYMBOL
    max_total_risk_pct: 0.06        # Override with: MAX_TOTAL_RISK_PCT (fraction of equity at risk)
    correlation_bucket_threshold: 0.8 # Override with: CORRELATION_BUCKET_THRESHOLD
    dynamic_scaling:
      enabled: true                 # Override with: DYNAMIC_SCALING_ENABLED
      quality_threshold: 0.80       # Override with: DYNAMIC_SCALING_QUALITY_THRESHOLD (accepts 0-1 or 0-100)
      min_unrealized_pnl_pct: 0.005 # Override with: DYNAMIC_SCALING_MIN_PNL_PCT (0.5% avg PnL requirement)
      max_additional_positions: 2   # Override with: DYNAMIC_SCALING_MAX_EXTRA (extra slots per symbol)

  # NEW: Volatility-aware sizing parameters
  volatility_sizing:
    enabled: true                   # Override with: VOL_SIZING_ENABLED
    atr_window: 14                  # Override with: VOL_SIZING_ATR_WINDOW
    atr_floor_pct: 0.005            # Override with: VOL_SIZING_ATR_FLOOR (0.5%)
    atr_ceiling_pct: 0.02           # Override with: VOL_SIZING_ATR_CEILING (2%)
    low_vol_multiplier: 1.2         # Override with: VOL_SIZING_LOW_MULT
    baseline_multiplier: 1.0        # Override with: VOL_SIZING_BASE_MULT
    high_vol_multiplier: 0.6        # Override with: VOL_SIZING_HIGH_MULT
    min_position_size_pct: 0.01     # Override with: VOL_SIZING_MIN_POSITION_PCT

# Asset class-specific risk limits (optional, not commonly overridden)
class_limits:
  meme:
    max_notional_per_trade: 10       # Override with: CLASS_MEME_MAX_NOTIONAL
    risk_usd_cap: 0.5                # Override with: CLASS_MEME_RISK_CAP
  microcap:
    max_notional_per_trade: 15       # Override with: CLASS_MICROCAP_MAX_NOTIONAL
    risk_usd_cap: 0.75               # Override with: CLASS_MICROCAP_RISK_CAP
  bluechip:
    max_notional_per_trade: 25       # Override with: CLASS_BLUECHIP_MAX_NOTIONAL
    risk_usd_cap: 1.0                # Override with: CLASS_BLUECHIP_RISK_CAP

# ==============================================================================
# NOTIFICATIONS
# ==============================================================================
notify:
  send_all: true                      # Override with: NOTIFY_SEND_ALL
  push_no_signal: true                # Override with: NOTIFY_PUSH_NO_SIGNAL
  push_debug: true                    # Override with: NOTIFY_PUSH_DEBUG
  min_cooldown_sec: 300               # Override with: NOTIFY_MIN_COOLDOWN_SEC
  push_trail_updates: false           # Override with: NOTIFY_PUSH_TRAIL_UPDATES

# ==============================================================================
# MARKET REGIME
# ==============================================================================
regime:
  min_slow_candles: 90                # Override with: REGIME_MIN_SLOW_CANDLES

# ==============================================================================
# WEBSOCKET & DATA
# ==============================================================================
websocket:
  enabled: true                       # Override with: WEBSOCKET_ENABLED
  priority_enabled: true              # Override with: WEBSOCKET_PRIORITY_ENABLED
  max_data_age: 60                    # Override with: WEBSOCKET_MAX_DATA_AGE
  fallback_threshold: 3               # Override with: WEBSOCKET_FALLBACK_THRESHOLD
  buffer_size: 300                    # Override with: WEBSOCKET_BUFFER_SIZE
  max_streams_per_exchange:
    bingx: 10                         # Override with: WS_MAX_STREAMS_BINGX
    binance: 20                       # Override with: WS_MAX_STREAMS_BINANCE
    kucoinfutures: 15                 # Override with: WS_MAX_STREAMS_KUCOIN
    default: 10                       # Override with: WS_MAX_STREAMS_DEFAULT
  stream_timeframes: "1m,5m,15m,30m,1h,4h" # Override with: WS_STREAM_TIMEFRAMES
  reconnect_delay: 5                  # Override with: WS_RECONNECT_DELAY
  max_reconnect_attempts: 3           # Override with: WS_MAX_RECONNECT_ATTEMPTS

# ==============================================================================
# TRADING UNIVERSE
# ==============================================================================
universe:
  prefetch:
    enabled: true                     # Override with: UNIVERSE_PREFETCH_ENABLED
    startup_candle_count: 500         # Override with: UNIVERSE_STARTUP_CANDLE_COUNT
  fixed_symbols: "BTC/USDT:USDT,ETH/USDT:USDT,SOL/USDT:USDT" # Override with: TRADING_SYMBOLS
  auto_select: false                  # Override with: UNIVERSE_AUTO_SELECT
  priority_order: "BTC/USDT:USDT,ETH/USDT:USDT,SOL/USDT:USDT" # Override with: TRADING_SYMBOLS_PRIORITY

# ==============================================================================
# TECHNICAL INDICATORS
# ==============================================================================
indicators:
  rsi_period: 14                      # Override with: INDICATOR_RSI_PERIOD
  atr_period: 14                      # Override with: INDICATOR_ATR_PERIOD
  ema_fast: 21                        # Override with: INDICATOR_EMA_FAST
  ema_mid: 50                         # Override with: INDICATOR_EMA_MID
  ema_slow: 200                       # Override with: INDICATOR_EMA_SLOW

# ============================================================================== 
# VALIDATOR
# ============================================================================== 
validator:
  # If true, VolumeAnalyzer readiness failures will mark the symbol as FAIL
  # during indicator validation (and can abort pre-flight checks). If false,
  # VolumeAnalyzer readiness issues will log a warning but not fail the symbol.
  volume_analyzer_required: false    # Override with: VALIDATOR_VOLUME_ANALYZER_REQUIRED

# ============================================================================== 
# VOLUME ANALYZER
# ==============================================================================
volume_analyzer:
  enabled: true                      # Override with: VOLUME_ANALYZER_ENABLED
  baseline_short_tf: "1h"            # Override with: VOLUME_ANALYZER_BASELINE_SHORT_TF
  baseline_medium_tf: "4h"           # Override with: VOLUME_ANALYZER_BASELINE_MEDIUM_TF
  short_lookback: 168                # Override with: VOLUME_ANALYZER_SHORT_LOOKBACK
  medium_lookback: 180               # Override with: VOLUME_ANALYZER_MEDIUM_LOOKBACK
  window_bars: 3                     # Override with: VOLUME_ANALYZER_WINDOW_BARS
  weight_short: 0.6
  weight_medium: 0.4
  sigmoid_alpha: 1.2                 # Override with: VOLUME_ANALYZER_SIGMOID_ALPHA
  min_ratio: 0.1                     # Override with: VOLUME_ANALYZER_MIN_RATIO
  max_ratio: 10.0                    # Override with: VOLUME_ANALYZER_MAX_RATIO
  buckets:                           # Override with: VOLUME_ANALYZER_BUCKETS
    - [0.0, "LOW"]
    - [0.3, "NORMAL"]
    - [0.6, "HIGH"]
    - [0.85, "EXTREME"]

# ==============================================================================
# ADAPTIVE STRATEGIES CONTROL
# ==============================================================================
adaptive_strategies:
  enable: true                        # Override with: ADAPTIVE_STRATEGIES_ENABLE
  monitoring:
    enabled: true                     # Override with: ADAPTIVE_MONITORING_ENABLED
    report_interval: 300              # Override with: ADAPTIVE_REPORT_INTERVAL
    track_performance: true           # Override with: ADAPTIVE_TRACK_PERFORMANCE
  performance:
    min_volatility_for_adjustment: 0.02 # Override with: ADAPTIVE_MIN_VOLATILITY
    max_position_multiplier: 2.0      # Override with: ADAPTIVE_MAX_POS_MULT
    min_position_multiplier: 0.5      # Override with: ADAPTIVE_MIN_POS_MULT

# ==============================================================================
# SIGNAL GENERATION & STRATEGIES
# ==============================================================================
signals:
  # Extreme Condition Bypass - Prevents RL Agent from blocking obvious signals
  # when RSI reaches extreme oversold/overbought levels
  bypass:
    enabled: true                     # Override with: SIGNAL_BYPASS_ENABLED
    rsi_oversold_threshold: 12        # Override with: SIGNAL_BYPASS_RSI_OVERSOLD (BUY signals when RSI < this)
    rsi_overbought_threshold: 88      # Override with: SIGNAL_BYPASS_RSI_OVERBOUGHT (SELL signals when RSI > this)
    force_swap_enabled: true          # Override with: SIGNAL_FORCE_SWAP_ENABLED (swap weakest position when slots are full)
  
  duplicate_prevention:
    min_price_change_pct: 0.0005      # Override with: DUPLICATE_PREVENTION_THRESHOLD
    cooldown_seconds: 20              # Override with: DUPLICATE_PREVENTION_COOLDOWN
    price_delta_bypass_threshold: 0.0015 # Override with: PRICE_DELTA_BYPASS_THRESHOLD
    price_delta_bypass_enabled: false # Override with: PRICE_DELTA_BYPASS_ENABLED
    # Optional scale-in specific thresholds (defaults mirror entry for safety)
    scale_in_min_price_change_pct: 0.0005
    scale_in_cooldown_seconds: 20
    ml_duplicate_detection_enabled: true # Override with: DUPLICATE_ML_DETECTION_ENABLED
    dynamic_cooldown:
      enabled: true                   # Override with: DUPLICATE_DYNAMIC_COOLDOWN_ENABLED
      high_delta_threshold: 15        # Override with: DUPLICATE_DYNAMIC_HIGH_DELTA (RSI delta > value → fast cooldown)
      medium_delta_threshold: 8       # Override with: DUPLICATE_DYNAMIC_MEDIUM_DELTA
      fast_cooldown_seconds: 15       # Override with: DUPLICATE_DYNAMIC_FAST_SECONDS
      medium_cooldown_seconds: 45     # Override with: DUPLICATE_DYNAMIC_MEDIUM_SECONDS
      slow_cooldown_seconds: 120      # Override with: DUPLICATE_DYNAMIC_SLOW_SECONDS
  oversold_bounce:
    enable: true                      # Override with: STRATEGY_OB_ENABLED
    ignore_regime: false              # Override with: STRATEGY_OB_IGNORE_REGIME
    min_rr_ratio: 1.5                 # Override with: STRATEGY_OB_MIN_RR
    rsi_max: 45                       # Override with: STRATEGY_OB_RSI_MAX
    adaptive_rsi_base: 32             # Override with: RSI_BASE_OB
    adaptive_rsi_range: 8             # Override with: RSI_RANGE_OB
    adaptive_mode: "dynamic"           # Override with: STRATEGY_OB_ADAPTIVE_MODE
    volatility_sensitivity: "medium"   # Override with: STRATEGY_OB_VOL_SENSITIVITY
    tp_atr_mult: 2.5                  # Override with: STRATEGY_OB_TP_ATR_MULT
    sl_atr_mult: 1.2                  # Override with: STRATEGY_OB_SL_ATR_MULT
    min_tp_pct: 0.008                 # Override with: STRATEGY_OB_MIN_TP_PCT
    max_sl_pct: 0.015                 # Override with: STRATEGY_OB_MAX_SL_PCT
  short_the_rip:
    enable: true                      # Override with: STRATEGY_STR_ENABLED
    ignore_regime: false              # Override with: STRATEGY_STR_IGNORE_REGIME
    min_rr_ratio: 1.5                 # Override with: STRATEGY_STR_MIN_RR
    rsi_min: 55                       # Override with: STRATEGY_STR_RSI_MIN
    adaptive_rsi_base: 68             # Override with: RSI_BASE_STR
    adaptive_rsi_range: 8             # Override with: RSI_RANGE_STR
    adaptive_mode: "dynamic"           # Override with: STRATEGY_STR_ADAPTIVE_MODE
    volatility_sensitivity: "medium"   # Override with: STRATEGY_STR_VOL_SENSITIVITY
    tp_atr_mult: 3.0                  # Override with: STRATEGY_STR_TP_ATR_MULT
    sl_atr_mult: 1.5                  # Override with: STRATEGY_STR_SL_ATR_MULT
    min_tp_pct: 0.010                 # Override with: STRATEGY_STR_MIN_TP_PCT
    max_sl_pct: 0.020                 # Override with: STRATEGY_STR_MAX_SL_PCT
    volatility_stop:
      enabled: true                   # Override with: STRATEGY_STR_VOL_STOP_ENABLED
      min_sl_pct: 0.0025              # Override with: STRATEGY_STR_VOL_STOP_MIN_SL
      max_sl_pct: 0.02                # Override with: STRATEGY_STR_VOL_STOP_MAX_SL
      overrides:
        low:
          atr_scale: 0.75             # Override with: STRATEGY_STR_VOL_LOW_ATR_SCALE
          min_sl_pct: 0.0015          # Override with: STRATEGY_STR_VOL_LOW_MIN_SL
          max_sl_pct: 0.015           # Override with: STRATEGY_STR_VOL_LOW_MAX_SL
        normal:
          atr_scale: 1.0              # Override with: STRATEGY_STR_VOL_NORMAL_ATR_SCALE
        high:
          atr_scale: 1.15             # Override with: STRATEGY_STR_VOL_HIGH_ATR_SCALE
          min_sl_pct: 0.003           # Override with: STRATEGY_STR_VOL_HIGH_MIN_SL
          max_sl_pct: 0.025           # Override with: STRATEGY_STR_VOL_HIGH_MAX_SL
    symbols:
      "BTC/USDT:USDT":
        rsi_threshold: 50             # Override with: RSI_THRESHOLD_BTC
      "ETH/USDT:USDT":
        rsi_threshold: 50             # Override with: RSI_THRESHOLD_ETH
      "SOL/USDT:USDT":
        rsi_threshold: 50             # Override with: RSI_THRESHOLD_SOL

# ==============================================================================
# STRATEGY ROUTING (Regime-aware)
# ==============================================================================
strategies:
  regime_routing:
    bullish:
      preferred_strategies: ["trend_follower", "breakout_hunter"] # Override with: REGIME_BULLISH_STRATEGIES
      preferred_priority: 0.8         # Override with: REGIME_BULLISH_PRIORITY
      fallback_priority: 0.4          # Override with: REGIME_BULLISH_FALLBACK
      queue_priority_boost: 0.75      # Override with: REGIME_BULLISH_QUEUE_BOOST
    bearish:
      preferred_strategies: ["short_the_rip", "mean_reversion"] # Override with: REGIME_BEARISH_STRATEGIES
      preferred_priority: 0.85        # Override with: REGIME_BEARISH_PRIORITY
    neutral:
      preferred_strategies: ["range_sniper", "mean_reversion"] # Override with: REGIME_NEUTRAL_STRATEGIES
      preferred_priority: 0.7         # Override with: REGIME_NEUTRAL_PRIORITY
    volatile:
      preferred_strategies: ["scalper", "volatility_breakout"] # Override with: REGIME_VOLATILE_STRATEGIES
      preferred_priority: 0.9         # Override with: REGIME_VOLATILE_PRIORITY
      queue_priority_boost: 0.9       # Override with: REGIME_VOLATILE_QUEUE_BOOST
    default:
      preferred_priority: 0.5         # Override with: REGIME_DEFAULT_PRIORITY
      fallback_priority: 0.4          # Override with: REGIME_DEFAULT_FALLBACK

  adaptive_ob:
    allow_low_volume: false         # Override with: STRATEGY_OB_ALLOW_LOW_VOLUME
    volume_filters:
      enabled: true                 # Override with: STRATEGY_OB_VOLUME_FILTERS_ENABLED
      min_bucket: "NORMAL"          # Override with: STRATEGY_OB_VOLUME_FILTERS_MIN_BUCKET
      high_volume_min_bucket: "HIGH" # Override with: STRATEGY_OB_VOLUME_FILTERS_HIGH_VOL_MIN_BUCKET
      use_volume_strength_in_score: true  # Override with: STRATEGY_OB_VOLUME_FILTERS_USE_STRENGTH
      volume_score_weight: 0.15     # Override with: STRATEGY_OB_VOLUME_FILTERS_WEIGHT

  adaptive_short_the_rip:
    allow_low_volume: false         # Override with: STRATEGY_STR_ALLOW_LOW_VOLUME
    volume_filters:
      enabled: true                 # Override with: STRATEGY_STR_VOLUME_FILTERS_ENABLED
      min_bucket: "NORMAL"          # Override with: STRATEGY_STR_VOLUME_FILTERS_MIN_BUCKET
      high_volume_min_bucket: "HIGH" # Override with: STRATEGY_STR_VOLUME_FILTERS_HIGH_VOL_MIN_BUCKET
      use_volume_strength_in_score: true  # Override with: STRATEGY_STR_VOLUME_FILTERS_USE_STRENGTH
      volume_score_weight: 0.15     # Override with: STRATEGY_STR_VOLUME_FILTERS_WEIGHT

# ==============================================================================
# POSITION EXIT MANAGEMENT
# ==============================================================================
position_management:
  exit_monitoring:
    enabled: true                     # Override with: EXIT_MONITORING_ENABLED
    check_frequency: 5                # Override with: EXIT_CHECK_FREQUENCY
  time_based_exit:
    max_position_duration: 3600       # Override with: MAX_POSITION_DURATION

# ==============================================================================
# PYRAMIDING (Shadow mode by default)
# ==============================================================================
pyramiding:
  enabled: false                      # Override with: PYRAMIDING_ENABLED (shadow: no behavior change)
  max_layers_per_symbol: 3            # Override with: PYRAMIDING_MAX_LAYERS_PER_SYMBOL
  min_scale_in_quality: 0.80          # Override with: PYRAMIDING_MIN_SCALE_IN_QUALITY (future use)
  min_scale_in_unrealized_pnl_pct: 0.005 # Override with: PYRAMIDING_MIN_SCALE_IN_PNL (future use)
  min_scale_in_distance_pct: 0.005    # Override with: PYRAMIDING_MIN_SCALE_IN_DISTANCE (future use)

# ==============================================================================
# QUARANTINE SYSTEM
# ==============================================================================
quarantine:
  enable: true                        # Override with: QUARANTINE_ENABLE
  days: 7                             # Override with: QUARANTINE_DAYS
  file: data/quarantine.json          # Override with: QUARANTINE_FILE

# ==============================================================================
# ML (MACHINE LEARNING) CONFIGURATION (v3.6 - Refactored for Clarity)
# ==============================================================================
# Bu blok, tüm makine öğrenmesi bileşenlerinin ayarlarını içerir.
# Her ana bileşenin (Price Predictor, Regime Predictor, RL Agent) kendi
# parametre bloğu vardır. Bu, yapılandırmayı temiz, yönetilebilir ve hatasız tutar.
# ==============================================================================
ml:
  enabled: true                       # Tüm ML özelliklerini etkinleştiren ana anahtar. Override: ML_ENABLED

  # ----------------------------------------------------------------------------
  # A) GENEL ÖZELLİK MÜHENDİSLİĞİ (Tüm Modeller İçin Ortak)
  # Bu ayarlar, tüm ML modellerine girdi olarak verilen teknik indikatörlerin
  # nasıl hesaplanacağını tanımlar.
  # ----------------------------------------------------------------------------
  features:
    rsi_period: 14                    # Override: ML_FEAT_RSI_PERIOD
    atr_period: 14                    # Override: ML_FEAT_ATR_PERIOD
    macd_fast: 12                     # Override: ML_FEAT_MACD_FAST
    macd_slow: 26                     # Override: ML_FEAT_MACD_SLOW
    macd_signal: 9                    # Override: ML_FEAT_MACD_SIGNAL
    bb_period: 20                     # Override: ML_FEAT_BB_PERIOD
    bb_std: 2                         # Override: ML_FEAT_BB_STD
    volatility_windows: [5, 10, 20, 50] # Override: ML_FEAT_VOL_WINDOWS
    momentum_windows: [5, 10, 20, 50]   # Override: ML_FEAT_MOM_WINDOWS

  # ----------------------------------------------------------------------------
  # B) FİYAT TAHMİN MOTORU (AdvancedPricePredictionEngine)
  # Fiyat hareketlerini ve yönünü tahmin eden LSTM ve Transformer modellerinin ayarları.
  # ----------------------------------------------------------------------------
  price_prediction:
    # 1. Genel Ayarlar
    enabled: true                     # Override with: ML_PRED_ENABLED
    timeframes: ['5m', '15m', '30m', '1h', '4h'] # Override with: ML_PRED_TIMEFRAMES
    update_interval_seconds: 60       # Override: ML_PRED_UPDATE_INTERVAL
    cache_ttl_seconds: 300            # Override: ML_PRED_CACHE_TTL
    
    # 2. Model Mimarisi (Bu motorun kullanacağı modeller)
    models: ['lstm', 'transformer']   # Override: ML_MODELS
    feature_size: 42                  # Override: ML_FEATURE_SIZE
    forecast_horizon: 12              # Override: ML_FORECAST_HORIZON

    # 3. Model Parametreleri (SADECE Fiyat Tahmincisi için)
    model_params:
      lstm:
        hidden_size: 128              # Override with: ML_PRED_LSTM_HIDDEN
        num_layers: 3                 # Override with: ML_PRED_LSTM_LAYERS
        dropout: 0.2                  # Override with: ML_PRED_LSTM_DROPOUT
      transformer:
        d_model: 256                  # Override with: ML_PRED_TRANS_D_MODEL
        nhead: 8                      # Override with: ML_PRED_TRANS_NHEAD
        num_layers: 6                 # Override with: ML_PRED_TRANS_LAYERS
    
    # 4. Ensemble (Model Birleştirme) Ağırlıkları
    ensemble_weights:
      lstm: 0.5                       # Override with: ML_PRED_WEIGHT_LSTM
      transformer: 0.5                # Override with: ML_PRED_WEIGHT_TRANSFORMER

  # ----------------------------------------------------------------------------
  # C) PİYASA REJİMİ TAHMİNCİSİ (MLRegimePredictor)
  # Piyasanın "Bullish", "Bearish", "Neutral" veya "Volatile" rejimlerinden
  # hangisinde olduğunu tahmin eden modellerin (Random Forest vb.) ayarları.
  # ----------------------------------------------------------------------------
  regime_prediction:
    enabled: true                     # Override with: ML_REGIME_ENABLED
    min_confidence_threshold: 0.6     # Override with: ML_REGIME_MIN_CONFIDENCE
    
    # NEW: Soft-Weighting Configuration
    # Instead of hard cutoff, use graduated weighting based on confidence
    soft_weighting_enabled: true      # Override: REGIME_SOFT_WEIGHT_ENABLED
    min_confidence_hard_reject: 0.30  # Override: REGIME_MIN_CONF_REJECT (Below this, completely ignore)
    min_confidence_full_weight: 0.60  # Override: REGIME_MIN_CONF_FULL (Above this, use full weight)
    
    # 1. Model Parametreleri (SADECE Rejim Tahmincisi için)
    # ⚠️ KRİTİK: Bu parametreler TÜM kod tabanında kullanılır:
    #   - src/ml/neural_networks.py (LSTMRegimePredictor default değerleri)
    #   - src/ml/model_trainer.py (model eğitimi sırasında)
    #   - src/ml/regime_predictor.py (model yükleme sırasında)
    #   - scripts/train_all_models.py (eğitim betiğinde)
    # Bu değerleri değiştirirseniz, eski modelleri SİLİP yeniden eğitmelisiniz!
    # 
    # FAZ 3.1 OPTIMIZATION: Neural network parameters optimized for better performance
    model_params:
      random_forest:
        n_estimators: 150             # Override with: ML_RF_N_ESTIMATORS
        max_depth: 15                 # Override with: ML_RF_MAX_DEPTH
      xgboost:
        n_estimators: 200             # Override with: ML_XGB_N_ESTIMATORS
        learning_rate: 0.05           # Override with: ML_XGB_LEARNING_RATE
      lstm_regime:
        # FAZ 3.3 VALUES (Anti-Overfit V2) - SYNCHRONIZED WITH model_trainer.py
        hidden_size: 64               # ✅ SYNCED: Override: ML_LSTM_HIDDEN (matches model_trainer.py LSTM_HIDDEN_SIZE)
        num_layers: 2                 # ✅ SYNCED: Override: ML_LSTM_LAYERS (matches model_trainer.py LSTM_NUM_LAYERS)
        dropout: 0.6                  # ✅ SYNCED: Override: ML_LSTM_DROPOUT (matches model_trainer.py LSTM_DROPOUT)
    
    # 2. Ensemble Ağırlıkları
    ensemble_weights:
      random_forest: 0.6              # Override with: ML_REGIME_WEIGHT_RF
      xgboost: 0.4                    # Override with: ML_REGIME_WEIGHT_XGB
      # lstm_regime: 0.2 # (Gelecekte eklenebilir)

  # ----------------------------------------------------------------------------
  # D) PEKİŞTİRMELİ ÖĞRENME AJANI (TradingRLAgent)
  # Diğer sinyalleri onaylayan veya veto eden nihai karar verici.
  # ----------------------------------------------------------------------------
  reinforcement_learning:
    enabled: true                     # Override: ML_RL_ENABLED
    legacy_dqn_enabled: false         # Override with: ML_RL_LEGACY_ENABLED
    ppo_enabled: true                 # Override with: ML_RL_PPO_ENABLED
    ppo_symbols: BTC/USDT:USDT        # Override with: ML_RL_PPO_SYMBOLS
    ppo_timeframe: "1h"               # Override with: ML_RL_PPO_TIMEFRAME
    ppo_model_path: "artifacts/ppo/ppo_trading_agent.zip" # Override with: ML_RL_PPO_MODEL
    ppo_fallback_score: 0.5           # Override with: ML_RL_PPO_FALLBACK
    ppo_rr_down_mult: 0.9             # Override with: ML_RL_PPO_RR_DOWN
    ppo_rr_up_mult: 1.3               # Override with: ML_RL_PPO_RR_UP
    ppo_position_base: 0.5            # Override with: ML_RL_PPO_POS_BASE
    ppo_position_bonus: 0.5           # Override with: ML_RL_PPO_POS_BONUS
    ppo_lookback_bars: 240            # Override with: ML_RL_PPO_LOOKBACK_BARS (candles fetched for PPO state)
    ppo_lookback_windows: [12, 24, 48, 96] # Override with: ML_RL_PPO_LOOKBACK_WINDOWS (summary windows for telemetry)
    
    # Training Mode Control
    # ============================================================================
    # CRITICAL: This parameter controls the agent's learning behavior
    # ============================================================================
    # When TRUE (training mode):
    #   - Agent starts with high exploration (epsilon_start = 1.0)
    #   - Epsilon decays over episodes (epsilon_decay = 0.995)
    #   - Agent learns from experiences and updates weights
    #   - Use for: Training scripts (train_all_models.py)
    #
    # When FALSE (inference mode):
    #   - Agent uses minimal exploration (epsilon_inference = 0.01)
    #   - No epsilon decay
    #   - Agent uses pre-trained weights without learning
    #   - Use for: Live trading
    # ============================================================================
    training_mode: true               # Override: ML_RL_TRAINING_MODE (false → true for training)

    # Davranış Ayarları
    hold_confidence_threshold: 0.60   # Override: ML_RL_HOLD_CONFIDENCE_THRESHOLD
    
    # Exploration Parameters (Epsilon-Greedy Strategy)
    epsilon_inference: 0.01           # Override: ML_RL_EPSILON_INFERENCE (for live trading, minimal exploration)
    epsilon_start: 1.0                # Override: ML_RL_EPSILON_START (training: start with full exploration)
    epsilon_decay: 0.97               # Override: ML_RL_EPSILON_DECAY (training: decay rate per episode)
    epsilon_min: 0.01                 # Override: ML_RL_EPSILON_MIN (training: minimum exploration floor)
    
    regime_bias_strength: 0.0         # Override: ML_RL_REGIME_BIAS
    max_regime_bias: 3.0              # Override: ML_RL_MAX_REGIME_BIAS
    min_regime_confidence_for_bias: 0.6  # Override: ML_RL_MIN_REGIME_CONF
    q_std_bypass_threshold: 0.0001    # Override: ML_RL_Q_STD_BYPASS
    risk_penalty_strength: 10.0       # Override: ML_RL_RISK_PENALTY

    # Temel Algoritma Parametreleri (Uzman kullanıcılar için)
    learning_rate: 0.00003            # Override: ML_RL_LEARNING_RATE
    gamma: 0.95                       # Override: ML_RL_GAMMA
    gradient_clip_norm: 1.0           # Override: ML_RL_GRADIENT_CLIP

    # Reward normalizasyonu ve stabilite ayarları
    reward_clip_enabled: true         # Override: ML_RL_REWARD_CLIP_ENABLED
    reward_clip_min: -2.0             # Override: RL_REWARD_CLIP_MIN
    reward_clip_max: 2.0              # Override: RL_REWARD_CLIP_MAX
    reward_scale: 1.0                 # Override: RL_REWARD_SCALE

    # Trade penaltisi: her adımda portföyün ne kadarlık kısmını çevirdiğine (0–1)
    # bağlı küçük bir ceza uygular. Örn: 0.001 → portföyün %100'ünü tek adımda
    # çevirmek reward'dan 0.001 düşer.
    trade_penalty_alpha: 0.0          # Override: ML_RL_TRADE_PENALTY_ALPHA

    # HOLD / idle cost: Ajan hiçbir trade yapmayıp sürekli HOLD ederse,
    # her adımda küçük bir ceza alır ve uzun vadede negatif reward birikir.
    idle_cost: 0.0                    # Override: ML_RL_IDLE_COST

    target_update_freq: 50            # Override: ML_RL_TARGET_UPDATE_FREQ
    batch_size: 32                    # Override: ML_RL_BATCH_SIZE
    buffer_size: 100000               # Override: ML_RL_BUFFER_SIZE

  # ----------------------------------------------------------------------------
  # E) SIGNAL SCORING SYSTEM
  # Composite scoring system for signal quality assessment
  # ----------------------------------------------------------------------------
  signal_scoring:
    enabled: true                     # Override: SIGNAL_SCORING_ENABLED
    min_score_to_trade: 75            # Override: SIGNAL_MIN_SCORE (Minimum score to execute trade)
    
    # Component weights (should sum to 1.0)
    weights:
      strategy: 0.3                   # Override: SCORE_WEIGHT_STRATEGY (Base strategy signal strength)
      ml_price: 0.3                   # Override: SCORE_WEIGHT_ML (ML price prediction confidence)
      regime: 0.2                     # Override: SCORE_WEIGHT_REGIME (Regime prediction weight)
      risk_reward: 0.2                # Override: SCORE_WEIGHT_RR (Risk/reward ratio quality)

  # =======================================================
  # GEMMA ML Pipeline Configuration
  # =======================================================
  gemma:
    # GEMMA'yı etkinleştirmek için 'true' yapın veya GEMMA_ENABLED ortam değişkenini kullanın.
    # Üretimde devreye alınana kadar 'false' kalması önerilir.
    enabled: true  # Override with: GEMMA_ENABLED
    
    # Model Yolları (.pt uzantılı TorchScript modelleri olmalıdır)
    # Updated to new production location (Plan 2)
    model_path: "data/models/final/gemma_price.pt" # Override with: GEMMA_MODEL_PATH
    
    # Özellik (Feature) Konfigürasyon Dosyaları
    features_path: "features/gemma/selected/gemma_price_selected_82.json" # Override with: GEMMA_FEATURES_PATH
    feature_count: 82                 # Override with: GEMMA_FEATURE_COUNT
    
    # Yardımcı Dosyalar
    # Updated to new production location (Plan 2) - co-located with models
    scaler_path: "data/models/final/gemma_price_scaler.joblib" # Override with: GEMMA_SCALER_PATH
    feature_mask_path: "data/cache/gemma/feature_selection_mask.npy" # Override with: GEMMA_FEATURE_MASK_PATH
    
    # Gölge Modu (Mevcut sistemle paralel çalışarak doğrulama yapar)
    shadow_mode: false                # Override with: GEMMA_SHADOW_MODE
    shadow_duration_hours: 48         # Override with: GEMMA_SHADOW_DURATION
    
    # Performans Ayarları
    cache_ttl: 30                     # Override with: GEMMA_CACHE_TTL
    max_inference_time: 0.5           # Override with: GEMMA_MAX_INFERENCE_TIME
    
    # Circuit Breaker (Hata toleransı)
    # Model tahmininde art arda hata alınması durumunda devreye girer.
    circuit_breaker:
      enabled: true                   # Override with: GEMMA_CIRCUIT_BREAKER_ENABLED
      failure_threshold: 5            # Override with: GEMMA_FAILURE_THRESHOLD
      recovery_timeout: 60            # Override with: GEMMA_RECOVERY_TIMEOUT
    
    # Training Configuration
    thresholds:
      deployment_accuracy: 0.72       # Override with: GEMMA_DEPLOYMENT_ACCURACY
      min_samples: 1000               # Override with: GEMMA_MIN_SAMPLES
    
    training:
      batch_size: 64                  # Override with: GEMMA_BATCH_SIZE
      epochs: 50                      # Override with: GEMMA_EPOCHS
      learning_rate: 0.0001330        # Override with: GEMMA_LEARNING_RATE
      early_stopping_patience: 10     # Override with: GEMMA_EARLY_STOPPING_PATIENCE
    
    architecture:
      input_size: 82                  # Override with: GEMMA_INPUT_SIZE
      hidden_size: 55                 # Override with: GEMMA_HIDDEN_SIZE
      num_layers: 3                   # Override with: GEMMA_NUM_LAYERS
      dropout: 0.3243                 # Override with: GEMMA_DROPOUT
      num_classes: 3                  # Override with: GEMMA_NUM_CLASSES
      
    feature_set: "gemma_v1"          # Override with: GEMMA_FEATURE_SET
    
  # =======================================================
  # AI-Gate Güven Eşikleri
  # =======================================================
  price:
    # Fiyat tahmini için minimum güven skoru
    min_confidence: 0.66              # Override with: ML_PRICE_MIN_CONFIDENCE
    
  regime:
    # Rejim tahmini için minimum güven skoru
    min_confidence: 0.60              # Override with: ML_REGIME_AIGATE_MIN_CONFIDENCE

# ==============================================================================
# MODEL BUNDLE MANAGEMENT
# ==============================================================================
models:
  # Model bundle management - dynamic feature adaptation
  active_bundle: "artifacts/gemma/final"  # Override with: ML_ACTIVE_BUNDLE
  fallback_bundle: "artifacts/legacy"  # Override with: ML_FALLBACK_BUNDLE
  
  # Deployment configuration
  deployment:
    validation_mode: "strict"         # Override with: MODEL_VALIDATION_MODE
    allow_missing_features: false     # Override with: MODEL_ALLOW_MISSING_FEATURES
    canary_percentage: 0              # Override with: MODEL_CANARY_PERCENTAGE
    
  # GEMMA specific overrides
  gemma:
    use_manifest: true                # Override with: MODEL_GEMMA_USE_MANIFEST
    shadow_mode: false                # Override with: MODEL_GEMMA_SHADOW_MODE
    prefer_quantized: false           # Override with: MODEL_GEMMA_PREFER_QUANTIZED (float-first by default)
    force_quantized: false            # Override with: MODEL_GEMMA_FORCE_QUANTIZED (set true to force int8 fallback)
