# ==============================================================================
# CHANGELOG (config.example.yaml cleanup)
# - Critical fixes: renamed `risk.max_position_size_pct` -> `risk.max_position_size`; raised `universe.prefetch.startup_candle_count`; fixed `_pct` units (e.g. `price_drop_15m_pct`); normalized `quality_threshold` to 0–1.
# - Removed dead/unused: `class_limits`, `notify`, top-level `regime`, `adaptive_strategies`, `quarantine`, `models.gemma.*`, legacy STR MTF `require_*`, legacy `execution.*` (replaced by `trading.*`).
# - Precedence notes: Azure App Configuration > ENV vars > YAML; trailing stop resolution is Signal overrides > execution_profile > global safety-only.
# ==============================================================================
# ==============================================================================
# BEARISH ALPHA BOT - Configuration File (v3.6 - Training Pipeline Integration)
# ==============================================================================
# This file serves as a template and documents the default values.
#
# CONFIGURATION PRIORITY ORDER (Highest to Lowest):
# NOTE: Actual loader precedence (src/config/live_trading_config.py) is Azure App Configuration > ENV vars > YAML.
# 1. GitHub Variables (Repository → Settings → Secrets and variables → Actions)
# 2. Environment Variables (local .env file)
# 3. This file (config.example.yaml)
# 4. Hardcoded defaults in the Python code
#
# To change a setting for production, create a "Repository Variable" in GitHub.
# The comment next to each setting shows the corresponding GitHub Variable name.
#
# ==============================================================================
# TRAINING vs LIVE TRADING CONFIGURATION
# ==============================================================================
# This config file is used by BOTH training and live trading:
#
# TRAINING (scripts/train_all_models.py):
#   - Uses centralized config loader (LiveTradingConfiguration)
#   - Supports environment variable overrides via GitHub Variables
#   - ml.reinforcement_learning.training_mode MUST be true
#   - ml.regime_prediction.model_params defines architecture
#
# LIVE TRADING (src/core/main.py):
#   - Uses same centralized config loader
#   - ml.reinforcement_learning.training_mode should be false
#   - Uses pre-trained models from data/models/
#
# CRITICAL: Model architecture parameters (LSTM hidden_size, etc.) must match
# between config and trained models. Changing these requires retraining!
# ==============================================================================

# ==============================================================================
# TRADING (LiveTradingEngine reads `trading.*`; legacy `execution.*` is ignored)
# ==============================================================================
trading:
  order_type: market             # Override with: ORDER_TYPE ; LiveTradingEngine reads `trading.order_type` (NOT `execution.order_type`)
  slippage_buffer: 0.001         # Used only for limit orders (maker offset); market orders ignore this unless signal overrides order type
  leverage: 10                   # Override with: TRADING_LEVERAGE ; Exchange-side leverage target (best-effort; unsupported exchanges ignore)

# ============================================================================== 
# SMART ENTRY POLICY (optional; injected centrally in LiveTradingEngine)
# ==============================================================================
# Purpose:
# - If volatility is low (ATR/entry < threshold), optionally force MARKET entry.
# - If volatility is high, inject a LIMIT entry (ATR-based) with:
#   - timeout seconds
#   - side-aware chase gate (max drift bps) at timeout
#   - market fallback if gate passes
# Notes:
# - This operates per-signal and can override the global trading.order_type.
# - Only applies when enabled=true AND the signal includes side+entry+atr.
smart_entry_policy:
  enabled: true
  force_override: false
  volatility_threshold_bps: 5.0
  # Canary-safe defaults:
  # - Avoid blind market when ATR is missing or volatility is low.
  # - Ban market fallback on EXTREME bucket.
  force_market_on_missing_atr: false
  force_market_on_low_vol: false
  extreme_market_ban: true
  fallback_timeout_seconds: 30
  params:
    LONG:
      atr_multiplier: 0.90
      timeout_seconds: 300
      gate_bps: 5.0
    SHORT:
      atr_multiplier: 0.85
      timeout_seconds: 240
      gate_bps: 12.0

# ==============================================================================
# ORDER MANAGER TIMEOUT FALLBACK CONTROLS (used by LiveTradingEngine -> execution_params)
# ==============================================================================
order_manager:
  market_fallback_on_timeout_enabled: true
  disable_market_fallback_on_extreme_bucket: true
  disable_market_fallback_on_fast_move: true
  fallback_require_position_delta_verification: true

# ==============================================================================
# RISK MANAGEMENT - ENHANCED POSITION SIZING
# ==============================================================================
risk:
  # Size Planner rollout flag (Option B)
  # RISK_SIZE_PLANNER_ENABLED=false → legacy Sprint 1 sizing (planner runs in shadow only)
  # RISK_SIZE_PLANNER_ENABLED=true  → Size Planner active as primary sizing governor
  size_planner_enabled: true          # Override with: RISK_SIZE_PLANNER_ENABLED (balanced preset = active)

  # Balanced preset (fractions, not percents)
  equity_usd: 1000                     # Override with: CAPITAL_USDT ; Virtual Starting Balance (VST)
  per_trade_risk_pct: 0.02            # Override with: PER_TRADE_RISK_PCT (2% of equity)
  daily_loss_limit_pct: 0.10          # Override with: DAILY_LOSS_LIMIT_PCT
  max_portfolio_risk: 0.25            # Override with: MAX_PORTFOLIO_RISK_PCT ; Portfolio heat cap (fraction of equity at risk)
  risk_usd_cap: null                  # Override with: RISK_USD_CAP ; Optional safety ceiling (e.g., 500). Leave null for unlimited.
  position_sizing_type: risk_percentage  # Default: risk_percentage (dynamic % risk sizing)
  
  # NEW: Dynamic position sizing parameters
  max_position_notional_usd: null     # Override with: MAX_POSITION_NOTIONAL_USD ; Override with: RISK_MAX_POSITION_NOTIONAL_USD ; Optional absolute notional ceiling
  max_position_size: 1.0              # Override with: MAX_POSITION_SIZE_PCT ; Leverage-aware: caps margin usage (fraction of equity). Set 1.0 to avoid conflicting with high notional multiples.
  max_notional_pct_per_trade: 10.0    # Override with: MAX_NOTIONAL_PCT_PER_TRADE ; Total notional cap as multiple of equity (e.g., 10.0 == 10x)
  position_size_policy: clip          # Override with: POSITION_SIZE_POLICY (clip|reject)
  max_drawdown: 0.20                  # Override with: MAX_DRAWDOWN ; Max portfolio drawdown (fraction)
  
  # Safety limits
  min_stop_pct: 0.001                 # Override with: MIN_STOP_PCT ; Override with: RISK_MIN_STOP_PCT
  min_stop_atr_floor:
    enabled: true                     # ATR tabanini min-stop hesaplamasina dahil et
    atr_mult: 0.80                    # min_stop_ratio >= atr_pct * atr_mult
    canary_symbols: []                # [] veya ["*"] => tum semboller; liste verilirse sadece canary sembollerde aktif
  
  # Daily trade limit (static cap)
  daily_max_trades: 20                # Override with: DAILY_MAX_TRADES

  # Optional: Dynamic daily trade limit extension (profit-based)
  # - Uses PortfolioManager equity delta as realized PnL proxy (UTC day)
  # - When enabled AND pnl >= min_pnl_usd, cap is increased (within optional caps)
  daily_trade_limit:
    profit_unlock:
      enabled: true
      pnl_source: daily               # daily|since_start
      min_pnl_usd: 3.0
      # Optional: require a minimum profit as a fraction of start-of-day equity (e.g. 0.01 == +1%)
      # min_pnl_pct: 0.01

      # Optional safety: if drawdown is elevated, do NOT unlock extra trades (re-tighten intraday)
      # max_drawdown_pct: 0.03         # 0.03 == 3% (also accepts 3 == 3%)
      # drawdown_source: daily         # daily|overall
      extra_trades: 4
      # Optional: scale extra trades with profits
      # pnl_step_usd: 50.0
      # extra_trades_per_step: 1
      # max_extra_trades: 8
      # max_trades_cap: 20
  
  # NEW: Dynamic Risk/Reward System
  rr_dynamic:
    enabled: true                     # Override with: RR_DYNAMIC_ENABLED

    # Model selector (default: v1 for backward compatibility)
    # - v1: ML/RL relaxation + regime tightening + PPO multiplier
    # - v2: v1 + volume_strength/momentum_strength contributions (same PPO application point)
    model_version: "v1"               # v1|v2
    
    # Base Configuration
    base_target_rr: 2.0              # Override with: RR_BASE_TARGET
    lower_bound_rr: 1.2              # Override with: RR_LOWER_BOUND
    upper_bound_rr: 3.0              # Override with: RR_UPPER_BOUND
    
    # Intelligence Weights (sum should be ~1.0)
    weights:
      ml_confidence: 0.35            # Override with: RR_WEIGHT_ML
      rl_agreement: 0.35             # Override with: RR_WEIGHT_RL
      regime_clarity: 0.2            # Override with: RR_WEIGHT_REGIME
      volume_strength: 0.05          # Override with: RR_WEIGHT_VOLUME
      momentum_strength: 0.05        # Override with: RR_WEIGHT_MOMENTUM
    
    # Fallback values when ML/RL data missing
    fallback:
      missing_ml_default: 0.5        # Override with: RR_FALLBACK_ML
      missing_rl_default: 0.5        # Override with: RR_FALLBACK_RL
      missing_regime_default: 0.3    # Override with: RR_FALLBACK_REGIME
    
    # Regime-specific multipliers
    regime_multipliers:
      bullish: 0.9                   # Override with: RR_MULT_BULLISH
      bearish: 0.9                   # Override with: RR_MULT_BEARISH
      neutral: 1.0                   # Override with: RR_MULT_NEUTRAL
      volatile: 1.2                  # Override with: RR_MULT_VOLATILE

    # Strategy-specific overrides (optional)
    strategy_overrides:
      scalper:
        base_target_rr: 1.5              # Override with: RR_SCALPER_BASE_TARGET
        lower_bound_rr: 1.0              # Override with: RR_SCALPER_LOWER_BOUND
        weights:
          ml_confidence: 0.25            # Override with: RR_SCALPER_WEIGHT_ML
          regime_clarity: 0.10           # Override with: RR_SCALPER_WEIGHT_REGIME
      mean_reversion:
        upper_bound_rr: 2.2              # Override with: RR_MEANREV_UPPER_BOUND
        regime_multipliers:
          neutral: 0.9                   # Override with: RR_MEANREV_MULT_NEUTRAL
          volatile: 1.3                  # Override with: RR_MEANREV_MULT_VOLATILE
      breakout_hunter:
        base_target_rr: 2.2              # Override with: RR_BREAKOUT_BASE_TARGET
        lower_bound_rr: 1.4              # Override with: RR_BREAKOUT_LOWER_BOUND
        weights:
          ml_confidence: 0.45            # Override with: RR_BREAKOUT_WEIGHT_ML
          volume_strength: 0.15          # Override with: RR_BREAKOUT_WEIGHT_VOLUME

  # NEW: Strategy-based risk profiles (polymorphic risk management)
  # - Provides a unified place to override risk knobs per strategy.
  # - For R/R, `strategy_profiles.<name>.rr_dynamic` overrides global `rr_dynamic` settings.
  # - Backward compatible: `rr_dynamic.strategy_overrides` still works (and is merged first).
  strategy_profiles:
    # Mean-reversion strategies (e.g., Order Block bounces) should cap required R/R to realistic ranges.
    # NOTE: `upper_bound_rr` is a true hard cap (applied after PPO multipliers) as of 2026-01-29.
    adaptive_ob:
      rr_dynamic:
        base_target_rr: 1.5
        lower_bound_rr: 1.2
        upper_bound_rr: 2.0
    mean_reversion:
      per_trade_risk_pct: 0.02  # Strategy override: per-trade risk fraction (2%); falls back to global `risk.per_trade_risk_pct` when omitted
      rr_dynamic:
        base_target_rr: 1.25  # Override with: RISK__STRATEGY_PROFILES__MEAN_REVERSION__RR_DYNAMIC__BASE_TARGET_RR
        lower_bound_rr: 1.15  # Override with: RISK__STRATEGY_PROFILES__MEAN_REVERSION__RR_DYNAMIC__LOWER_BOUND_RR
        upper_bound_rr: 3.0

  # Volume-aware risk scaling
  volume_bucket_risk_matrix:        # Override with: RISK_VOLUME_BUCKET_MATRIX
    LOW:
      position_size_multiplier: 0.5
      stop_loss_multiplier: 1.3
      take_profit_multiplier: 0.9
    NORMAL:
      position_size_multiplier: 1.0
      stop_loss_multiplier: 1.0
      take_profit_multiplier: 1.0
    HIGH:
      position_size_multiplier: 1.2
      stop_loss_multiplier: 0.9
      take_profit_multiplier: 1.1
    EXTREME:
      position_size_multiplier: 1.5
      stop_loss_multiplier: 0.8
      take_profit_multiplier: 1.3

  # NEW: Signal execution queue controls
  queue:
    ttl_seconds: 60                 # Override with: SIGNAL_QUEUE_TTL_SECONDS (drop stale signals)
    max_queue_depth: 50             # Override with: SIGNAL_QUEUE_MAX_DEPTH
    batch_dequeue: 3                # Override with: SIGNAL_QUEUE_BATCH_DEQUEUE (signals pulled per cycle)
    max_pending_per_symbol: 1       # Override with: SIGNAL_QUEUE_MAX_PENDING_PER_SYMBOL
    max_pending_scale_in_per_symbol: 2 # Override with: SIGNAL_QUEUE_MAX_PENDING_SCALE_IN_PER_SYMBOL (only for scale_in when pyramiding enabled)
    priority_weights:
      explicit_priority: 0.4        # Override with: SIGNAL_QUEUE_WEIGHT_PRIORITY
      risk_reward: 0.3              # Override with: SIGNAL_QUEUE_WEIGHT_RR
      ml_confidence: 0.2            # Override with: SIGNAL_QUEUE_WEIGHT_ML
      urgency: 0.1                  # Override with: SIGNAL_QUEUE_WEIGHT_URGENCY
      regime_alignment: 0.05        # Override with: SIGNAL_QUEUE_WEIGHT_REGIME_ALIGNMENT
      strategy_urgency: 0.05        # Override with: SIGNAL_QUEUE_WEIGHT_STRATEGY_URGENCY

  # NEW: Concurrent risk guardrails
  concurrent_limits:
    max_open_positions: 3           # Override with: MAX_OPEN_POSITIONS
    max_positions_per_symbol: 1     # Override with: MAX_POSITIONS_PER_SYMBOL
    max_total_risk_pct: 0.15        # Override with: MAX_TOTAL_RISK_PCT (fraction of equity at risk)
    correlation_bucket_threshold: 0.8 # Override with: CORRELATION_BUCKET_THRESHOLD
    dynamic_scaling:
      enabled: true                 # Override with: DYNAMIC_SCALING_ENABLED
      quality_threshold: 0.80       # Override with: DYNAMIC_SCALING_QUALITY_THRESHOLD ; Normalized: use 0–1 only (avoid 0–100 ambiguity)
      min_unrealized_pnl_pct: 0.005 # Override with: DYNAMIC_SCALING_MIN_PNL_PCT (0.5% avg PnL requirement)
      max_additional_positions: 2   # Override with: DYNAMIC_SCALING_MAX_EXTRA (extra slots per symbol)

  # NEW: Volatility-aware sizing parameters
  volatility_sizing:
    enabled: true                   # Override with: VOL_SIZING_ENABLED
    atr_window: 14                  # Override with: VOL_SIZING_ATR_WINDOW
    atr_floor_pct: 0.005            # Override with: VOL_SIZING_ATR_FLOOR (0.5%)
    atr_ceiling_pct: 0.02           # Override with: VOL_SIZING_ATR_CEILING (2%)
    low_vol_multiplier: 1.2         # Override with: VOL_SIZING_LOW_MULT
    baseline_multiplier: 1.0        # Override with: VOL_SIZING_BASE_MULT
    high_vol_multiplier: 0.6        # Override with: VOL_SIZING_HIGH_MULT
    min_position_size_pct: 0.01     # Override with: VOL_SIZING_MIN_POSITION_PCT

# ==============================================================================
# WEBSOCKET & DATA
# ==============================================================================
websocket:
  enabled: true                       # Override with: WEBSOCKET_ENABLED
  priority_enabled: true              # Override with: WEBSOCKET_PRIORITY_ENABLED
  max_data_age: 60                    # Override with: WEBSOCKET_MAX_DATA_AGE
  fallback_threshold: 3               # Override with: WEBSOCKET_FALLBACK_THRESHOLD
  buffer_size: 300                    # Override with: WEBSOCKET_BUFFER_SIZE
  ticker_stale_ms: 5000               # Override with: WEBSOCKET_TICKER_STALE_MS
  forming_update_stale_ms: 15000       # (Hybrid) Max age of last forming tick before forcing closed-only
  hybrid_pivot_grace_enabled: true     # (Hybrid) Allow 1-bucket-behind forming briefly at TF boundary (closed-only downgrade)
  hybrid_pivot_grace_ms: 90000         # (Hybrid) Grace window after expected_open before treating 1-bucket-behind as stale
  # pivot_grace_accept_prev_bucket:
  #   false (default): conservative/deterministic. If forming appears to belong to the previous bucket (bucket_delta_ms==interval_ms)
  #   and we're within the grace window, we downgrade to closed-only with fallback_reason=pivot_grace_prev_bucket.
  #   true (opt-in): more responsive but less deterministic. Within grace, accept prev-bucket forming updates only if fresh
  #   (forming_update_age_ms <= forming_update_stale_ms). This can revise the most recent candle briefly.
  pivot_grace_accept_prev_bucket: false
  # (Hybrid) Optional: enable prev-bucket accept ONLY when fast-gate is ARMED (per-call override).
  # This is a safer alternative to flipping pivot_grace_accept_prev_bucket globally.
  pivot_grace_accept_prev_bucket_on_shock: true
  # Freshness window (ms) for the ARMED-only pivot grace override.
  pivot_grace_override_forming_update_stale_ms: 3000
  # hybrid_pivot_grace_ms_by_tf:       # (Hybrid) Optional per-timeframe override (values are milliseconds)
  #   30m: 90000
  #   15m: 60000
  hybrid_state_machine_enabled: false  # (Hybrid) Enable cooldown after repeated hybrid failures
  hybrid_failures_before_cooldown: 3   # (Hybrid) Failures before cooldown activates
  hybrid_cooldown_ms: 60000            # (Hybrid) Cooldown duration forcing closed-only
  hybrid_fallback_metrics_interval_sec: 300  # (Hybrid) Periodic per-symbol/timeframe counts by fallback_reason

  # (Hybrid) Optional cleanup guardrail for long-running bots with dynamic universes.
  # NOTE: YAML indentation is STRICT (spaces only). These keys must be 2-space siblings under `websocket:`.
  # Correct block:
  # websocket:
  #   hybrid_state_cleanup_enabled: false
  #   hybrid_state_cleanup_ttl_s: 86400
  #   hybrid_state_cleanup_interval_s: 600
  hybrid_state_cleanup_enabled: false
  hybrid_state_cleanup_ttl_s: 86400          # e.g. 21600 (6h) or 86400 (24h)
  hybrid_state_cleanup_interval_s: 600       # cleanup cadence
  trigger_diag_interval_sec: 60       # Override with: WEBSOCKET_TRIGGER_DIAG_INTERVAL_SEC
  max_streams_per_exchange:
    bingx: 10                         # Override with: WS_MAX_STREAMS_BINGX
    binance: 20                       # Override with: WS_MAX_STREAMS_BINANCE
    kucoinfutures: 15                 # Override with: WS_MAX_STREAMS_KUCOIN
    default: 10                       # Override with: WS_MAX_STREAMS_DEFAULT
  stream_timeframes: "1m,5m,15m,30m,1h,4h" # Override with: WS_STREAM_TIMEFRAMES
  reconnect_delay: 5                  # Override with: WS_RECONNECT_DELAY
  max_reconnect_attempts: 3           # Override with: WS_MAX_RECONNECT_ATTEMPTS

# Preferred trigger price source for live price resolution
trigger_price:
  source: mid                         # Override with: TRIGGER_PRICE_SOURCE (mark|mid|last|bid|ask|opposite_side)
  diag_interval_sec: 60               # Override with: TRIGGER_PRICE_DIAG_INTERVAL_SEC

# ==============================================================================
# TRADING UNIVERSE
# ==============================================================================
universe:
  prefetch:
    enabled: true                     # Override with: UNIVERSE_PREFETCH_ENABLED
    startup_candle_count: 3000        # Override with: UNIVERSE_STARTUP_CANDLE_COUNT ; Used by MarketDataPipeline priming; must exceed max lookback (VWAP=1440)
  fixed_symbols: "BTC/USDT:USDT"      # Override with: TRADING_SYMBOLS
  auto_select: false                  # Override with: UNIVERSE_AUTO_SELECT

# ==============================================================================
# TECHNICAL INDICATORS
# ==============================================================================
indicators:
  rsi_period: 14                      # Override with: INDICATOR_RSI_PERIOD
  atr_period: 14                      # Override with: INDICATOR_ATR_PERIOD
  ema_fast: 21                        # Override with: INDICATOR_EMA_FAST
  ema_mid: 50                         # Override with: INDICATOR_EMA_MID
  ema_slow: 200                       # Override with: INDICATOR_EMA_SLOW
  vwap_lookback: 1440                 # Override with: INDICATOR_VWAP_LOOKBACK (bars in that timeframe)
  vwap_band_multiplier: 2.0           # Override with: INDICATOR_VWAP_BAND_MULTIPLIER
  adx_period: 14                      # Override with: INDICATOR_ADX_PERIOD
  advanced_volatility:
    enabled: true
    allow_without_timeframe: false
    # NOTE: If `enabled=true` but `enabled_timeframes` is empty, the hook will NOT run.
    # Local override tip: keep this disabled in the tracked example config; enable it only in an untracked
    # `config/config.yaml` (or via AppConfig/ENV overrides) when you explicitly want RS/GK/YZ telemetry.
    enabled_timeframes:
      - "1m"
    window: 14
    ddof: 1

# ============================================================================== 
# VALIDATOR
# ============================================================================== 
validator:
  # If true, VolumeAnalyzer readiness failures will mark the symbol as FAIL
  # during indicator validation (and can abort pre-flight checks). If false,
  # VolumeAnalyzer readiness issues will log a warning but not fail the symbol.
  volume_analyzer_required: false    # Override with: VALIDATOR_VOLUME_ANALYZER_REQUIRED

# ============================================================================== 
# VOLUME ANALYZER
# ==============================================================================
volume_analyzer:
  enabled: true                      # Override with: VOLUME_ANALYZER_ENABLED
  baseline_short_tf: "5m"            # Override with: VOLUME_ANALYZER_BASELINE_SHORT_TF
  baseline_medium_tf: "30m"          # Override with: VOLUME_ANALYZER_BASELINE_MEDIUM_TF
  short_lookback: 576                # Override with: VOLUME_ANALYZER_SHORT_LOOKBACK
  medium_lookback: 1440              # Override with: VOLUME_ANALYZER_MEDIUM_LOOKBACK
  window_bars: 3                     # Override with: VOLUME_ANALYZER_WINDOW_BARS
  weight_short: 0.6
  weight_medium: 0.4
  sigmoid_alpha: 1.2                 # Override with: VOLUME_ANALYZER_SIGMOID_ALPHA
  min_ratio: 0.1                     # Override with: VOLUME_ANALYZER_MIN_RATIO
  max_ratio: 10.0                    # Override with: VOLUME_ANALYZER_MAX_RATIO
  heartbeat:
    # Periodic telemetry to make `volume_strength` / `volume_bucket` visible even when no signals fire.
    # Emits one line per symbol per interval:
    #   "💓📊 volume_context_heartbeat { ...json... }"
    enabled: true                    # Override with: VOLUME_HEARTBEAT_ENABLED
    interval_sec: 300                # Override with: VOLUME_HEARTBEAT_INTERVAL_SEC
    trade_tf: "5m"                   # Override with: VOLUME_HEARTBEAT_TRADE_TF
    min_strength_delta: 0.05         # Override with: VOLUME_HEARTBEAT_MIN_STRENGTH_DELTA
    include_debug_fields: false      # Override with: VOLUME_HEARTBEAT_DEBUG
    # Optional: if set, restrict heartbeat to these symbols; otherwise falls back to universe.fixed_symbols / TRADING_SYMBOLS.
    symbols: []
  # (Shock) Optional: add prorated forming volume to current window numerator when shock_state=ARMED.
  include_forming_numerator_when_armed: true
  forming_update_stale_ms: 3000
  forming_volume_cap_ratio: 0.6
  buckets:                           # Override with: VOLUME_ANALYZER_BUCKETS ; Intentionally stringified pairs (VolumeAnalyzer normalizes via `ast.literal_eval`)
    - [0.0, "LOW"]
    - [0.3, "NORMAL"]
    - [0.6, "HIGH"]
    - [0.85, "EXTREME"]

# ==============================================================================
# FAST PRICE WATCH (INCUBATOR)
# ==============================================================================
fast_watch:
  enabled: true
  interval_ms: 3000
  max_items_per_tick: 50
  time_budget_ms: 75
  max_checks_default: 9
  ttl_ms_default: 30000
  check_sample_rate: 20
  max_rearms: 3
  rearm_backoff_mult: 1.5

# ==============================================================================
# SIGNAL GENERATION & STRATEGIES
# ==============================================================================
signals:
  # Extreme Condition Bypass - Prevents RL Agent from blocking obvious signals
  # when RSI reaches extreme oversold/overbought levels
  bypass:
    enabled: true                     # Override with: SIGNAL_BYPASS_ENABLED
    rsi_oversold_threshold: 12        # Override with: SIGNAL_BYPASS_RSI_OVERSOLD (BUY signals when RSI < this)
    rsi_overbought_threshold: 88      # Override with: SIGNAL_BYPASS_RSI_OVERBOUGHT (SELL signals when RSI > this)
    force_swap_enabled: true          # Override with: SIGNAL_FORCE_SWAP_ENABLED (swap weakest position when slots are full)

  # Stop-and-Reverse (auto reversal)
  # If enabled and an opposite signal arrives while a position is open on the same symbol,
  # the signal can be tagged as intent=reverse so the engine closes then reopens atomically.
  allow_auto_reversal: true          # Override with: SIGNAL_ALLOW_AUTO_REVERSAL

  # Signal integrity guard (staleness + price deviation + optional ATR/impulse checks)
  integrity_guard:
    enabled: true
    max_staleness_ms: 10000
    max_deviation_pct: 0.001         # 0.1% hard floor (10 bps)
    atr_guard_enabled: true
    atr_guard_mult: 0.5              # max_gap_bps >= 0.5 * atr_bps (+ spread buffer)
    spread_buffer_bps: 2.0
    min_gap_bps_fallback: 5.0        # fallback when ATR unavailable
    impulse_guard_enabled: true      # uses strategy-provided impulse metadata (if present)

  # Optional: volume gating behavior tweaks
  volume_policy:
    # If true and signal.meta.shock_state == ARMED, LOW-bucket rejects are short-incubated instead.
    defer_on_shock_low_bucket: true
  
  duplicate_prevention:
    min_price_change_pct: 0.0005      # Override with: DUPLICATE_PREVENTION_THRESHOLD
    cooldown_seconds: 20              # Override with: DUPLICATE_PREVENTION_COOLDOWN
    price_delta_bypass_threshold: 0.0015 # Override with: PRICE_DELTA_BYPASS_THRESHOLD
    price_delta_bypass_enabled: false # Override with: PRICE_DELTA_BYPASS_ENABLED
    rsi_session_oversold_threshold: 30  # RSI <= this starts/updates low-anchor session used for duplicate price-delta reference
    # Optional scale-in specific thresholds (defaults mirror entry for safety)
    scale_in_min_price_change_pct: 0.0005
    scale_in_cooldown_seconds: 20
    ml_duplicate_detection_enabled: true # Override with: DUPLICATE_ML_DETECTION_ENABLED
    dynamic_cooldown:
      enabled: true                   # Override with: DUPLICATE_DYNAMIC_COOLDOWN_ENABLED
      high_delta_threshold: 15        # Override with: DUPLICATE_DYNAMIC_HIGH_DELTA (RSI delta > value → fast cooldown)
      medium_delta_threshold: 8       # Override with: DUPLICATE_DYNAMIC_MEDIUM_DELTA
      fast_cooldown_seconds: 15       # Override with: DUPLICATE_DYNAMIC_FAST_SECONDS
      medium_cooldown_seconds: 45     # Override with: DUPLICATE_DYNAMIC_MEDIUM_SECONDS
      slow_cooldown_seconds: 120      # Override with: DUPLICATE_DYNAMIC_SLOW_SECONDS
  oversold_bounce:
    enable: true                      # Override with: STRATEGY_OB_ENABLED
    ignore_regime: false              # Override with: STRATEGY_OB_IGNORE_REGIME
    min_rr_ratio: 1.5                 # Override with: STRATEGY_OB_MIN_RR
    rsi_max: 45                       # Override with: STRATEGY_OB_RSI_MAX
    adaptive_rsi_base: 32             # Override with: RSI_BASE_OB
    adaptive_rsi_range: 8             # Override with: RSI_RANGE_OB
    adaptive_mode: "dynamic"           # Override with: STRATEGY_OB_ADAPTIVE_MODE
    volatility_sensitivity: "medium"   # Override with: STRATEGY_OB_VOL_SENSITIVITY
    tp_atr_mult: 2.5                  # Override with: STRATEGY_OB_TP_ATR_MULT
    sl_atr_mult: 1.2                  # Override with: STRATEGY_OB_SL_ATR_MULT
    min_tp_pct: 0.008                 # Override with: STRATEGY_OB_MIN_TP_PCT
    max_sl_pct: 0.015                 # Override with: STRATEGY_OB_MAX_SL_PCT

    # Optional: TP candidate inside nearest resistance band (lookahead-safe).
    # SL stays unchanged; Risk layer still vetoes if RR_actual < RR_required (PPO included).
    tp_band:
      enabled: true
      mode: "apply"                   # shadow | apply
      timeframes:
        - "1m"
        - "5m"
        - "30m"
      method: "kmeans"                # kmeans | smc
      quantile: "auto"                # 0..1 or "auto"
      min_distance_atr_mult: 0.8
      min_width_atr_mult: 0.35

    # Smart Recovery TP (Structural Targeting) - for post-crash consolidations
    # - Activates during shock (drop) and/or resistance-band compression.
    # - Builds a target pool (fibo/pivot/ATR/band) then filters by reachability + strategy min RR.
    # - If no candidates pass, the trade is skipped (no "force TP upward").
    smart_recovery:
      enabled: true

      activation:
        drop_magnitude_pct: 0.012       # %1.2+ düşüşlerde "Shock" modu (fraction: 0.012 == 1.2%)
        band_compression_ratio: 0.85   # Band/ATR < 0.85 ise "Sıkışma" modu

      targets:
        lookback_bars: 36              # 3 Saatlik pencere (5m x 36)
        min_leg_atr_mult: 2.0          # Gürültü engelleme: Bacak boyu en az 2 ATR olmalı
        fibo_levels: [0.236, 0.382]
        atr_extensions: [1.8]          # Liste yerine tek ve güvenli bir ATR hedefi

      filters:
        max_reachability_atr: 3.0      # 3 ATR'den uzak hedefi ele
        barrier_penalty: 1.0           # Pivot direnci varsa skordan 1 puan düş (Hafif ceza)
    trend_confirmation_ema_gap_pct_min: 0.0020 # EMA gap minimum for trend RSI penalty (0.0020 = 0.20%)
    trend_confirmation_ema_gap_pct_on: 0.0020  # Optional hysteresis on-threshold (0.20%)
    trend_confirmation_ema_gap_pct_off: 0.0015 # Optional hysteresis off-threshold (0.15%)
    # Extreme bypass (panic mode) - skips trend RSI penalty + allows ML veto bypass
    extreme_bypass:
      enabled: true                  # Override with: STRATEGY_OB_EXTREME_BYPASS_ENABLED
      triggers:
        # Percent drop over last 15m bar (CODE EXPECTS PERCENT UNITS: 0.8 == 0.8%)
        price_drop_15m_pct: 0.8       # Override with: STRATEGY_OB_EXTREME_BYPASS_PRICE_DROP_15M_PCT
        # RSI threshold on 15m data (more restrictive == fewer bypass trades)
        rsi_15m_below: 15.0           # Override with: STRATEGY_OB_EXTREME_BYPASS_RSI_15M_BELOW
        # Volatility proxy (ATR/price), e.g. 0.006 == 0.6%
        min_atr_pct: 0.006            # Override with: STRATEGY_OB_EXTREME_BYPASS_MIN_ATR_PCT
    dynamic_rsi_gate:
      enabled: true                 # Default-off kill switch

      exchange: "bingx"              # Collector exchange key (lower-case)
      fast_timeframes:               # In priority order (block list avoids minimal-YAML inline-list stringification)
        - "1m"
        - "5m"
      candle_policy: "closed_only"   # Must remain closed_only in Phase 0
      min_bars_fast: 50              # Guardrail
      rsi_fast_period: 14            # Stored for future phases

      shock:
        lookback_bars: 5
        price_move_pct: 0.006        # Absolute move over lookback (closed-only)
        arm_score_threshold: 0.60    # Score threshold to enter ARMED (0..1)
      # Optional: use forming close for shock-score computation when fresh (0 disables).
      max_forming_update_age_ms: 3000

      armed:
        ttl_s: 600
        max_ttl_s: 900
        rearm_policy: "extend"       # extend | reset | ignore
        cooldown_s: 180

      compute_fast_only_if_rsi_slow_within: 6.0   # Perf gate (optional)
      on_missing_fast_data: "fallback_to_slow"    # fallback_to_slow | disable (Phase 0 informational only)

      logging:
        mode: "state_changes"        # off | state_changes | decisions (Phase 0 supports off/state_changes)
        throttle_s: 60               # FAST_DATA_STATUS throttle window
  short_the_rip:
    enable: true                      # Override with: STRATEGY_STR_ENABLED
    ignore_regime: false              # Override with: STRATEGY_STR_IGNORE_REGIME
    min_rr_ratio: 1.5                 # Override with: STRATEGY_STR_MIN_RR
    rsi_min: 55                       # Override with: STRATEGY_STR_RSI_MIN
    adaptive_rsi_base: 68             # Override with: RSI_BASE_STR
    adaptive_rsi_range: 8             # Override with: RSI_RANGE_STR
    adaptive_mode: "dynamic"           # Override with: STRATEGY_STR_ADAPTIVE_MODE
    volatility_sensitivity: "medium"   # Override with: STRATEGY_STR_VOL_SENSITIVITY
    tp_atr_mult: 3.0                  # Override with: STRATEGY_STR_TP_ATR_MULT
    sl_atr_mult: 1.5                  # Override with: STRATEGY_STR_SL_ATR_MULT
    min_tp_pct: 0.010                 # Override with: STRATEGY_STR_MIN_TP_PCT
    max_sl_pct: 0.020                 # Override with: STRATEGY_STR_MAX_SL_PCT
    # Optional MTF confirmation (15m + 1h)
    mtf_confirmation:
      # Legacy toggle (deprecated; use 15m_mode/1h_mode)
      enabled: true

      # Explicit per-timeframe modes: off | soft | hard
      15m_mode: "soft"
      1h_mode: "hard"

      # Missing-data policy (renamed; replaces require_*)
      missing_15m_is_fatal: false
      missing_1h_is_fatal: true

      # Legacy missing-data flags (deprecated; use missing_*_is_fatal)
      require_15m: false
      require_1h: true

      rsi_15m_min: 62.0
      min_15m_close_over_ema50_pct: 0.0015

      require_1h_bearish_ema_stack: true
      rsi_1h_max: 60.0

      on_missing_15m: "skip"
      on_missing_1h: "reject"
      # Optional extreme bypass for MTF hard veto (panic mode).
      # If enabled and an MTF hard veto occurs due to *threshold* (not missing-data),
      # Adaptive STR can continue by marking the MTF meta as bypassed.
      extreme_bypass:
        enabled: true                 # Override with: STRATEGY_STR_MTF_EXTREME_BYPASS_ENABLED
        # If true, price/ATR-based bypass triggers require RSI extreme for the side.
        # This prevents mild moves from bypassing higher-timeframe vetoes.
        require_rsi_extreme: true
        # Lookback bars for move calculation (uses the strategy eval timeframe, e.g., 30m).
        # 1 = previous bar (default behavior).
        move_lookback_bars: 1
        # Directional move in signal direction (sell -> up move, buy -> down move)
        min_directional_move_pct: 0.010  # Override with: STRATEGY_STR_MTF_EXTREME_BYPASS_MIN_DIR_MOVE_PCT
        # Absolute move magnitude (either direction)
        min_abs_move_pct: 0.008        # Override with: STRATEGY_STR_MTF_EXTREME_BYPASS_MIN_ABS_MOVE_PCT
        # Volatility proxy (ATR/price)
        min_atr_pct: 0.006             # Override with: STRATEGY_STR_MTF_EXTREME_BYPASS_MIN_ATR_PCT
        # Move magnitude in ATR units (abs_move_pct / atr_pct). Example: 1.25 means move >= 1.25 * ATR.
        min_move_atr_mult: 1.25
        # RSI triggers (optional; set to 0 to disable)
        rsi_oversold_threshold: 25.0    # Override with: STRATEGY_STR_MTF_EXTREME_BYPASS_RSI_OVERSOLD
        rsi_overbought_threshold: 75.0  # Override with: STRATEGY_STR_MTF_EXTREME_BYPASS_RSI_OVERBOUGHT
      # Optional min bars guard (defaults used if omitted)
      # defaults (if omitted): rsi=20, ema21=30, ema50=100, ema200=250
      # guard only runs when indicator columns missing + fallback planned
      # insufficient bars -> on_missing_* policy
      min_bars_rsi: 20
      min_bars_ema21: 30
      min_bars_ema50: 100
      min_bars_ema200: 250
    volatility_stop:
      enabled: true                   # Override with: STRATEGY_STR_VOL_STOP_ENABLED
      min_sl_pct: 0.0025              # Override with: STRATEGY_STR_VOL_STOP_MIN_SL
      max_sl_pct: 0.02                # Override with: STRATEGY_STR_VOL_STOP_MAX_SL
      overrides:
        low:
          atr_scale: 0.75             # Override with: STRATEGY_STR_VOL_LOW_ATR_SCALE
          min_sl_pct: 0.0015          # Override with: STRATEGY_STR_VOL_LOW_MIN_SL
          max_sl_pct: 0.015           # Override with: STRATEGY_STR_VOL_LOW_MAX_SL
        normal:
          atr_scale: 1.0              # Override with: STRATEGY_STR_VOL_NORMAL_ATR_SCALE
        high:
          atr_scale: 1.15             # Override with: STRATEGY_STR_VOL_HIGH_ATR_SCALE
          min_sl_pct: 0.003           # Override with: STRATEGY_STR_VOL_HIGH_MIN_SL
          max_sl_pct: 0.025           # Override with: STRATEGY_STR_VOL_HIGH_MAX_SL
    symbols:
      "BTC/USDT:USDT":
        rsi_threshold: 55             # Override with: RSI_THRESHOLD_BTC

    # Smart Guard: RSI rollover check for risky shorts
    # When trading off forming-candle data (trigger_price_source=form­ing_close) or after an MTF soft-fail,
    # require RSI to be rolling over (falling) to avoid "top-tick" shorts.
    rsi_rollover_guard:
      enabled: true
      eps: 0.2
      require_risky_context: true

# ==============================================================================
# SAFETY OVERRIDE (Adaptive/Aggressive Mode)
# ==============================================================================
# Coordinator-level safety layer for strategies that dynamically *lower* thresholds.
# Activates only when a strategy reports: current_threshold < base_threshold.
safety_override:
  enabled: true
  apply_to_strategies:
    - "adaptive_str"
  apply_to_sides:
    - "sell"
    - "short"
  aggressive_threshold_delta_min: 0.1
  min_passes: 2
  fail_closed_on_insufficient_context: true
  gates:
    trend:
      enabled: true
      rsi_floor: 65.0
    volume:
      enabled: true
      low_bucket: "LOW"
      require_bearish_if_low: true
      volume_confirm_mult: 1.0
    resistance:
      enabled: true
      max_distance_bps: 25.0

# ==============================================================================
# FAST TREND VALIDATION (TrendGuard Veto)
# ==============================================================================
trend_guard:
  enabled: true
  default_timeframe: "5m"
  lookback_bars: 500
  min_history_bars: 200
  update_every_bars: 25
  update_every_seconds: 300
  bb_period: 20
  bb_std: 2.0
  bbw_squeeze_quantile: 0.20
  bbw_expand_quantile: 0.80
  bbw_expand_lookback: 20
  squeeze_lookback: 20
  slope_ema_period: 50
  slope_lookback: 5
  slope_quantile: 0.85
  slope_use_atr: true
  slope_atr_period: 14
  min_body_ratio: 0.0
  apply_to_strategies:               # Block list avoids minimal-YAML inline-list stringification (TrendGuard expects a real list)
    - "mean_reversion"
    - "adaptive_str"
  apply_to_signal_types: []
  allow_missing_signal_type: true
  # Optional: TrendGuard veto diagnostics (enabled for analysis; throttle to control noise)
  veto_diag_enabled: true
  veto_diag_log_level: "WARNING"      # WARNING|INFO|DEBUG
  veto_diag_throttle_seconds: 60
  veto_diag_key_fields: ["symbol", "timeframe", "side", "reason", "strategy"]

# ==============================================================================
# EXECUTION PROFILES (Per-strategy execution overrides)
# ==============================================================================
# Resolution precedence:
# 1) Signal overrides (signal.execution / trailing_stop_config / dca_config)
# 2) Strategy execution_profile (strategies.<name>.execution_profile)
# 3) Global fallbacks (position_management.trailing_stop, dca.strategy)
execution_profiles:
  # Tight scalping defaults (matches global trailing_stop + dca defaults below)
  scalp_tight:
    trailing_stop:
      enabled: true
      activation_threshold_pct: 0.0030  # %0.30 kârda takibe başla (Değişmedi)
      # DEĞİŞİKLİK 1: Başlangıç alanı GENİŞLETİLDİ (%0.20 -> %0.35)
      # Amaç: İlk geri çekilmelerde (silkelemelerde) hayatta kalmak.
      delta_pct: 0.0035
      dynamic_steps:
        # Adım 1: Kâr %0.75'e ulaşırsa, mesafeyi "Normal"e (%0.25) çek.
        # Mantık: "Tamam trend oturdu, artık o kadar boşluk bırakmaya gerek yok."
        - activation_pnl: 0.0075
          new_delta_pct: 0.0025
        # Adım 2: Kâr %1.50'ye ulaşırsa (Büyük hareket), mesafeyi "Çok Sıkı"ya (%0.10) çek.
        # Mantık: "Büyük balığı yakaladık, artık geri dönüşe tahammül yok. Kilitle."
        - activation_pnl: 0.0150
          new_delta_pct: 0.0010
    dca:
      enabled: true
      max_layers: 3
      step_pct: 0.004                  # Kept < min(max_sl_pct)=0.015 so at least 1 DCA layer can trigger before SL

  # Loose trend-following defaults (example; used by future TrendPullback)
  trend_loose:
    trailing_stop:
      enabled: true
      delta_pct: 0.01                 # 1.0%
      activation_threshold_pct: 0.01   # 1.0%
    dca:
      enabled: false

  # Hybrid model: Sniper Mode (MR) -> no DCA/pyramiding, trailing enabled.
  sniper_mode:
    trailing_stop:
      enabled: true
      activation_threshold_pct: 0.0030
      delta_pct: 0.0035
      dynamic_steps:
        - activation_pnl: 0.0030
          new_delta_pct: 0.0025
        - activation_pnl: 0.0045
          new_delta_pct: 0.0020
    dca:
      enabled: false
    pyramiding:
      enabled: false

  # Hybrid model: Standard Mode (Adaptive) -> DCA + pyramiding enabled.
  standard_mode:
    trailing_stop:
      enabled: true
      trigger_source: "opposite_side"  # Use bid for long exits, ask for short exits (reduces slippage mismatch)
      activation_threshold_pct: 0.0030
      delta_pct: 0.0035
      dynamic_steps:
        - activation_pnl: 0.0075
          new_delta_pct: 0.0025
        - activation_pnl: 0.0150
          new_delta_pct: 0.0010
      breakeven_lock:
        enabled: true
        activation_pct: 0.0025
        buffer_bps: 2.0
    dca:
      enabled: true
      max_layers: 3
      step_pct: 0.004
    pyramiding:
      enabled: true

# ==============================================================================
# STRATEGY ROUTING (Regime-aware)
# ==============================================================================
strategies:
  regime_routing:
    bullish:
      preferred_strategies:           # Override with: REGIME_BULLISH_STRATEGIES ; Block list avoids minimal-YAML inline-list stringification
        - "trend_follower"
        - "breakout_hunter"
      preferred_priority: 0.8         # Override with: REGIME_BULLISH_PRIORITY
      fallback_priority: 0.4          # Override with: REGIME_BULLISH_FALLBACK
      queue_priority_boost: 0.75      # Override with: REGIME_BULLISH_QUEUE_BOOST
    bearish:
      preferred_strategies:           # Override with: REGIME_BEARISH_STRATEGIES ; Block list avoids minimal-YAML inline-list stringification
        - "short_the_rip"
        - "mean_reversion"
      preferred_priority: 0.85        # Override with: REGIME_BEARISH_PRIORITY
    neutral:
      preferred_strategies:           # Override with: REGIME_NEUTRAL_STRATEGIES ; Block list avoids minimal-YAML inline-list stringification
        - "range_sniper"
        - "mean_reversion"
      preferred_priority: 0.7         # Override with: REGIME_NEUTRAL_PRIORITY
    volatile:
      preferred_strategies:           # Override with: REGIME_VOLATILE_STRATEGIES ; Block list avoids minimal-YAML inline-list stringification
        - "scalper"
        - "volatility_breakout"
      preferred_priority: 0.9         # Override with: REGIME_VOLATILE_PRIORITY
      queue_priority_boost: 0.9       # Override with: REGIME_VOLATILE_QUEUE_BOOST
    default:
      preferred_priority: 0.5         # Override with: REGIME_DEFAULT_PRIORITY
      fallback_priority: 0.4          # Override with: REGIME_DEFAULT_FALLBACK

  adaptive_ob:
    execution_profile: "standard_mode"  # Hybrid: DCA+pyramiding enabled
    allow_low_volume: true         # Override with: STRATEGY_OB_ALLOW_LOW_VOLUME
    low_volume_requires_reversal_confirmation: true  # Guardrail: require reversal confirmation when overriding LOW volume
    adaptive_ob_require_reversal_confirmation_in_downtrend: true  # Guardrail: only for LOW/very_low volume; require strong reversal in downtrend
    downtrend_guard_adx_threshold: 30.0  # Optional: tune "strong trend" threshold (default 30)
    hook_delta: 1.0  # RSI hook delta for reversal telemetry (used by crash guard)
    volume_filters:
      enabled: true                 # Override with: STRATEGY_OB_VOLUME_FILTERS_ENABLED
      min_bucket: "NORMAL"          # Override with: STRATEGY_OB_VOLUME_FILTERS_MIN_BUCKET
      high_volume_min_bucket: "HIGH" # Override with: STRATEGY_OB_VOLUME_FILTERS_HIGH_VOL_MIN_BUCKET
      use_volume_strength_in_score: true  # Override with: STRATEGY_OB_VOLUME_FILTERS_USE_STRENGTH
      volume_score_weight: 0.15     # Override with: STRATEGY_OB_VOLUME_FILTERS_WEIGHT
    adaptive_ob_persistency_mode: "time"           # Options: time, bar_low_and_close, off
    adaptive_ob_persistency_seconds: 5              # Time-based dwell for RSI condition
    adaptive_ob_persistency_min_samples: 2          # Minimum ticks meeting condition
    adaptive_ob_persistency_min_bounce_pct: 0.0005  # Optional: require bounce from intrabucket min (e.g. 0.0005 = 0.05%)
    adaptive_ob_persistency_min_bounce_apply: downtrend_only  # always|downtrend_only|off
    adaptive_ob_trigger_price_source: "mid"        # mid -> mark -> forming_close fallback
    adaptive_ob_wick_closeness_k: 0.25              # Normalized closeness to low (bar_low_and_close)

    # Shock overlay: if dyn gate is ARMED (or score >= min), shrink position size.
    shock_overlay:
      enabled: true
      state: "ARMED"
      min_score: 0.60
      size_mult: 0.30

    # Scalp Mode: Crash/low-confidence counter-trend exits for adaptive_ob.
    # Motivation: strong bounces in bearish conditions often fade; clamp TP + pull stop to (near) breakeven quickly.
    scalp_mode:
      enabled: true
      regime_confidence_max: 0.35
      apply_regimes: ["bearish", "volatile"]
      apply_sides: ["long"]
      target_roi: 0.006            # 0.6% target in scalp mode
      be_activation_roi: 0.0025    # when +0.25% in profit, arm BE stop
      be_buffer_bps: 5.0           # BE stop buffer (5 bps = 0.05%)
    crash_guard:
      enabled: true
      panic_volume_buckets: ["HIGH", "EXTREME"]
      panic_tf: "5m"
      # Crash structure is computed on `panic_tf` OHLCV with `include_forming=true` (last bar may be forming).
      # Metrics compare the last bar vs previous; tune thresholds to manage false positives:
      # - `panic_fast_drop_pct`: close-to-close drop fraction
      # - `panic_atr_pct`: ATR/price (only counts as panic if price is down to avoid killing pumps)
      # - `panic_bear_body_ratio`: |close-open|/(high-low) with close < open
      # - `panic_ema_gap_atr_threshold`: (ema_fast - close)/ATR threshold (catches early waterfall phases)
      # During panic_state, entries are allowed only if strategy meta shows reversal: rsi_hook && (bull_candle || reclaim).
      panic_lookback_bars: 3
      panic_fast_drop_pct: 0.008          # Fraction (0.8%) close-to-close drop over panic_tf
      panic_atr_pct: 0.006                # ATR/price threshold (fraction)
      panic_bear_body_ratio: 0.60         # |close-open|/(high-low) for bearish candles
      panic_ema_gap_atr_threshold: 3.0    # Panic trigger: (ema_fast - close)/ATR >= threshold
      extreme_gap_atr_threshold: 5.0      # When crossed, require stricter reversal even if bucket != EXTREME
      cooldown_mode: "panic_only"         # off|panic_only|escalating|reversal_only
      cooldown_seconds: 30
      cooldown_escalation_steps: [30, 90, 180]
      cooldown_escalation_window_seconds: 600
      tp_rr_fix_mode: "penalize_rr"       # off|penalize_rr|clamp_tp
      tp_rr_fix_ema_gap_atr_threshold: 2.0
      tp_rr_fix_rr_penalty: 0.5
      tp_rr_fix_max_tp_atr_mult: 2.0

  adaptive_str:                      # Renamed: AdaptiveShortTheRip emits `strategy_name=adaptive_str`; `adaptive_short_the_rip` would be ignored
    execution_profile: "standard_mode"  # Hybrid: DCA+pyramiding enabled
    allow_low_volume: true         # Override with: STRATEGY_STR_ALLOW_LOW_VOLUME
    volume_filters:
      enabled: true                 # Override with: STRATEGY_STR_VOLUME_FILTERS_ENABLED
      min_bucket: "NORMAL"          # Override with: STRATEGY_STR_VOLUME_FILTERS_MIN_BUCKET
      high_volume_min_bucket: "HIGH" # Override with: STRATEGY_STR_VOLUME_FILTERS_HIGH_VOL_MIN_BUCKET
      use_volume_strength_in_score: true  # Override with: STRATEGY_STR_VOLUME_FILTERS_USE_STRENGTH
      volume_score_weight: 0.15     # Override with: STRATEGY_STR_VOLUME_FILTERS_WEIGHT
    panic_veto:
      volume_5m_enabled: true
      volume_5m_mult: 3.0
      volume_5m_window: 20

  mean_reversion:
    enabled: true
    execution_profile: "sniper_mode"  # Hybrid: NO DCA/NO pyramiding (sniper MR)
    timeframe: "1m"           # VWAP calculation window
    signal_timeframe: "5m"    # Decision timeframe
    price_source: "signal_close"  # Override with: STRATEGIES__MEAN_REVERSION__PRICE_SOURCE ; Options: signal_close, forming_close, mid, mark, last
    # Proximity gate for MR near-miss → waiting-room (FAST_PRICE_WATCH)
    # Unit: fractional distance to band (e.g., 0.0010 = 10 bps). Lower = fewer "far_from_trigger" pendings.
    soft_deferral_threshold: 0.0010
    fast_watch_eps_bps: 10
    # Optional (opt-in): FastWatch v2 - split "near monitoring" vs "touch trigger" + bid/ask touch confirm + freshness guard.
    # When unset, legacy behavior remains (eps_bps drives trigger as well).
    fast_watch:
      # 1) Sigma delta (high-vol adaptive)
      touch_sigma_delta: 0.12

      # 2) Static BPS safety floor (low-vol backstop)
      touch_eps_bps: 6

      # 3) Waiting room / monitoring thresholds (wider)
      near_sigma_delta: 0.35
      near_bps: 15

      # 4) Safety clamps (price units) for sigma component only
      min_touch_abs_px: 5.0
      max_touch_abs_px: 150.0
      max_near_abs_px: 300.0

      # Optional (volatility-adaptive): if `condition_data.trigger_sigma` is present, effective epsilon becomes:
      # eps_px = max(trigger_price * touch_eps_bps/10000, clamp(trigger_sigma * touch_sigma_delta))
      # (and similarly for near_*). This ensures sigma-mode never narrows the legacy bps tolerance.
      touch_price_source: "bidask"  # Confirmation requires bid/ask (no mid-touch)
      max_ticker_age_ms: 500        # Applies ONLY to recheck trigger (strict freshness)
      recheck_cooldown_ms: 1500     # Per pending_id DoS guard
      allow_touch_entry: false      # Override with: STRATEGIES__MEAN_REVERSION__FAST_WATCH__ALLOW_TOUCH_ENTRY ; Touch can override MR in-band veto when confirmed
      promote_override:
        enabled: true               # Override with: STRATEGIES__MEAN_REVERSION__FAST_WATCH__PROMOTE_OVERRIDE__ENABLED
        mode: "observe"             # Override with: STRATEGIES__MEAN_REVERSION__FAST_WATCH__PROMOTE_OVERRIDE__MODE ; observe | enforce | off ; Stage-1 default: telemetry-only
        canary_symbols: []          # Override with: STRATEGIES__MEAN_REVERSION__FAST_WATCH__PROMOTE_OVERRIDE__CANARY_SYMBOLS ; observe modunda sadece bu semboller enforce edilir (liste/CSV, "*"=all)
        min_z_score: 2.0            # Override with: STRATEGIES__MEAN_REVERSION__FAST_WATCH__PROMOTE_OVERRIDE__MIN_Z_SCORE
        max_dist_bps: 2.0           # Override with: STRATEGIES__MEAN_REVERSION__FAST_WATCH__PROMOTE_OVERRIDE__MAX_DIST_BPS
        max_adx: 20                 # Override with: STRATEGIES__MEAN_REVERSION__FAST_WATCH__PROMOTE_OVERRIDE__MAX_ADX
        min_volume_strength: 0.50   # Override with: STRATEGIES__MEAN_REVERSION__FAST_WATCH__PROMOTE_OVERRIDE__MIN_VOLUME_STRENGTH
        respect_trend_veto: true    # Override with: STRATEGIES__MEAN_REVERSION__FAST_WATCH__PROMOTE_OVERRIDE__RESPECT_TREND_VETO
        blocked_shock_states: ["ARMED", "TRIGGERED"]  # Override with: ...__BLOCKED_SHOCK_STATES (comma-separated or JSON list)
    vwap_lookback: 1440       # 1440 bars in VWAP timeframe (timeframe=1m => ~24h)
    band_multiplier: 2.0
    stop_loss_std_delta: 1.0  # Override with: STRATEGIES__MEAN_REVERSION__STOP_LOSS_STD_DELTA ; Z-score stop distance beyond the active band (in sigmas)
    impulse_veto:
      enabled: true
      body_atr_mult: 1.5
      sum2_range_atr_mult: 2.5
    rejection_confirmation:
      enabled: true
      upper_wick_ratio_min: 0.8
      recheck_mode: "enforce"   # Override with: STRATEGIES__MEAN_REVERSION__REJECTION_CONFIRMATION__RECHECK_MODE ; observe | enforce | off ; Phase-1 default: enforce on recheck
    adx_threshold: 34.0
    regime_policy:
      enabled: true
      trend_down:
        long_mode: "disabled"        # disabled | confirmed_only
        min_breach_bps: -20
        require_reclaim: true
        size_mult: 0.5
        rising_adx_floor: 20
        rising_adx_size_mult: 0.5
        rising_adx_lookback: 3
        adx_floor: 25
      trend_up:
        short_mode: "extreme_only"   # Override with: STRATEGIES__MEAN_REVERSION__REGIME_POLICY__TREND_UP__SHORT_MODE ; off | disabled | size_mult | extreme_only (alias: confirmed_only)
        adx_floor: 25                # Override with: STRATEGIES__MEAN_REVERSION__REGIME_POLICY__TREND_UP__ADX_FLOOR
        size_mult: 0.5               # Override with: STRATEGIES__MEAN_REVERSION__REGIME_POLICY__TREND_UP__SIZE_MULT ; used when short_mode=size_mult
        extreme_z_min: 2.5           # Override with: STRATEGIES__MEAN_REVERSION__REGIME_POLICY__TREND_UP__EXTREME_Z_MIN ; used when short_mode=extreme_only
      shock:
        long_mode: "disabled"
        short_mode: "disabled"       # Override with: STRATEGIES__MEAN_REVERSION__REGIME_POLICY__SHOCK__SHORT_MODE ; off | disabled ; Phase-1 default: short-side shock veto enabled
        state: "ARMED"
        min_score: 0.60
    vsa_shadow:
      enabled: true
      rejection_window: 12
      z_entry: 1.6
      z_cap: 3.0
      rr_span: 0.5
    reentry_guard:
      enabled: true
      require_vwap_reclaim_after_stop: true
      short_side:
        enabled: true
        clear_on_band_breach: true
        clear_on_z_threshold: 2.0
    high_adx_z_threshold: 1.90
    adx_slope_lookback: 5
    adx_slope_eps: 0.2
    net_profit_filter:
      enabled: true
      cost_bps_assumed: 6.0
      min_net_reward_bps: 2.0
    allocation_pct: 0.20
    dynamic_controller:
      enabled: true
      target_outside_pct: 0.15
      abs_z_window: 500
      warmup_samples: 50
      update_interval_sec: 60        # Override with: STRATEGIES__MEAN_REVERSION__DYNAMIC_CONTROLLER__UPDATE_INTERVAL_SEC
      min_m_change: 0.05
      m_min: 1.0                     # Override with: STRATEGIES__MEAN_REVERSION__DYNAMIC_CONTROLLER__M_MIN ; Lower = tighter bands in calm markets
      m_max: 3.0                     # Override with: STRATEGIES__MEAN_REVERSION__DYNAMIC_CONTROLLER__M_MAX ; Upper cap in bursts
      log_every_update: true
      freeze_on_trend: true
      adx_freeze_threshold: 36.0     # Override with: STRATEGIES__MEAN_REVERSION__DYNAMIC_CONTROLLER__ADX_FREEZE_THRESHOLD ; Looser freeze (old: 25 froze too early)
      dynamic_lookback:
        enabled: true                # Override with: STRATEGIES__MEAN_REVERSION__DYNAMIC_CONTROLLER__DYNAMIC_LOOKBACK__ENABLED ; Vital: adapt lookback instead of fixed 1440 bars
        # NOTE: lookback_* values are BARS in the VWAP timeframe (strategies.mean_reversion.timeframe), not minutes.
        # Example: timeframe=1m -> 120 bars ≈ 120 minutes; timeframe=5m -> 120 bars ≈ 10 hours.
        lookback_static: 180         # 3 hours (timeframe=1m)
        lookback_min: 60             # 1 hour (timeframe=1m)
        lookback_max: 300            # 5 hours (timeframe=1m). Requires df_vwap to contain this many bars.
        atr_expand_pct: 0.0045
        atr_squeeze_pct: 0.0020
        atr_hysteresis_pct: 0.00015
    # Optional (opt-in): Lightweight 15s trade-aggregator + adaptive band overlay.
    # - Uses BingX WebSocket `@trade` stream (no 15s klines required).
    # - Gap filling is safety-capped (hard cap 50).
    adaptive_settings:
      enabled: true                   # Override with: STRATEGIES__MEAN_REVERSION__ADAPTIVE_SETTINGS__ENABLED
      gap_fill_cap: 50                # Override with: STRATEGIES__MEAN_REVERSION__ADAPTIVE_SETTINGS__GAP_FILL_CAP
      volume_lookback: 20             # Override with: STRATEGIES__MEAN_REVERSION__ADAPTIVE_SETTINGS__VOLUME_LOOKBACK
      slope_lookback: 50              # Override with: STRATEGIES__MEAN_REVERSION__ADAPTIVE_SETTINGS__SLOPE_LOOKBACK
      enable_volume_adapt: true       # Override with: STRATEGIES__MEAN_REVERSION__ADAPTIVE_SETTINGS__ENABLE_VOLUME_ADAPT
      enable_slope_shift: true        # Override with: STRATEGIES__MEAN_REVERSION__ADAPTIVE_SETTINGS__ENABLE_SLOPE_SHIFT
      volume_weight: 1.0              # Override with: STRATEGIES__MEAN_REVERSION__ADAPTIVE_SETTINGS__VOLUME_WEIGHT ; 0..1 weight for vol_ratio influence
      volume_mult_min: 0.8            # Override with: STRATEGIES__MEAN_REVERSION__ADAPTIVE_SETTINGS__VOLUME_MULT_MIN
      volume_mult_max: 1.5            # Override with: STRATEGIES__MEAN_REVERSION__ADAPTIVE_SETTINGS__VOLUME_MULT_MAX
      slope_shift_mult: 1.0           # Override with: STRATEGIES__MEAN_REVERSION__ADAPTIVE_SETTINGS__SLOPE_SHIFT_MULT
      slope_shift_std_cap: 0.5        # Override with: STRATEGIES__MEAN_REVERSION__ADAPTIVE_SETTINGS__SLOPE_SHIFT_STD_CAP ; cap shift to N*std
    rsi_rebound_guard:
      enabled: true
      tf: "1m"
      use_closed_only: true
      activation_rsi: 25.0
      activation_z_score: 2.2
      rebound_rsi: 27.0
      max_wait_s: 120
    exit_settings:
      max_hold_seconds: 900          # Time-stop: close stale trades that never reached fee-lock
      fee_lock_trigger_pct: 0.0014   # Fee-lock trigger (price pct)
      fee_lock_offset_pct: 0.0012    # Fee-lock stop offset from entry (price pct)

# ==============================================================================
# POSITION EXIT MANAGEMENT
# ==============================================================================
position_management:
  exit_monitoring:
    enabled: true                     # Override with: EXIT_MONITORING_ENABLED
    check_frequency: 5                # Override with: EXIT_CHECK_FREQUENCY
  position_monitoring_loop_interval_s: 10  # Override with: POSITION_MONITORING_LOOP_INTERVAL_S ; Engine loop tick (separate from exit_monitoring.check_frequency)
  reconciliation_watchdog:
    enabled: true                     # Runtime exchange/local reconcile loop
    interval_s: 30                    # Reconcile cadence (seconds)
    only_real_execution: true         # Run only when real execution is enabled
    run_in_paper: false               # Allow running in paper mode when true
    adopt_orphans: false              # Auto-import exchange orphan positions into local tracking
  time_based_exit:
    max_position_duration: 3600       # Override with: MAX_POSITION_DURATION
  exit_guardrails:
    eps: 0.0                          # Override with: EXIT_GUARDRAIL_EPS
  trailing_stop:
    min_trail_step_bps: 0             # Override with: TRAILING_STOP_MIN_STEP_BPS ; Safety floor only (enable/delta/activation resolved via Signal/Profile)
    min_trail_update_interval_s: 0    # Override with: TRAILING_STOP_MIN_UPDATE_INTERVAL_S ; Safety floor only (enable/delta/activation resolved via Signal/Profile)

# ==============================================================================
# PYRAMIDING (Shadow mode by default)
# ==============================================================================
pyramiding:
  enabled: true                      # Override with: PYRAMIDING_ENABLED (shadow: no behavior change)
  max_layers_per_symbol: 3            # Override with: PYRAMIDING_MAX_LAYERS_PER_SYMBOL
  min_scale_in_quality: 0.445         # Override with: PYRAMIDING_MIN_SCALE_IN_QUALITY
  min_scale_in_unrealized_pnl_pct: 0.005 # Override with: PYRAMIDING_MIN_SCALE_IN_PNL (future use)
  min_scale_in_distance_pct: 0.005    # Override with: PYRAMIDING_MIN_SCALE_IN_DISTANCE (future use)
  experimental:
    use_add_quality_logic: true        # Feature flag: purpose-driven scoring for scale-in (hard gates still apply)
  min_add_quality: 0.50               # Add-quality threshold (0..1)
  add_quality_weights:
    signal: 0.60
    headroom: 0.40

# ==============================================================================
# DCA (Dollar-Cost Averaging) - v1 (disabled by default; paper-mode first)
# ==============================================================================
dca:
  enabled: true                      # Override with: DCA_ENABLED

  # DCA is only allowed for these base strategies (resolved from the anchor/base position).
  # This matches the design decision: adaptive_str + adaptive_ob only.
  allowed_base_strategies:
    - adaptive_str
    - adaptive_ob

  # Fallback timeframe used for DCA enrichment/data-fetch when the base position does not carry a timeframe.
  default_timeframe: "5m"

  strategy:
    max_layers: 3                     # initial entry + up to 2 DCA layers
    step_pct: 0.004                   # adverse move per layer (1.0%) - kept < min(max_sl_pct)=0.015 so DCA can trigger before SL
    step_scale: 1.0                   # constant step spacing in v1
    position_weights:                 # decreasing sizes; no martingale (block list avoids minimal-YAML inline-list stringification)
      - 1.0
      - 0.7
      - 0.5
    min_volume_usdt: 10.0             # floor notional per DCA layer
    cooldown_seconds: 600             # min spacing between DCA layers per symbol
    spread_threshold_pct: 0.001       # block DCA when spread is too wide
    volatility_threshold_pct: 0.02    # block DCA when volatility is elevated

  risk_limits:
    max_dca_portfolio_pct: 0.10       # cap total DCA exposure to 10% of equity
    max_heat_per_symbol: 0.05         # cap symbol DCA exposure to 5% of equity
    panic_cutoff_pct: 0.08            # block further DCA beyond ~8% drawdown from anchor
    allow_concurrent_with_trend: false  # v1: DCA and trend pyramiding are mutually exclusive

  exit:
    mode: per_position                # v1: exits remain per position
    shared_stop_loss: false           # stack-level SL/TP reserved for later phases

# ==============================================================================
# ML (MACHINE LEARNING) CONFIGURATION (v3.6 - Refactored for Clarity)
# ==============================================================================
# Bu blok, tüm makine öğrenmesi bileşenlerinin ayarlarını içerir.
# Her ana bileşenin (Price Predictor, Regime Predictor, RL Agent) kendi
# parametre bloğu vardır. Bu, yapılandırmayı temiz, yönetilebilir ve hatasız tutar.
# ==============================================================================
ml:
  enabled: true                       # Tüm ML özelliklerini etkinleştiren ana anahtar. Override: ML_ENABLED

  # ----------------------------------------------------------------------------
  # A) GENEL ÖZELLİK MÜHENDİSLİĞİ (Tüm Modeller İçin Ortak)
  # Bu ayarlar, tüm ML modellerine girdi olarak verilen teknik indikatörlerin
  # nasıl hesaplanacağını tanımlar.
  # ----------------------------------------------------------------------------
  features:
    rsi_period: 14                    # Override: ML_FEAT_RSI_PERIOD
    atr_period: 14                    # Override: ML_FEAT_ATR_PERIOD
    macd_fast: 12                     # Override: ML_FEAT_MACD_FAST
    macd_slow: 26                     # Override: ML_FEAT_MACD_SLOW
    macd_signal: 9                    # Override: ML_FEAT_MACD_SIGNAL
    bb_period: 20                     # Override: ML_FEAT_BB_PERIOD
    bb_std: 2                         # Override: ML_FEAT_BB_STD
    volatility_windows:               # Override: ML_FEAT_VOL_WINDOWS (block list avoids minimal-YAML inline-list stringification)
      - 5
      - 10
      - 20
      - 50
    momentum_windows:                 # Override: ML_FEAT_MOM_WINDOWS (block list avoids minimal-YAML inline-list stringification)
      - 5
      - 10
      - 20
      - 50

  # ----------------------------------------------------------------------------
  # B) FİYAT TAHMİN MOTORU (AdvancedPricePredictionEngine)
  # Fiyat hareketlerini ve yönünü tahmin eden LSTM ve Transformer modellerinin ayarları.
  # ----------------------------------------------------------------------------
  price_prediction:
    # 1. Genel Ayarlar
    enabled: true                     # Override with: ML_PRED_ENABLED
    timeframes:                        # Override with: ML_PRED_TIMEFRAMES (block list avoids minimal-YAML inline-list stringification)
      - "5m"
      - "15m"
      - "30m"
      - "1h"
      - "4h"
    update_interval_seconds: 60       # Override: ML_PRED_UPDATE_INTERVAL
    cache_ttl_seconds: 300            # Override: ML_PRED_CACHE_TTL
    
    # 2. Model Mimarisi (Bu motorun kullanacağı modeller)
    models:                           # Override: ML_MODELS (block list avoids minimal-YAML inline-list stringification)
      - "lstm"
      - "transformer"
    feature_size: 42                  # Override: ML_FEATURE_SIZE
    forecast_horizon: 12              # Override: ML_FORECAST_HORIZON

    # 3. Model Parametreleri (SADECE Fiyat Tahmincisi için)
    model_params:
      lstm:
        hidden_size: 128              # Override with: ML_PRED_LSTM_HIDDEN
        num_layers: 3                 # Override with: ML_PRED_LSTM_LAYERS
        dropout: 0.2                  # Override with: ML_PRED_LSTM_DROPOUT
      transformer:
        d_model: 256                  # Override with: ML_PRED_TRANS_D_MODEL
        nhead: 8                      # Override with: ML_PRED_TRANS_NHEAD
        num_layers: 6                 # Override with: ML_PRED_TRANS_LAYERS
    
    # 4. Ensemble (Model Birleştirme) Ağırlıkları
    ensemble_weights:
      lstm: 0.5                       # Override with: ML_PRED_WEIGHT_LSTM
      transformer: 0.5                # Override with: ML_PRED_WEIGHT_TRANSFORMER

  # ----------------------------------------------------------------------------
  # C) PİYASA REJİMİ TAHMİNCİSİ (MLRegimePredictor)
  # Piyasanın "Bullish", "Bearish", "Neutral" veya "Volatile" rejimlerinden
  # hangisinde olduğunu tahmin eden modellerin (Random Forest vb.) ayarları.
  # ----------------------------------------------------------------------------
  regime_prediction:
    enabled: true                     # Override with: ML_REGIME_ENABLED
    min_confidence_threshold: 0.6     # Override with: ML_REGIME_MIN_CONFIDENCE
    
    # NEW: Soft-Weighting Configuration
    # Instead of hard cutoff, use graduated weighting based on confidence
    soft_weighting_enabled: true      # Override: REGIME_SOFT_WEIGHT_ENABLED
    min_confidence_hard_reject: 0.30  # Override: REGIME_MIN_CONF_REJECT (Below this, completely ignore)
    min_confidence_full_weight: 0.60  # Override: REGIME_MIN_CONF_FULL (Above this, use full weight)
    
    # 1. Model Parametreleri (SADECE Rejim Tahmincisi için)
    # ⚠️ KRİTİK: Bu parametreler TÜM kod tabanında kullanılır:
    #   - src/ml/neural_networks.py (LSTMRegimePredictor default değerleri)
    #   - src/ml/model_trainer.py (model eğitimi sırasında)
    #   - src/ml/regime_predictor.py (model yükleme sırasında)
    #   - scripts/train_all_models.py (eğitim betiğinde)
    # Bu değerleri değiştirirseniz, eski modelleri SİLİP yeniden eğitmelisiniz!
    # 
    # FAZ 3.1 OPTIMIZATION: Neural network parameters optimized for better performance
    model_params:
      random_forest:
        n_estimators: 150             # Override with: ML_RF_N_ESTIMATORS
        max_depth: 15                 # Override with: ML_RF_MAX_DEPTH
      xgboost:
        n_estimators: 200             # Override with: ML_XGB_N_ESTIMATORS
        learning_rate: 0.05           # Override with: ML_XGB_LEARNING_RATE
      lstm_regime:
        # FAZ 3.3 VALUES (Anti-Overfit V2) - SYNCHRONIZED WITH model_trainer.py
        hidden_size: 64               # ✅ SYNCED: Override: ML_LSTM_HIDDEN (matches model_trainer.py LSTM_HIDDEN_SIZE)
        num_layers: 2                 # ✅ SYNCED: Override: ML_LSTM_LAYERS (matches model_trainer.py LSTM_NUM_LAYERS)
        dropout: 0.6                  # ✅ SYNCED: Override: ML_LSTM_DROPOUT (matches model_trainer.py LSTM_DROPOUT)
    
    # 2. Ensemble Ağırlıkları
    ensemble_weights:
      random_forest: 0.6              # Override with: ML_REGIME_WEIGHT_RF
      xgboost: 0.4                    # Override with: ML_REGIME_WEIGHT_XGB
      # lstm_regime: 0.2 # (Gelecekte eklenebilir)

  # ----------------------------------------------------------------------------
  # D) PEKİŞTİRMELİ ÖĞRENME AJANI (TradingRLAgent)
  # Diğer sinyalleri onaylayan veya veto eden nihai karar verici.
  # ----------------------------------------------------------------------------
  reinforcement_learning:
    enabled: true                     # Override: ML_RL_ENABLED
    legacy_dqn_enabled: false         # Override with: ML_RL_LEGACY_ENABLED
    ppo_enabled: true                 # Override with: ML_RL_PPO_ENABLED
    ppo_symbols: BTC/USDT:USDT        # Override with: ML_RL_PPO_SYMBOLS
    ppo_timeframe: "1h"               # Override with: ML_RL_PPO_TIMEFRAME
    ppo_include_forming: false        # Override with: ML_RL_PPO_INCLUDE_FORMING (false = closed-only candles)
    ppo_model_path: "artifacts/ppo/ppo_trading_agent.zip" # Override with: ML_RL_PPO_MODEL
    ppo_fallback_score: 0.5           # Override with: ML_RL_PPO_FALLBACK
    ppo_rr_down_mult: 0.9             # Override with: ML_RL_PPO_RR_DOWN
    ppo_rr_up_mult: 1.3               # Override with: ML_RL_PPO_RR_UP
    ppo_position_base: 0.5            # Override with: ML_RL_PPO_POS_BASE
    ppo_position_bonus: 0.5           # Override with: ML_RL_PPO_POS_BONUS
    ppo_lookback_bars: 240            # Override with: ML_RL_PPO_LOOKBACK_BARS (candles fetched for PPO state)
    ppo_lookback_windows:              # Override with: ML_RL_PPO_LOOKBACK_WINDOWS (block list avoids minimal-YAML inline-list stringification)
      - 12
      - 24
      - 48
      - 96
    ppo_conf_threshold: 0.60          # Override with: ML_RL_PPO_CONF_THRESHOLD
    ppo_min_margin: 0.0               # Override with: ML_RL_PPO_MIN_MARGIN (p_long - p_flat)
    ppo_health_min_std: 0.001         # Override with: ML_RL_PPO_HEALTH_MIN_STD (std of p_long over window)
    ppo_health_window: 30             # Override with: ML_RL_PPO_HEALTH_WINDOW
    ppo_health_clip_frac_limit: 0.30  # Override with: ML_RL_PPO_HEALTH_CLIP_LIMIT
    ppo_require_vecnorm: true         # Override with: ML_RL_PPO_REQUIRE_VECNORM
    # PPO cache hit log rate limit (seconds). Env-only: PPO_CACHE_LOG_INTERVAL_SEC (default 300).
    
    # Training Mode Control
    # ============================================================================
    # CRITICAL: This parameter controls the agent's learning behavior
    # ============================================================================
    # When TRUE (training mode):
    #   - Agent starts with high exploration (epsilon_start = 1.0)
    #   - Epsilon decays over episodes (epsilon_decay = 0.995)
    #   - Agent learns from experiences and updates weights
    #   - Use for: Training scripts (train_all_models.py)
    #
    # When FALSE (inference mode):
    #   - Agent uses minimal exploration (epsilon_inference = 0.01)
    #   - No epsilon decay
    #   - Agent uses pre-trained weights without learning
    #   - Use for: Live trading
    # ============================================================================
    training_mode: false               # Override: ML_RL_TRAINING_MODE (false → true for training)

    # Davranış Ayarları
    hold_confidence_threshold: 0.60   # Override: ML_RL_HOLD_CONFIDENCE_THRESHOLD
    
    # Exploration Parameters (Epsilon-Greedy Strategy)
    epsilon_inference: 0.01           # Override: ML_RL_EPSILON_INFERENCE (for live trading, minimal exploration)
    epsilon_start: 1.0                # Override: ML_RL_EPSILON_START (training: start with full exploration)
    epsilon_decay: 0.97               # Override: ML_RL_EPSILON_DECAY (training: decay rate per episode)
    epsilon_min: 0.01                 # Override: ML_RL_EPSILON_MIN (training: minimum exploration floor)
    
    regime_bias_strength: 0.0         # Override: ML_RL_REGIME_BIAS
    max_regime_bias: 3.0              # Override: ML_RL_MAX_REGIME_BIAS
    min_regime_confidence_for_bias: 0.6  # Override: ML_RL_MIN_REGIME_CONF
    q_std_bypass_threshold: 0.0001    # Override: ML_RL_Q_STD_BYPASS
    risk_penalty_strength: 10.0       # Override: ML_RL_RISK_PENALTY

    # Temel Algoritma Parametreleri (Uzman kullanıcılar için)
    learning_rate: 0.00003            # Override: ML_RL_LEARNING_RATE
    gamma: 0.95                       # Override: ML_RL_GAMMA
    gradient_clip_norm: 1.0           # Override: ML_RL_GRADIENT_CLIP

    # Reward normalizasyonu ve stabilite ayarları
    reward_clip_enabled: true         # Override: ML_RL_REWARD_CLIP_ENABLED
    reward_clip_min: -2.0             # Override: RL_REWARD_CLIP_MIN
    reward_clip_max: 2.0              # Override: RL_REWARD_CLIP_MAX
    reward_scale: 1.0                 # Override: RL_REWARD_SCALE

    # Trade penaltisi: her adımda portföyün ne kadarlık kısmını çevirdiğine (0–1)
    # bağlı küçük bir ceza uygular. Örn: 0.001 → portföyün %100'ünü tek adımda
    # çevirmek reward'dan 0.001 düşer.
    trade_penalty_alpha: 0.0          # Override: ML_RL_TRADE_PENALTY_ALPHA

    # HOLD / idle cost: Ajan hiçbir trade yapmayıp sürekli HOLD ederse,
    # her adımda küçük bir ceza alır ve uzun vadede negatif reward birikir.
    idle_cost: 0.0                    # Override: ML_RL_IDLE_COST

    target_update_freq: 50            # Override: ML_RL_TARGET_UPDATE_FREQ
    batch_size: 32                    # Override: ML_RL_BATCH_SIZE
    buffer_size: 100000               # Override: ML_RL_BUFFER_SIZE

  # ----------------------------------------------------------------------------
  # E) SIGNAL SCORING SYSTEM
  # Composite scoring system for signal quality assessment
  # ----------------------------------------------------------------------------
  signal_scoring:
    enabled: true                     # Override: SIGNAL_SCORING_ENABLED
    min_score_to_trade: 75            # Override: SIGNAL_MIN_SCORE (Minimum score to execute trade)
    
    # Component weights (should sum to 1.0)
    weights:
      strategy: 0.3                   # Override: SCORE_WEIGHT_STRATEGY (Base strategy signal strength)
      ml_price: 0.3                   # Override: SCORE_WEIGHT_ML (ML price prediction confidence)
      regime: 0.2                     # Override: SCORE_WEIGHT_REGIME (Regime prediction weight)
      risk_reward: 0.2                # Override: SCORE_WEIGHT_RR (Risk/reward ratio quality)

  # =======================================================
  # GEMMA ML Pipeline Configuration
  # =======================================================
  gemma:
    # GEMMA'yı etkinleştirmek için 'true' yapın veya GEMMA_ENABLED ortam değişkenini kullanın.
    # Üretimde devreye alınana kadar 'false' kalması önerilir.
    enabled: true  # Override with: GEMMA_ENABLED ; Single operational flag (bundle selection via `models.active_bundle`; no `models.gemma.*` enable switches)
    
    # Model Yolları (.pt uzantılı TorchScript modelleri olmalıdır)
    # Updated to new production location (Plan 2)
    model_path: "data/models/final/gemma_price.pt" # Override with: GEMMA_MODEL_PATH
    
    # Özellik (Feature) Konfigürasyon Dosyaları
    features_path: "features/gemma/selected/gemma_price_selected_82.json" # Override with: GEMMA_FEATURES_PATH
    feature_count: 82                 # Override with: GEMMA_FEATURE_COUNT
    
    # Yardımcı Dosyalar
    # Updated to new production location (Plan 2) - co-located with models
    scaler_path: "data/models/final/gemma_price_scaler.joblib" # Override with: GEMMA_SCALER_PATH
    feature_mask_path: "data/cache/gemma/feature_selection_mask.npy" # Override with: GEMMA_FEATURE_MASK_PATH
    
    # Gölge Modu (Mevcut sistemle paralel çalışarak doğrulama yapar)
    shadow_mode: false                # Override with: GEMMA_SHADOW_MODE
    shadow_duration_hours: 48         # Override with: GEMMA_SHADOW_DURATION
    
    # Performans Ayarları
    cache_ttl: 30                     # Override with: GEMMA_CACHE_TTL
    max_inference_time: 0.5           # Override with: GEMMA_MAX_INFERENCE_TIME
    
    # Circuit Breaker (Hata toleransı)
    # Model tahmininde art arda hata alınması durumunda devreye girer.
    circuit_breaker:
      enabled: true                   # Override with: GEMMA_CIRCUIT_BREAKER_ENABLED
      failure_threshold: 5            # Override with: GEMMA_FAILURE_THRESHOLD
      recovery_timeout: 60            # Override with: GEMMA_RECOVERY_TIMEOUT
    
    # Training Configuration
    thresholds:
      deployment_accuracy: 0.72       # Override with: GEMMA_DEPLOYMENT_ACCURACY
      min_samples: 1000               # Override with: GEMMA_MIN_SAMPLES
    
    training:
      batch_size: 64                  # Override with: GEMMA_BATCH_SIZE
      epochs: 50                      # Override with: GEMMA_EPOCHS
      learning_rate: 0.0001330        # Override with: GEMMA_LEARNING_RATE
      early_stopping_patience: 10     # Override with: GEMMA_EARLY_STOPPING_PATIENCE
    
    architecture:
      input_size: 82                  # Override with: GEMMA_INPUT_SIZE
      hidden_size: 55                 # Override with: GEMMA_HIDDEN_SIZE
      num_layers: 3                   # Override with: GEMMA_NUM_LAYERS
      dropout: 0.3243                 # Override with: GEMMA_DROPOUT
      num_classes: 3                  # Override with: GEMMA_NUM_CLASSES
      
    feature_set: "gemma_v1"          # Override with: GEMMA_FEATURE_SET
    
  # =======================================================
  # AI-Gate Güven Eşikleri
  # =======================================================
  price:
    # Fiyat tahmini için minimum güven skoru
    min_confidence: 0.66              # Override with: ML_PRICE_MIN_CONFIDENCE
    
  regime:
    # Rejim tahmini için minimum güven skoru
    min_confidence: 0.60              # Override with: ML_REGIME_AIGATE_MIN_CONFIDENCE

# ==============================================================================
# MODEL BUNDLE MANAGEMENT
# ==============================================================================
models:
  # Model bundle management - dynamic feature adaptation
  active_bundle: "artifacts/gemma/final"  # Override with: ML_ACTIVE_BUNDLE ; Artifact selection only (GEMMA runtime enable is `ml.gemma.enabled`)
  fallback_bundle: "artifacts/legacy"  # Override with: ML_FALLBACK_BUNDLE
  
  # Deployment configuration
  deployment:
    validation_mode: "strict"         # Override with: MODEL_VALIDATION_MODE
