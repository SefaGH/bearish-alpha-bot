[mypy]
# Exclude directories that don't need type checking
exclude = (?x)(
    ^examples[\\/]
    |^backups[\\/]
    |^tests[\\/]
)

# Third-party libraries without stubs
[mypy-requests.*]
ignore_missing_imports = True

[mypy-ccxt.*]
ignore_missing_imports = True

[mypy-pandas_ta.*]
ignore_missing_imports = True

[mypy-telegram.*]
ignore_missing_imports = True
